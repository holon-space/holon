        mode_axes: File adapter
        entry: "`crates/holon-filesystem/src/`"
    open_reds: [org-blocks-ref-diverge, org-render-echo-loop, page-without-own-file, loro-stable-id-missing, loro-frontier-height, delete-backward-merge-budget, lib-seed-wide-drift]
