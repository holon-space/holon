# The authored half of docs/Architecture/FeatureMap.md.
#
# Everything a human judges lives here: which features exist, how they group
# into areas, the one-clause descriptions, the "ruled by" links, the mode axes,
# the entry points, and the free-form notes. Everything a source of truth can
# answer is derived at render time by scripts/featuremap.py — the transition
# alphabet, the invariant id universe, the known-red statuses, and which of
# those nothing here claims. Edit this file, then run:
#
#   python3 scripts/featuremap.py generate
#
# SCHEMA
#   title, generated_banner, lead, unpinned_lead, unclaimed_lead,
#   sources_lead, sources_closing  — scalars rendered verbatim.
#   keystone_note   — a scalar with {transitions} / {invariants} / {families}
#                     placeholders filled from the sources.
#   sections[]      — {heading, body}: prose between the lead and the legend.
#   legend[]        — {column, holds}: the legend table.
#   source_table[]  — {content, source}: the "Sources" table.
#   areas[]         — {name, rows[], open_reds[]?, note?}. `open_reds` names
#                     keys from docs/Testing/KeystoneKnownReds.md; only rows
#                     still at status `known-red` render.
#   areas[].rows[]  — {feature, what, ruled_by, mode_axes, entry} required;
#                     {transitions[], invariants[], pin_prefix, pin_note}
#                     build the "Pinned by" cell; a row with no transitions and
#                     no invariants MUST carry `unpinned` (a clause for the
#                     Unpinned section) or `unpinned_exempt` (why it needs no
#                     keystone pin). A pinned row may still carry `unpinned`
#                     when only part of it is observed.
#
# The generator FAILS on a transition, invariant id, or known-red key that the
# sources no longer declare — a rename is an error here, never a silent drop.
#
# FORMAT: a strict YAML subset (block mappings, `- ` sequences, `[a, b]` flow
# sequences, plain and "quoted" scalars, `>` folded and `|` literal blocks).
# Comments get their own line. Quote any value starting with `[`, `*` or `|`.

title: Holon Feature Map

generated_banner: >
  GENERATED — edit [`featuremap.yaml`](featuremap.yaml), then run
  `python3 scripts/featuremap.py generate`. `python3 scripts/featuremap.py check`
  fails when this file and the pin sources disagree.

lead: >
  The one-page answer to *"which features could this change impact?"*. Rows are
  user-visible features and cross-cutting aspects; columns say where each one is
  **pinned** (what test fails if you break it), **ruled** (which decision governs
  it), and **entered** (the one file to open first).

sections:
  - heading: How to use this
    body: |
      - **Before a refactoring discussion**, scan the area tables for anything your
        change touches. A row with a pin is safe to change boldly — the keystone will
        tell you. A row in [Unpinned features](#unpinned-features) is one you must
        reason about by hand.
      - **Pins are the currency.** A "Pinned by" cell names either a keystone
        *transition* (what drives the feature) or an *invariant id* (what observes it).
        Both are verbatim from code. Grep the name and you land on the test.
      - **This is a map of pointers, not a spec.** Every cell should be one clause.
        If you want the detail, follow the link.
  - heading: How to keep it current
    body: |
      - A discussion that adds a feature adds a row to
        [`featuremap.yaml`](featuremap.yaml) and regenerates.
      - A new transition or invariant needs no edit to be visible: it appears under
        [Unclaimed by any row](#unclaimed-by-any-row) until a row claims it.
      - A row that moves out of [Unpinned features](#unpinned-features) is a small
        celebration — note it in the PR that added the pin.
      - **Stale links are bugs, and here they are fatal.** Generation refuses a row
        naming a path, a link target, a transition, an invariant id, or a known-red
        key that no longer resolves.

legend:
  - column: Pinned by
    holds: >
      Keystone transition struct names (`SplitBlock`) and/or invariant ids
      (`inv-no-orphan-blocks`), verbatim from code. Transitions are declared by
      `declare_e2e_transitions!` in
      `crates/holon-integration-tests/src/pbt/transitions/`; invariant ids are
      declared by their bodies and correspondence families and assembled in
      `crates/holon-integration-tests/src/pbt/composed/catalog.rs`.
  - column: Ruled by
    holds: >
      An ADR under [`docs/adr/`](../adr/), or an invariant number from
      [Model.md](Model.md).
  - column: Mode axes
    holds: >
      Which of [Model.md](Model.md)'s four orthogonal axes the feature's behaviour
      varies on: **Storage** (Loro store on/off), **File adapter** (org/none),
      **Merge fidelity** (op-CRDT / base-3-way / LWW), **Transport** (iroh P2P
      on/off). `—` means the feature behaves the same everywhere. *Headless vs
      windowed* is a test-slice axis, not a product mode; it is called out in prose
      where it matters.

keystone_note: >
  The composed keystone is
  [`general_e2e_composed_pbt.rs`](../../crates/holon-integration-tests/tests/general_e2e_composed_pbt.rs).
  Its alphabet is {transitions} transitions; the repo declares {invariants}
  invariant ids plus {families} correspondence-family ids. Open reds are
  registered in [KeystoneKnownReds.md](../Testing/KeystoneKnownReds.md) — a red
  listed there is a pass-with-note, anything else is a regression.

areas:
  - name: Block editing
    rows:
      - feature: Typing / text edit
        what: Character keystrokes into a block's `MutableText`
        transitions: [TypeChars, DeliverBlockContent]
        invariants: ["inv-editor-text/mirror", "inv-block-content/block_raw"]
        ruled_by: Model.md inv 12 (every field write resolves a cell backing)
        mode_axes: Merge fidelity (op-CRDT vs LWW text backing)
        entry: "`crates/holon-core/src/cell_registry.rs`"
      - feature: Caret movement
        what: Cursor keystrokes against `InputState`
        transitions: [MoveCursor, ArrowNavigate]
        invariants: ["inv-editor-caret/mirror"]
        ruled_by: "[0010](../adr/0010-focus-authority-in-memory-signal.md) — focus is in-memory, never persisted"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/reactive_view_model.rs`"
      - feature: Split block
        what: Enter at cursor splits a block in two
        transitions: [SplitBlock]
        invariants: [inv-birth-contract-satisfied]
        ruled_by: "[0030](../adr/0030-birth-atomicity-authority-and-mirror-contract.md) — births fire in the authority"
        mode_axes: Storage (Loro mints vs SQL mints)
        entry: "`crates/holon-integration-tests/src/pbt/transitions/split_block.rs`"
      - feature: Join / backspace-merge
        what: Backspace at start merges into the previous visible block
        transitions: [JoinBlock, DeleteBackward]
        ruled_by: "[0030](../adr/0030-birth-atomicity-authority-and-mirror-contract.md)"
        mode_axes: Storage
        entry: "`crates/holon-core/src/traits.rs` (`BlockOperations`)"
      - feature: Indent / outdent
        what: Chords reparenting a block among its siblings
        transitions: [Indent, Outdent]
        invariants: [inv-no-parent-cycles, inv-no-orphan-blocks]
        ruled_by: "[0005](../adr/0005-children-as-ordered-list.md) — `sort_key` is an adapter detail"
        mode_axes: Storage
        entry: "`crates/holon-core/src/traits.rs`"
      - feature: Reorder (chord + drag)
        what: Alt+Up/Down and pointer drag move a block among siblings
        transitions: [MoveUp, MoveDown, DragDropBlock]
        invariants: [inv-birth-contract-satisfied]
        ruled_by: >
          Model.md inv 2, 3 — the consolidator mints every fractional index; intent
          carries `after_sibling`, never an order key
        mode_axes: Storage (Loro-fi vs `gen_key_between`)
        entry: "`crates/holon-loro/src/loro_block_operations.rs`"
      - feature: Structural ops as commit points
        what: Pending editor text flushes through the merge path before a structural op runs
        transitions: [Indent, Outdent, SplitBlock]
        pin_note: all preceded by the flush
        ruled_by: Model.md inv 8
        mode_axes: Merge fidelity
        entry: "[UI.md](UI.md)"
      - feature: Undo
        what: Engine undo restores the pre-mutation block tree
        transitions: [UndoLastMutation]
        invariants: [inv-undo-redo-reference-heal]
        ruled_by: "[0031](../adr/0031-native-transition-catalog-and-macro-reification.md)"
        mode_axes: Storage
        entry: "`crates/holon-core/src/undo.rs`, `crates/holon/src/core/operation_log.rs`"
      - feature: Redo
        what: Redo re-executes the forward op and mints a **fresh** id
        transitions: [Redo]
        invariants: [inv-undo-redo-reference-heal]
        ruled_by: "[0031](../adr/0031-native-transition-catalog-and-macro-reification.md)"
        mode_axes: Storage
        entry: "`crates/holon/src/core/operation_log.rs`"
      - feature: Slash commands
        what: Slash-menu keystroke sequence resolving to a command
        transitions: [TriggerSlashCommand]
        invariants: [inv-viewmodel-editable-text-triggers]
        ruled_by: "[0024](../adr/0024-unified-action-execution.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/popup_menu.rs`"
      - feature: Templates
        what: A canned inline template instantiates into real blocks
        transitions: [InstantiateTemplate]
        ruled_by: "[0024](../adr/0024-unified-action-execution.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/popup_menu.rs`"
    open_reds: [editor-text-mirror, editor-caret-mirror, movecursor-unopened-editor, split-id-no-pairing, syn-real-mint]
    note: >
      `syn-real-mint` is a block-loss detector, not a minting defect.

  - name: Outline, rendering & widgets
    rows:
      - feature: Render pipeline
        what: query → rows → `EntityProfile.resolve` → ViewModel tree → platform view
        invariants: [inv-viewmodel-root-matches-render-expr, inv-viewmodel-snapshot, inv-frontend-root-not-error]
        ruled_by: "[0018](../adr/0018-reactive-engine-viewmodel.md)"
        mode_axes: "—"
        entry: "`crates/holon-api/src/entity_profile.rs`"
      - feature: Widget catalog
        what: Per-widget shadow builders (`board`, `card`, `state_toggle`, …)
        invariants: [inv-viewmodel-no-error-widgets, "inv-displayed-text/viewmodel"]
        ruled_by: "[0018](../adr/0018-reactive-engine-viewmodel.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/shadow_builders/`"
      - feature: "`op_button`"
        what: A row-bound button dispatching a named op with its params
        pin_note: "*(none — see Unpinned)*"
        ruled_by: "[0024](../adr/0024-unified-action-execution.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/shadow_builders/op_button.rs`"
        unpinned: >
          the widget that dispatches a named op with its params. No keystone
          transition clicks one and no invariant observes the dispatch. Given
          [ADR 0024](../adr/0024-unified-action-execution.md) makes ops the sole
          action language, this is the most load-bearing unpinned row in the map.
      - feature: "`pie_menu`"
        what: Radial menu overlay; exempt from layout containment
        pin_note: "*(only the layout-slice `assert_layout_ok` overflow allowance)*"
        ruled_by: "[0026](../adr/0026-attention-environment-architecture.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/shadow_builders/pie_menu.rs`"
        unpinned: >
          only the layout slice touches it, and only as an *exemption* from the
          containment assertion. Nothing checks that it renders correctly.
      - feature: Popups
        what: One `PopupMenu` behind slash commands, wiki-links, mentions
        transitions: [TriggerSlashCommand]
        invariants: [inv-viewmodel-editable-text-triggers]
        ruled_by: "[0024](../adr/0024-unified-action-execution.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/popup_menu.rs`"
      - feature: Collapse / expand
        what: Chevron and click gestures flip a block's collapsed gate
        transitions: [ToggleCollapse, ExpandToggle]
        invariants: [inv-embedded-page-collapsed-lazy]
        ruled_by: Model.md — `Mutable<T>` is per-render-slot, never registry-keyed
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/reactive_view_model.rs`"
      - feature: Drawers
        what: Property/metadata drawer open-close
        transitions: [ToggleDrawer]
        invariants: [inv-drawer-open-matches-ref]
        ruled_by: "—"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/shadow_builders/`"
      - feature: Inline text styling
        what: Bold/italic/underline/strike/code/link marks at paint level
        invariants: [inv-paint-text-styling, inv-mark-bounds-within-content]
        ruled_by: "—"
        mode_axes: "—"
        entry: "`crates/holon-org-format/src/models.rs`"
      - feature: Virtual slots / lazy rows
        what: Off-screen rows are slots, not materialized widgets
        invariants: [inv-viewmodel-tree-virtual-slots, inv-journal-feed-viewport-lazy]
        ruled_by: "[0018](../adr/0018-reactive-engine-viewmodel.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/reactive_view_model.rs`"
      - feature: Scroll & sticky headers
        what: Two-mode wheel motion, occlusion routing, sticky accordion
        transitions: [WheelScroll]
        invariants: [inv-wheel-two-mode-motion-law, inv-wheel-occlusion-routing, inv-sticky-accordion-spec]
        ruled_by: "[0026](../adr/0026-attention-environment-architecture.md)"
        mode_axes: "—"
        entry: "`frontends/gpui/src/` (windowed slice only)"
      - feature: Advice weave
        what: Top-K suppression-filtered advice rows woven at each anchor
        invariants: [inv-advice-rows-woven]
        ruled_by: >
          [0021](../adr/0021-advice-suppression-storage-and-readonly-v1.md),
          [0022](../adr/0022-runtime-definable-advice-rules.md),
          [0023](../adr/0023-two-stage-relevance-app-layer-reranker.md)
        mode_axes: "—"
        entry: "`crates/holon/src/api/ui_watcher.rs`"
      - feature: Display placement
        what: A row shown somewhere it does not canonically live
        invariants: [inv-display-placement-canonical-inert]
        pin_note: env-gated on `HOLON_PBT_DISPLAY_PLACED`
        ruled_by: "[0015](../adr/0015-computed-placement-and-curated-state-primitives.md) *(Proposed, not implemented)*"
        mode_axes: "—"
        entry: "[ADR 0015](../adr/0015-computed-placement-and-curated-state-primitives.md)"
        unpinned: >
          [ADR 0015](../adr/0015-computed-placement-and-curated-state-primitives.md)
          is Proposed and unimplemented; the invariant exists but is inert unless
          `HOLON_PBT_DISPLAY_PLACED` is set.
    open_reds: [lib-displayed-text-nested-content-skipped]

  - name: Navigation, focus & panes
    rows:
      - feature: Click-to-focus
        what: Pointer click resolves a click intent and moves focus
        transitions: [ClickBlock, FocusEditableText]
        invariants: [inv-focus-matches-ref, inv-navigation-focus]
        ruled_by: "[0010](../adr/0010-focus-authority-in-memory-signal.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/operations.rs`"
      - feature: Page navigation
        what: Navigating a region to a new focus root
        transitions: [NavigateFocus]
        invariants: [inv-focus-roots, inv-main-panel-rows-match-focus]
        ruled_by: "[0016](../adr/0016-occurrence-keyed-focus-authority.md) *(Proposed)*"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/operations.rs`"
      - feature: Back / forward / home
        what: Per-region navigation history
        transitions: [NavigateBack, NavigateForward, NavigateHome]
        ruled_by: "[0010](../adr/0010-focus-authority-in-memory-signal.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/operations.rs`"
      - feature: Open in tab
        what: Cmd+click a sidebar page into a new tab
        transitions: [OpenTabViaModifierClick]
        ruled_by: "[0026](../adr/0026-attention-environment-architecture.md)"
        mode_axes: "—"
        entry: "`frontends/gpui/src/views/render_entity_view.rs`"
      - feature: Pin to sidebar
        what: Shift+click a bullet pins it to the right sidebar
        transitions: [PinBlock, UnpinBlock]
        pin_note: "*no invariant observes pinned state*"
        ruled_by: "[0026](../adr/0026-attention-environment-architecture.md)"
        mode_axes: "—"
        entry: "`assets/default/types/block_profile.yaml` (`shift_action` wiring)"
        unpinned: >
          `PinBlock`/`UnpinBlock` drive the op, but no invariant reads pinned state
          back. The open `lib-*pin*` known-reds live in exactly this hole.
      - feature: Sidebar
        what: Page list, watch-seeded, click routes to the main panel
        transitions: [SwitchView]
        invariants: [inv-sidebar-page-tag-preserved]
        ruled_by: "—"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/shadow_builders/`"
      - feature: View modes
        what: Switching a region's view mode (outline / board / …)
        transitions: [SwitchViewMode, SwitchView]
        pin_note: the derived pair `inv_pair_view_selection_current_view()`
        ruled_by: "[0018](../adr/0018-reactive-engine-viewmodel.md)"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/reactive_view_model.rs`"
    open_reds: [lib-nav-history-shift-action-region, lib-pin-block-right-sidebar-probe, lib-unpin-block-probe, lib-focus-roots-mismatch-right-sidebar, lib-right-sidebar-renders-pins, lib-sut-only-pin-not-caught, pinblock-unrendered-target, sidebar-focus-bind, lib-sidebar-pages-declared-order]
    note: >
      The pin / right-sidebar cluster is the largest open family in the registry:
      one region-literal typo (`right` vs `right_sidebar`) accounts for all of it.

  - name: Queries & projections
    rows:
      - feature: Query languages
        what: PRQL / GQL / SQL, all compiled to plain SQL
        invariants: [inv-viewmodel-decompiled-rows-match-query]
        ruled_by: "[Architecture.md §Multi-Language Query Support](../Architecture.md)"
        mode_axes: "—"
        entry: "`crates/holon-api/src/types.rs` (`QueryLanguage`)"
      - feature: Degraded no-query mode
        what: With no query engine, a block shows its source
        invariants: [inv-viewmodel-shows-source-when-no-query, inv-source-language-iff-source]
        ruled_by: "—"
        mode_axes: "—"
        entry: "`crates/holon-frontend/src/render_interpreter.rs`"
      - feature: Filters
        what: "`holon_filter` source blocks resolving to a typed `FilterSpec`"
        invariants: [inv-filter-spec-resolves]
        ruled_by: "—"
        mode_axes: "—"
        entry: "`crates/holon-turso/src/`"
      - feature: Matviews / IVM
        what: Incrementally maintained materialized views over blocks
        invariants: [inv-matview-consistent-with-recompute, inv-typed-matview-matches-ref, "inv-matview-consistent-with-ref/root_layout"]
        ruled_by: Model.md layer 3 — exactly one writer, verbatim and total
        mode_axes: Storage
        entry: "`crates/holon-turso/src/matview_manager.rs`"
      - feature: CDC → LiveData
        what: Convergent-state stream feeding cells and the ViewModel
        invariants: [inv-live-children-match-ref, inv-live-tree-matches-fresh, inv-frontend-engine]
        ruled_by: "[0018](../adr/0018-reactive-engine-viewmodel.md); Model.md layer 4"
        mode_axes: Storage
        entry: "`crates/holon-api/src/live_data.rs`"
      - feature: Block history
        what: An op-grounded history table over block writes
        invariants: ["inv-history-no-phantom-rows/block_history", "inv-history-records-all-creates/block_history"]
        ruled_by: "[0025](../adr/0025-op-grounded-projections.md)"
        mode_axes: Storage
        entry: "[Schema.md](Schema.md)"
      - feature: Schema & typed entities
        what: Runtime-declared types projected into their own matviews
        transitions: [DeclareTypedSchema, CreateTypedEntity, RegisterEntityScheme, ConcurrentSchemaInit]
        invariants: [inv-typed-matview-matches-ref]
        ruled_by: "[0029](../adr/0029-entity-identity-single-minting-authority.md)"
        mode_axes: "—"
        entry: "`crates/holon-turso/src/dynamic_schema_module.rs`"
    open_reds: [history-ingest-create-unrecorded, history-join-phantom-row]

  - name: Rules & automation
    rows:
      - feature: PN action language
        what: Petri-net transitions are the sole action surface; Rhai-compiled guards
        pin_note: "*(no keystone transition drives net firing directly)*"
        ruled_by: >
          [0024](../adr/0024-unified-action-execution.md),
          [0017](../adr/0017-petri-net-task-ranking-engine.md)
        mode_axes: "—"
        entry: "`crates/holon-engine/src/`"
        unpinned: >
          the Petri-net engine has no keystone transition or invariant. Only
          `holon_rule` blocks (the YAML rule surface) are pinned, via the journal
          rule.
      - feature: "`holon_rule` blocks"
        what: "Single-block YAML rules with `when:`/`emit:` arcs"
        transitions: [AdvanceDay]
        invariants: [inv-journal-one-per-day]
        ruled_by: "[0024 §7.2](../adr/0024-unified-action-execution.md)"
        mode_axes: "—"
        entry: "`crates/holon/src/api/holon_rule_watcher.rs`"
      - feature: Query watches
        what: Registering a query watch and its CDC subscription
        transitions: [SetupWatch, RemoveWatch]
        invariants: [inv-active-watches-match-ref, inv-watch-rows-match-ref]
        ruled_by: "[0018](../adr/0018-reactive-engine-viewmodel.md)"
        mode_axes: "—"
        entry: "`crates/holon/src/api/action_watcher.rs`"
      - feature: Task ranking
        what: Task blocks materialized into a Petri net for WSJF ranking
        pin_note: "*(no keystone invariant)*"
        ruled_by: "[0017](../adr/0017-petri-net-task-ranking-engine.md)"
        mode_axes: "—"
        entry: "`crates/holon-petri/src/lib.rs`"
        unpinned: >
          WSJF ranking over the task net is exercised by nothing in the keystone.
      - feature: Task state cycle
        what: "`state_toggle` click cycles a task through its states"
        transitions: [ToggleState]
        invariants: [inv-task-state-matches-ref, inv-task-state-storage-coherence, inv-viewmodel-state-toggle-correct]
        ruled_by: "[0024](../adr/0024-unified-action-execution.md)"
        mode_axes: Storage (the coherence twin needs the Loro task-state cap)
        entry: "`crates/holon-frontend/src/shadow_builders/state_toggle.rs`"
    open_reds: [task-state-storage-coherence, state-toggle-row-absent, watch-rows-cdc-parent]

  - name: Storage & sync
    rows:
      - feature: Loro CRDT store
        what: Durable replica with op history and frontiers
        transitions: [SimulateRestart, CreateStaleLoro]
        invariants: ["inv-blocks-match-ref/loro", inv-loro-children-match-ref, inv-loro-no-errors]
        ruled_by: >
          [0003](../adr/0003-all-in-lorotree-architecture.md) +
          [amendment](../adr/0003-amendment-multi-tree.md)
        mode_axes: Storage; Merge fidelity
        entry: "`crates/holon-loro/src/loro_sync_controller.rs`"
      - feature: Turso projection
        what: Single-writer, total, verbatim projection of the consolidated tree
        invariants: ["inv-blocks-match-ref/block_raw", "inv-blocks-match-ref/matview", "inv-block-parent/block_raw"]
        ruled_by: Model.md inv 4, 5
        mode_axes: Storage
        entry: "`crates/holon-turso/src/turso.rs`"
      - feature: SqlOnly mode
        what: Loro store off; Turso-LWW is the consolidator
        pin_note: >
          *(whole keystone runs in both arms; SqlOnly deselects the Loro-cap
          invariants — disclosed, not faked)*
        ruled_by: Model.md §Four orthogonal mode axes
        mode_axes: Storage; Merge fidelity
        entry: "`crates/holon/src/core/sql_operation_provider.rs`"
        unpinned_exempt: the whole keystone runs in both arms
      - feature: Consolidator epoch guard
        what: A mode flip without a base re-seed is refused at startup
        transitions: [EpochFlipRejected]
        ruled_by: Model.md inv 10
        mode_axes: Storage
        entry: "`crates/holon-app/src/consolidator_epoch.rs`"
      - feature: Org file round-trip
        what: Disk org → parse → blocks → render → byte-identical disk org
        transitions: [WriteOrgFile, BulkExternalAdd, DenseProjectionEdit]
        invariants: [inv-org-render-fixed-point, "inv-blocks-match-ref/org"]
        ruled_by: >
          [0014](../adr/0014-doc-scheme-retirement.md);
          [ORG_SYNTAX.md](../Reference/ORG_SYNTAX.md)
        mode_axes: File adapter
        entry: "`crates/holon-org-format/src/models.rs`"
