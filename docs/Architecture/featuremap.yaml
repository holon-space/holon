unpinned_lead: >
  Rows above whose coverage a human judged incomplete. No automated test drives
  these — a change here is only as safe as the reasoning behind it.

unclaimed_lead: >
  Declared in the sources, claimed by no row above. A new transition or invariant
  lands here automatically, so a coverage gap never depends on someone
  remembering to write it down.

sources_lead: >
  Every derived part of this page, and where it comes from.

source_table:
  - content: The transition list
    source: >
      `declare_e2e_transitions!` in
      `crates/holon-integration-tests/src/pbt/transitions/mod.rs` — an arch test
      already asserts one file per variant.
  - content: One-clause descriptions of unclaimed names
    source: >
      the `@pbt covers <slug> — <clause>` annotation of the module that declares
      the transition or the invariant id.
  - content: The invariant id universe
    source: >
      every `InvariantId("inv-…")` body, `capability_pair!` id override, and
      correspondence-family `id: "inv-…"` under `crates/`.
  - content: Open reds per area
    source: >
      [KeystoneKnownReds.md](../Testing/KeystoneKnownReds.md) — a key is listed
      only while its `Status` is `known-red`.
  - content: Path and link freshness
    source: >
      the working tree; a cell naming a file that does not exist fails generation.

sources_closing: >
  What stays hand-written in [`featuremap.yaml`](featuremap.yaml): the grouping of
  transitions and invariants into features Martin would name, the one-clause
