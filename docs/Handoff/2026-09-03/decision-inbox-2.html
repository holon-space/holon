# D85 Disk growth root cause is cargo feature-unification hash churn — normalize gates, add a repo GC, or both?
> Lane disk-rootfix (report `.claude/worktrees/disk-rootfix/lane-report-disk-rootfix.md`) REFUTED the "leaking test helper" premise: no test helper writes under `target/`; the one sandbox fixture (`crates/holon-integration-tests/src/test_environment.rs:98`) holds a `TempDir` correctly. The growth is cargo's own: `target/debug/build/holon-app/<hash>/out/` holds a 238 MB linked test binary plus its object units (~229 MB per dir); holon-app has 34 test targets but 878 hash dirs (81 GB) because different gate invocations (`-p` sets, `--features` shapes) unify workspace features differently, so each shape mints a new metadata hash (6 distinct dependency counts × 2 profile hashes measured) and the old dirs are orphaned forever; cargo never GCs them. The 45-minute age sweep deletes live artifacts and misses old ones equally. A separate smaller leak (~20 `std::mem::forget` sites in windowed tests leaking TempDirs into the tmp dir, 16 GB) is being fixed without a ruling.
? Artifacts should be superseded, not aged: a hash dir is garbage exactly when a newer dir for the same target exists, whatever its age.
* c | Both: repo-owned GC first (keep the newest N hash dirs per crate/target, prune by supersession — a `just target-gc` recipe called by the land gate and `sw new`), then normalize the gate invocations to ONE feature selection so the churn stops | +immediate relief that is safe by construction; the root cause is removed afterwards | -two changes; the normalization touches every Justfile gate and must respect the D64.a rule (holon tests compile only together with holon-app)
- b | GC only (supersession-based, keep newest N) | +one small tool; safe | -the churn continues; GC runs forever
- a | Normalize gate invocations only | +root fix, no tool | -touches every gate; the 81 GB already there stays until a manual purge; any new gate shape re-introduces churn silently

# D86 Production iroh pairing has NO read/write capability dimension — route its imports through `admit`, or give enrollment a capability?
> Lane pair-prod (report `.claude/worktrees/pair-prod/lane-report-pair-prod.md` §2a, §6) measured that D72.a's "ONE acceptor boundary" is two today: `holon_sharing::acceptor::admit` (the function with the Read/Write rule and the full refusal taxonomy) has NO production caller — its only call site is the relay/envelope leg (`holon-sharing/src/sync.rs:232`). The production iroh leg authorises in `share_enrollment::acceptor_enroll` (`iroh_advertiser.rs:171-177`), which proves possession of a `CapabilitySecret` and is all-or-nothing. Consequence: a device paired over production iroh under a READ-ONLY cert can write, because nothing on that path ever reads the cert. The red test `a_read_only_pairing_cannot_write_back_to_the_owner` pins this and stays `#[ignore]`d until ruled. Related fact (§2b): whole-store replication over iroh is correct only by vacuity — `replicate_all` takes ONE roster bound to ONE tree id, so a second registered container could not authenticate; per-container rosters are the prerequisite for the first extra container.
? One boundary means one function decides; two gates that disagree are a bypass by construction. The fix must make the iroh leg's decision the same code that the relay leg runs.
* a | Route the iroh leg's imports through `admit`: after `acceptor_enroll` proves possession, every imported batch on the iroh connection passes `admit` with the peer's cert chain (capability from the chain, container binding, audience) before it reaches the doc; `acceptor_enroll` keeps transport-level proof only | +ONE decision function for both wires (D72.a as ruled); the existing refusal taxonomy and the admit-fuzz PBT cover the iroh leg for free | -per-batch cost on the hot path (cert chain parse once per connection, then a cheap check); the enrollment proof and the cert chain must be bound to the same identity (a new invariant to pin)
- b | Give enrollment a capability dimension: two secrets per share (read secret / write secret), `acceptor_enroll` grants the capability the presented secret proves; imports on a read-only connection are refused at the transport | +cheapest per-batch path; no per-batch admit | -a SECOND authorisation vocabulary beside the cert chain (the relay leg keeps `admit`); two secrets to distribute and rotate; D72.a's "one boundary" stays unmet
- c | Defer: ship pairing read/write-only (every paired device is a full writer), keep the test ignored, revisit before the first read-only share ships | +unblocks pair-prod now | -a known authz bypass lives in main with a name; contradicts D72.a

# D88 Does a share/pairing capability EXPIRE for an already-enrolled peer, or only close the enrollment window? (PROVISIONALLY applied as (a) so pair-prod can land — say if you want it otherwise)
> pair-prod rev 2 (report `.claude/worktrees/pair-prod/lane-report-pair-prod.md` "Rev 2", finding S4a) moved the expiry check in `ShareRoster::authorize` BEFORE the already-enrolled short-circuit so a peer's access cannot outlive the invite TTL. That function is shared with subtree sharing, whose window is `DEFAULT_ENROLLMENT_WINDOW_SECS` = 30 days: the verifier MEASURED that with expiry-first an ACCEPTED subtree share authorises its enrolled peer on day 29 and REFUSES on day 31 — every existing share would stop syncing 30 days after minting, with no re-mint path and no disclosure. `authorize_owner_signed` (the cert-chain leg) is untouched. The pairing invite TTL is 15 minutes; `pair_cancel` (new) revokes explicitly. The constant's name says "enrollment window", which is how it behaved before rev 2. The orchestrator applied (a) provisionally in rev 3 (with pins: cannot enroll after the window; enrolled stays authorised until cancelled; a day-31 subtree share still syncs) so the lane can weave; your answer here confirms or reverses it.
? A window bounds when a peer may JOIN; membership is ended by revocation, not by a clock the peer cannot see. Silent 30-day expiry of a working share is a fail-quiet shape.
* a | Expiry closes the ENROLLMENT window only: an un-enrolled peer is refused after `expires_at`; an enrolled peer stays authorised until revoked (`pair_cancel` / share revocation) | +matches the constant's meaning and every existing share keeps working; revocation is explicit and loud | -a lost phone that was enrolled stays enrolled until the owner cancels (needs a visible device list — S3's `on_peer_connected` follow-up)
- b | Expiry bounds ACCESS for pairing invites only; subtree shares keep enrolled-first (two rules in one function, selected by roster kind) | +pairing access cannot outlive its TTL | -two authorisation rules in one function; a paired device silently drops off after 15 min unless re-paired — unusable for own-device sync
- c | Expiry-first for both (rev 2 as built) and shares re-mint on a schedule | +one rule | -every existing share dies 30 days after minting with no disclosure; re-minting machinery does not exist

# D90 The wasm plugin is 21.6× slower than native cook.rs — proceed to Inc 3 (delete cook.rs) as planned, or change the runtime strategy first?
> Low-code Inc 2 is built and green (report `scratchpad/reports/lowcode-inc2a/lane-report-lowcode-inc2a.md` after weave; lane WS `.claude/worktrees/lowcode-inc2a`): `crates/holon-plugin-host` (wasmi 2.0.0, four-function ABI, JSON Lines through linear memory, fuel + memory limits, `PluginFormatAdapter` registered from a yaml sidecar, undeclared scopes/columns refused), the cooklang guest (a faithful port; 517 KB raw / 205 KB gzip, `wasm-opt` not installed), a testkit guest, and the red-first differential PBT with ZERO divergences. MEASURED, release build, one host kept alive, warmed: 200 generated recipes = **517.5 ms plugin vs 23.9 ms native** (2.59 ms vs 0.12 ms per recipe, 21.6×). Per interaction (one recipe on save) that is 77× under the 200 ms SLO; a COLD full-vault scan of 200 recipes misses the plan's 200 ms kill line by 2.6×. Today's real Rezepte folder has 3 recipes. The plan's Inc 3 deletes `cook.rs`, `rows.rs` and the cooklang dependency from `holon-kitchen` (no dual path); Inc 6 adds tree-sitter grammars as guests (same interpreter cost class).
? The SLO is per interaction; a full scan is a boot/re-index event whose cost should be bounded by incrementality (parse only changed files, cache rows by content hash), not by interpreter speed. Keeping a native path "for speed" is exactly the dual path the refactor rule forbids.
* a | Proceed to Inc 3 as planned (delete cook.rs; the plugin is the only cooklang path) AND make the vault scan incremental in the same increment: rows cached by file content hash in the store, re-parse only changed files, the cold first scan disclosed as progress (never a frozen UI) | +one path; the cost lands where it belongs (boot, once) and shrinks to zero on warm boots; incrementality benefits every format host | -a first-boot scan of a large recipe vault is slow (≈2.6 ms/recipe: 1000 recipes ≈ 2.6 s) until cached
- b | Proceed to Inc 3 but swap the runtime to `wasm_runtime_layer` (wasmtime native, wasmi in the browser) for near-native speed on desktop/Android | +~10× faster natively | -two runtimes behind one API (single-maintainer crate), wasmtime on Android is Tier 3 with no CI; the browser keeps the interpreter anyway
- c | Keep cook.rs as the native fast path beside the plugin | +fastest today | -the dual path the plan and the refactor rule forbid; every format would want one; the point of the program (attach formats WITHOUT Rust) is lost

* a | Parse with `ADVANCED_UNITS` OFF in the cooklang guest: timers carry their unit as the literal string; no unit validation at parse time; a later converter (if ever) maps known units | +every German (or any) unit parses; smallest change; matches parse-don't-validate | -no unit normalisation for timers (none exists today anyway)
- b | Keep `ADVANCED_UNITS` ON and ship a German unit table (cooklang `Converter` config in the guest or the sidecar) | +units are validated and convertible | -a unit table per language; the next language refuses again; a config knob users must find
- c | Keep refusing (status quo); the recipe shows the format refusal toast and no document | +strictest | -your own recipes stay unreadable; the dogfood entry stays OPEN

<script>
(function () {
  const S = "<!" + "-- DECISIONS-START --" + ">", E = "<!" + "-- DECISIONS-END --" + ">";
  const raw = document.getElementById("decisions-src").textContent;
  const start = raw.indexOf(S), end = raw.indexOf(E);
  if (start < 0 || end < 0) throw new Error("decisions block markers missing");
  const offset = raw.slice(0, start).split("\n").length;
  const lines = raw.slice(start + S.length, end).split("\n");

  const decisions = [], errors = [];
  let cur = null;
  lines.forEach((line, i) => {
    const n = offset + i;
    const t = line.trim();
    if (!t || t.startsWith("//")) return;
    const rest = t.slice(1).trim();
    const need = () => { if (!cur) errors.push([n, t, "no decision started"]); return !!cur; };
    switch (t[0]) {
      case "#": {
        const m = rest.match(/^(\S+)\s+(.+)$/);
        if (!m) { errors.push([n, t, "expected: # <ID> <title>"]); return; }
        cur = { id: m[1], title: m[2], bg: [], fp: [], opts: [] };
        decisions.push(cur);
        return;
      }
      case ">": if (need()) cur.bg.push(rest); return;
      case "?": if (need()) cur.fp.push(rest); return;
      case "-": case "*": {
        if (!need()) return;
        const f = t.slice(1).split("|").map(s => s.trim());
        if (f.length < 2 || !f[0] || !f[1]) {
          errors.push([n, t, "expected: - <sub> | <label> | +pro | -con"]);
          return;
        }
        const pc = [];
        for (const x of f.slice(2)) {
          if (!x) continue;
          if (x[0] !== "+" && x[0] !== "-") { errors.push([n, x, "pro/con must start with + or -"]); continue; }
          pc.push({ kind: x[0] === "+" ? "pro" : "con", text: x.slice(1).trim() });
        }
        cur.opts.push({ sub: f[0], label: f[1], pc, rec: t[0] === "*" });
        return;
      }
      default: errors.push([n, t, "unknown line prefix"]);
    }
  });

  const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const md = s => esc(s)
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");

  const root = document.getElementById("inbox");
  const answerEl = document.getElementById("answer");
  const state = new Map();

  if (errors.length) {
    const box = document.createElement("div");
    box.className = "err";
    box.innerHTML = errors
      .map(([n, txt, why]) => `<div>PARSE ERROR line ${n}: ${why} &mdash; ${esc(txt)}</div>`)
      .join("");
    root.appendChild(box);
  }

  function compose() {
    const parts = [];
    for (const d of decisions) {
      const s = state.get(d.id);
      if (!s) continue;
      if (s.sub === "*other") {
        if (s.other && s.other.trim()) parts.push(`${d.id}: ${s.other.trim()}`);
      } else {
        const note = (s.notes[s.sub] || "").trim();
        parts.push(`${d.id}.${s.sub}${note ? ` (note: ${note})` : ""}`);
      }
    }
    answerEl.textContent = parts.length ? parts.join("; ") : "(nothing selected yet)";
  }

  for (const d of decisions) {
    state.set(d.id, null);
    const card = document.createElement("section");
    card.className = "card";

    const h = document.createElement("h2");
    h.innerHTML = `<span class="id">${esc(d.id)}</span>${md(d.title)}`;
    card.appendChild(h);

    if (d.bg.length) {
      const p = document.createElement("p");
      p.className = "bg";
      p.innerHTML = md(d.bg.join(" "));
      card.appendChild(p);
    }
    if (d.fp.length) {
      const p = document.createElement("p");
      p.className = "fp";
      p.innerHTML = md(d.fp.join(" "));
      card.appendChild(p);
    }

    const wrap = document.createElement("div");
    wrap.className = "opts";
    card.appendChild(wrap);

    const select = (sub) => {
      const prev = state.get(d.id);
      state.set(d.id, { sub, other: prev ? prev.other : "", notes: prev ? prev.notes : {} });
      wrap.querySelectorAll(".opt").forEach(el => el.classList.toggle("sel", el.dataset.sub === sub));
      compose();
    };

    for (const o of d.opts) {
      const el = document.createElement("div");
      el.className = "opt";
      el.dataset.sub = o.sub;
      el.innerHTML =
        `<div class="opt-head"><span class="opt-sub">${esc(o.sub)}</span>` +
        `<span class="opt-label">${md(o.label)}</span>` +
        (o.rec ? `<span class="rec">recommended</span>` : "") + `</div>` +
        (o.pc.length
          ? `<div class="pc">` + o.pc.map(x =>
              `<div class="${x.kind}"><span class="m">${x.kind === "pro" ? "+" : "&minus;"}</span>` +
              `<span class="t">${md(x.text)}</span></div>`).join("") + `</div>`
          : "");

      const refine = document.createElement("div");
      refine.className = "refine";
      const ri = document.createElement("input");
      ri.type = "text";
      ri.placeholder = "refine this option (optional note)…";
      ri.addEventListener("click", e => e.stopPropagation());
      ri.addEventListener("input", () => {
        const s = state.get(d.id);
        if (s) { s.notes[o.sub] = ri.value; compose(); }
      });
      refine.appendChild(ri);
      el.appendChild(refine);

      el.addEventListener("click", () => select(o.sub));
      wrap.appendChild(el);
    }

    const other = document.createElement("div");
    other.className = "opt other";
    other.dataset.sub = "*other";
    other.innerHTML = `<div class="opt-head"><span class="opt-sub">…</span><span class="opt-label">Other</span></div>`;
    const oi = document.createElement("input");
    oi.type = "text";
    oi.placeholder = "something else…";
    oi.style.marginTop = "8px";
    oi.addEventListener("click", e => e.stopPropagation());
    oi.addEventListener("input", () => {
      if (!state.get(d.id) || state.get(d.id).sub !== "*other") select("*other");
      state.get(d.id).other = oi.value;
      compose();
    });
    other.appendChild(oi);
    other.addEventListener("click", () => { select("*other"); oi.focus(); });
    wrap.appendChild(other);

    root.appendChild(card);
  }

  document.getElementById("copy").addEventListener("click", async (e) => {
    await navigator.clipboard.writeText(answerEl.textContent);
    e.target.textContent = "Copied";
    setTimeout(() => { e.target.textContent = "Copy"; }, 1200);
  });

  compose();
})();
</script>
