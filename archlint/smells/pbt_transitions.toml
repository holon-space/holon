# Phase C #1–#7 — forbid new `apply_intent` calls in PBT transition bodies.
# `apply_intent` is the backend-dispatch escape hatch that bypasses the
# user-input pipeline (real users can't trigger it). Phase C eliminated
# all four pre-existing apply_intent smells in PBT bodies by migrating
# transitions to user-faithful input (click + keystrokes via SutDriver
# + SutLayout primitives). This smell prevents regression.
#
# Scope: `apply_intent` MUST NOT appear in:
#   - SutHandle impl methods (crates/holon-integration-tests/src/pbt/sut_handle.rs)
#   - Per-transition free helpers (crates/holon-integration-tests/src/pbt/transitions/*.rs)
#
# If you genuinely need backend dispatch (e.g. for a slice that doesn't
# have an input pipeline), the right move is usually to delete the
# transition (per TUI TODO A6 precedent) or to add a SutDriver method
# that the per-driver impl can route appropriately.

[[smell]]
id = "pbt-transition-apply-intent"
pattern = '\.apply_intent\('
files = "crates/holon-integration-tests/src/pbt/sut_handle.rs"
default_skips = false
case_sensitive = true
message = """
PBT transition body calls `.apply_intent(...)`. This is the \
backend-dispatch shortcut that bypasses the user-input pipeline — a \
real user can't trigger what the test triggers. Phase C #1–#7 \
eliminated all four pre-existing sites by migrating transitions to \
user-faithful input (click + keystrokes via SutDriver / SutLayout \
primitives like `click_entity`, `send_raw_keystroke`, \
`wait_for_widget_kind`, `wait_for_engine_focus`). \
See crates/holon-integration-tests/src/pbt/transitions/toggle_state.rs \
or trigger_slash_command.rs for the canonical pattern. \
To suppress (only when the transition genuinely has no user-input \
equivalent and isn't a deletion candidate): // ALLOW(pbt-transition-apply-intent): <reason>
"""

[[smell]]
id = "pbt-transition-apply-intent"
pattern = '\.apply_intent\('
files = "crates/holon-integration-tests/src/pbt/transitions/*.rs"
default_skips = false
case_sensitive = true
message = """
PBT transition body calls `.apply_intent(...)`. This is the \
