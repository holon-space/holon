# Stage A/B PBT capability-decomposition rules.
# Forbids new transition helper functions from binding to concrete
# `ReferenceState` / `E2ESut`. They must use capability traits
# (`RefBlockTree`, `RefEditorMirror`, ...) so transitions are
# reusable across slice consumers (editor_pure_pbt, storage_consistency_pbt,
# general_e2e_pbt).
#
# Scope: free helper functions named `<transition>_apply_to_ref`,
# `<transition>_weighted_generator`, `<transition>_preconditions` in
# `crates/holon-integration-tests/src/pbt/transitions/**/*.rs`. The
# thin adapter methods generated by `declare_e2e_transitions!` are
# exempt — they must use `&mut ReferenceState` because the macro
# requires it.

[[smell]]
id = "pbt-transition-helper-concrete-ref"
pattern = '\bpub fn \w+_(apply_to_ref|weighted_generator|preconditions)\b[^{]*\bReferenceState\b'
files = "crates/holon-integration-tests/src/pbt/transitions/*.rs"
default_skips = false
case_sensitive = true
message = """
Transition helper function names `ReferenceState` in its signature. \
Stage A/B migrated transitions use generic `R: RefBlockTree + ...` \
bounds so the helper runs against any slice's reference state (see \
crates/holon-integration-tests/src/pbt/transitions/type_chars.rs for \
the canonical shape). \
To suppress (e.g. for not-yet-migrated transitions): // ALLOW(pbt-transition-helper-concrete-ref): not yet migrated to capability traits
"""

# Anti-rubber-stamp (H11) — every `Inv*` struct used in a non-wide
# slice test file must be defined under `pbt::invariants::bodies::`,
# i.e. accessible to the wide PBT registry as well. The runtime
# version of this check lives in
# `crates/holon-integration-tests/src/pbt/invariants/registry.rs::tests::storage_slice_invariants_are_subset_of_wide_registry`.
# This static smell catches the regression at file save rather than
# test run.

[[smell]]
id = "pbt-slice-invariant-foreign-module"
pattern = '^\s*use\s+(?!holon_integration_tests::pbt::invariants::bodies::)[^;]*::Inv\w+\s*;'
files = "crates/holon-integration-tests/tests/editor_pure_pbt.rs"
default_skips = false
case_sensitive = true
message = """
Slice test file imports an `Inv*` invariant struct from outside \
`holon_integration_tests::pbt::invariants::bodies::`. H11 requires \
every slice invariant to also live in the wide registry — bodies/ is \
the canonical home. \
To suppress: // ALLOW(pbt-slice-invariant-foreign-module): <reason>
"""

