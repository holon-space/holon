# Phase C #1–#8 — forbid frontend-simulation constructs in SutHandle bodies.
# The pre-Phase-C bodies of apply_edit_via_*, apply_trigger_doc_link, and
# apply_trigger_slash_command each ran the full frontend rendering loop
# inside the test: SQL fetch via `engine().execute_query`, then
# `HeadlessBuilderServices::new` + `interpret_pure` to materialise a
# display tree, then `EditorViewModel::from_view_model` to build a
# popup-handling controller. That's "frontend integration test
# masquerading as user transition" — it tests what the renderer
# produces, not what a real user can drive.
#
# Phase C deleted the apply_intent bodies that needed those constructs.
# This smell prevents new ones from sneaking back in. If a transition
# genuinely needs to inspect rendered widgets, prefer
# `SutLayout::wait_for_widget_kind` / `SutRenderer::widget_tree_snapshot`
# (capability-bound, slice-portable) over inline frontend instantiation.

[[smell]]
id = "pbt-sut-handle-frontend-simulation"
pattern = '(interpret_pure|HeadlessBuilderServices::new|EditorViewModel::from_view_model)\('
files = "crates/holon-integration-tests/src/pbt/sut_handle.rs"
default_skips = false
case_sensitive = true
message = """
SutHandle body invokes a frontend-rendering construct inline \
(`interpret_pure` / `HeadlessBuilderServices::new` / \
`EditorViewModel::from_view_model`). These were the \
"frontend integration test masquerading as transition" anti-pattern \
that Phase C #1–#8 removed alongside the apply_intent shortcuts. If \
a transition needs to inspect the rendered widget tree, route through \
`SutRenderer::widget_tree_snapshot` / `SutLayout::wait_for_widget_kind` \
(capability-bound, slice-portable). \
To suppress: // ALLOW(pbt-sut-handle-frontend-simulation): <reason>
"""

[[smell]]
id = "pbt-sut-handle-frontend-simulation"
pattern = '(interpret_pure|HeadlessBuilderServices::new|EditorViewModel::from_view_model)\('
files = "crates/holon-integration-tests/src/pbt/transitions/*.rs"
default_skips = false
case_sensitive = true
