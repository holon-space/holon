# EntityUri typing-boundary smell (parse, don't validate).
#
# `EntityUri::from_raw` turns an untyped string into a domain URI, papering
# over scheme ambiguity (bare `x` vs `block:x`). It is correct ONLY at a true
# boundary — where a string first enters the system from something we don't
# control: the org parser, a SQL/matview row, a Loro field, an MCP/FFI param,
# a render-spec/DSL value, a test fixture literal. Past that point the URI must
# flow as an `EntityUri`; re-parsing internal data deeper in the stack is the
# smell (it let bare-vs-schemed focus ids diverge between the matview, the
# bridge, and the editor cursor subscription — see docs/Architecture).
#
# Every occurrence must be justified individually with a SPECIFIC reason
# naming the external source, not a blanket pardon. When the scheme is known
# statically, prefer `EntityUri::block(..)` / `EntityUri::doc(..)` /
# `EntityUri::parse(..)` instead.

[[smell]]
id = "entity_uri_parse_default"
# A hand-rolled `from_raw` that evades `entity_uri_from_raw`: parse the string,
# and on failure silently substitute a re-schemed default (`EntityUri::block(..)`
# / `EntityUri::new(..)` / a sentinel). This is exactly the bare-vs-schemed
# divergence the typed URI exists to prevent — it papers over an invalid id at a
# point that is NOT a boundary (see the props["block_id"] consumers, all of which
# now `.expect`). If the value really is untrusted boundary input, parse it once
# at the boundary; everywhere downstream `.expect(..)` (a malformed internal URI
# is a bug, fail loud) or propagate the `Result`.
pattern = 'EntityUri::parse(_owned)?\([^;]*\)\s*\.unwrap_or(_else)?\('
files = "**/*.rs"
exclude = ["**/target/**"]
case_sensitive = true
message = """
`EntityUri::parse(..).unwrap_or[_else](..)` silently substitutes a default URI \
when parsing fails — a hand-rolled `from_raw` that dodges the entity_uri_from_raw \
rule and re-introduces bare-vs-schemed id drift. Internal data: `.expect(..)` \
(a malformed URI is a bug — fail loud) or propagate the `Result`. True boundary \
input: parse once at the boundary. \
To suppress: // ALLOW(entity_uri_parse_default): <names the external source>
"""

[[smell]]
id = "entity_uri_from_raw"
pattern = 'EntityUri::from_raw\('
files = "**/*.rs"
exclude = ["**/target/**"]
case_sensitive = true
message = """
`EntityUri::from_raw` re-parses a string into a domain URI — allowed only at a \
true boundary where the string arrives from outside our control (org parser, \
SQL/matview row, Loro field, MCP/FFI param, render-spec value, test literal). \
If the value is already an `EntityUri` upstream, thread it through instead of \
stringifying + re-parsing; if the scheme is known statically use \
`EntityUri::block(..)` / `EntityUri::doc(..)` / `EntityUri::parse(..)`. \
To suppress at a genuine boundary: // ALLOW(entity_uri_from_raw): <names the external source>
"""

[[smell]]
id = "raw_row_id_column"
# A query row's `id` column is authored OUTSIDE Holon — a vault's own SQL, or an
# integration's mirror, chooses it. Reading it raw and converting it (or writing
# it into an id-bearing prop) is how four separate builders came to panic the
# whole render on one malformed row (D142.a; see the bugfunnel entry
# 2026-09-18-render-spec-ids-panic-the-frontend-render.md). `holon_api::row_id_of`
# is THE classifier: it returns `Entity`/`Absent`/`Unusable`, and a builder paints
# the `Unusable` arm as an error node instead of unwinding.
#
# Scoped to the render/binding trees, where the column reaches a widget. A read
# that is genuinely not an identity — a sort tie-break, a log label, a scroll-id
# hash, a map key on the raw text — is legitimate and says so with its ALLOW.
pattern = '\.get\("id"\)|\["id"\]|\.get\(ID_COLUMN\)'
files = [
  "crates/holon-frontend/src/**/*.rs",
  "crates/holon-api/src/**/*.rs",
  "frontends/gpui/src/**/*.rs",
  "frontends/tui/src/**/*.rs",
]
exclude = [
  "**/target/**",
  # The classifier itself, and the row-store keying that must agree with it.
  "crates/holon-api/src/widget_spec.rs",
]
case_sensitive = true
skip_comments = true
skip_test_mods = true
message = """
Raw read of a row's `id` column. That column is authored outside Holon, so a \
value that forms no URI is content, not a bug — route it through \
`holon_api::row_id_of` (or `row_id_of_str`) and paint the `Unusable` arm as an \
error node. \
To suppress a read that is NOT an identity (sort tie-break, log label, hash \
key, op-intent param map): // ALLOW(raw_row_id_column): <what it reads, and why it is not an identity>
"""

[[smell]]
id = "entity_uri_block_panics_on_bad_input"
# `EntityUri::block(s)` is `EntityUri::new("block", s)`, which PANICS when
# `block:{s}` forms no URI. The two shapes below hand it exactly the input
# that is known to be bad:
#   `unwrap_or_else(|_| EntityUri::block(x))` — the parse of `x` just failed,
#     so re-scheming it either unwinds on the same value or mints a
#     `block:`-prefixed phantom nothing downstream matches; and
#   `EntityUri::block("")` — `block:` parses, so this one is silent: every
#     row that takes the default collapses onto ONE identity and a keyed
#     diff stream aliases rows that are not the same row.
# A failed parse is an error surface (an `error` widget in a render builder,
# a `Result` where a caller can report it) or a loud `.expect` where the value
# is internally minted — never a substitute URI.
#
# RESIDUAL, deliberately not covered: an eager `let fallback =
# EntityUri::block(s)` bound before the branch that uses it. A `= EntityUri::
# block(` pattern cannot tell that apart from the ~50 legitimate production
# sites that mint a block URI from an id they generated themselves (a fresh
# UUID, a Loro stable id, a `{peer}:{counter}`), so the rule would report a
# baseline rather than a smell. The lazy shapes below are the ones that
# encode "this value already failed to parse".
pattern = 'unwrap_or_else\(\|_?\|\s*(holon_api::)?EntityUri::block\(|EntityUri::block\(\s*""\s*\)'
files = "**/*.rs"
exclude = ["**/target/**", "**/tests/**", "**/crates/holon-integration-tests/**"]
case_sensitive = true
skip_test_mods = true
message = """
`EntityUri::block(..)` as a parse fallback or an empty-path default: \
`EntityUri::block` panics when `block:{id}` forms no URI, and `block("")` \
silently mints one shared phantom identity. Route the failed parse to the \
site's error surface instead — `ViewModel::error(..)` / `error_banner(..)` in \
a render builder, a propagated `Result` where a caller can report it, or \
`.expect(..)` where the value is minted internally and absence is a bug. \
`EntityUri::try_from_raw(..)` is the fallible bare-or-schemed constructor. \
To suppress: // ALLOW(entity_uri_block_panics_on_bad_input): <why the input cannot be bad>
"""

[[smell]]
id = "raw_block_id_widget_param"
# A `widget_builder!` signature declaring `block_id: String` /
# `block_id: Option<String>` makes the macro copy the argument into the
# `block_id` prop VERBATIM. That prop has one contract — it is the
# serialization of an `EntityUri`, written by `ViewModel::live_block` /
# `drawer` — and `ReactiveViewModel::entity_id()` parses it strictly, so a
# verbatim copy hands it text that is not a URI. `badge` did exactly this and
# `#{block_id: col("id")}` unwound there on a vault id that forms no URI, and
# on a legitimate BARE id too, since the prop never carried the schemed form
# (bugfunnel 2026-09-19-badge-block-id-prop-is-stamped-unclassified).
#
# A declarative signature has nowhere to classify, so the builder needs a body
# that runs `holon_api::row_id_of_str` and then refuses `Unusable`, carries
# `Entity` SCHEMED, and drops the prop on `Absent`. `badge.rs` is the worked
# example; `drawer.rs` is the same shape for a positional id.
pattern = 'block_id:\s*(Option\s*<\s*)?String'
files = "crates/holon-frontend/src/shadow_builders/**/*.rs"
exclude = ["**/target/**"]
case_sensitive = true
skip_comments = true
skip_test_mods = true
message = """
`block_id: String` / `block_id: Option<String>` in a widget signature: the \
macro copies the argument into the `block_id` prop verbatim, and \
`entity_id()` parses that prop strictly — so an id the vault's SQL chose \
reaches it unclassified and unwinds. Give the builder a body that classifies \
with `holon_api::row_id_of_str`: refuse `Unusable` via \
`ViewModel::refused_row(..)`, carry `Entity` in its SCHEMED form, drop the \
prop on `Absent` (see `shadow_builders/badge.rs`). \
To suppress: // ALLOW(raw_block_id_widget_param): <why the value cannot be a raw id>
"""
