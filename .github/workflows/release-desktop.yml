name: Release (Desktop)

# Desktop release: v*.*.* tags → macOS/Linux/Windows artifacts on a GitHub
# Release, each with SLSA build provenance via GitHub Artifact Attestations.
# Mobile releases use mobile-v*.*.* tags → release-mobile.yml.
# Full operator guide: docs/Operations/ReleasePipeline.md

on:
  push:
    tags: ['v*.*.*']

# Permissions are scoped per-job: only the build job needs attestation perms.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create release for tag (if absent)
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RELEASE_ENABLED: ${{ vars.APPLE_RELEASE_ENABLED }}
          ANDROID_RELEASE_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$APPLE_RELEASE_ENABLED" = "true" ]; then
            macos_line="- **macOS**: signed with a Developer ID certificate and notarized by Apple."
          else
            macos_line="- **macOS**: ⚠️ **UNSIGNED** (Apple Developer Program enrollment pending). Gatekeeper will block the first launch — right-click the app → Open, or run \`xattr -dr com.apple.quarantine Holon.app\`. This build will be signed + notarized once the repo variable \`APPLE_RELEASE_ENABLED\` is set to \`true\` (see docs/Operations/ReleasePipeline.md)."
          fi
          if [ "$ANDROID_RELEASE_ENABLED" = "true" ]; then
            android_line="- **Android**: \`holon-release.apk\` attached for sideloading (arm64), signed with the release keystore. Not a store submission — those go through \`mobile-v*\` tags."
          else
            android_line="- **Android**: no APK attached — requires the release keystore secrets and repo variable \`ANDROID_RELEASE_ENABLED=true\` (see docs/Operations/ReleasePipeline.md)."
          fi
          cat > notes.md <<EOF
          ## Signing status

          $macos_line
          - **Windows**: unsigned (no code-signing certificate for v1) — Windows SmartScreen will show a "protected your PC" prompt once; choose "More info" → "Run anyway". The \`.exe\` is statically linked (no VC++ redistributable needed).
          - **Linux**: two artifacts — a portable \`.AppImage\` (chmod +x and run; bundles the GUI libraries) and a plain \`.tar.gz\` (extract and run \`./holon-gpui\`). Both need glibc ≥ 2.35 and a Vulkan-capable GPU driver. No OS-level signing applies.
          $android_line

          ## Verify build provenance (recommended)

          Every artifact carries a GitHub Artifact Attestation (SLSA build
          provenance) cryptographically proving it was built by this
          repository's release workflow from this exact tag — this, not OS
          code-signing, is the "no injected code" guarantee:

          \`\`\`
          gh attestation verify <downloaded-file> --repo $GITHUB_REPOSITORY
          \`\`\`

          Per-OS \`SHA256SUMS-<os>.txt\` files are attached for plain checksum verification.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists — build jobs will attach artifacts to it."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Holon $tag" --notes-file notes.md
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          # 22.04 (glibc 2.35), not ubuntu-latest (24.04 = glibc 2.39): a
          # dynamically-linked binary only runs on glibc >= the one it was
          # built against, so building on the older image lowers the floor
          # (covers Ubuntu 22.04 / Debian 12 / etc.). The AppImage below
          # bundles the GUI libs on top; glibc itself can't be bundled.
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # rust-toolchain.toml pins channel = "nightly"; install it the same way
      # ci.yml installs toolchains (dtolnay action).
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      # rust-cache restores the newest target/ for this platform via a
      # lock-independent prefix (cargo's fingerprinting then recompiles only
      # changed deps), prunes stale artifacts before saving so entries stay
      # small under the repo's ~10 GB cache budget, and keys on the rustc
      # version so a toolchain bump doesn't reuse a stale-compiler cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - name: Install GPUI Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libx11-dev libasound2-dev libudev-dev libssl-dev

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # macOS ships one universal2 binary (arm64 + x86_64 lipo'd together)
      # instead of two per-arch downloads: one artifact, no user confusion
      # about which Mac they have, at the cost of a second cargo build.
      - name: Build (macOS, universal2)
        if: matrix.platform == 'macos'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p holon-gpui --target aarch64-apple-darwin
          cargo build --release --locked -p holon-gpui --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/holon-gpui \
            target/x86_64-apple-darwin/release/holon-gpui \
            -output dist/holon-gpui-universal
          lipo -info dist/holon-gpui-universal

      - name: Bundle Holon.app
        if: matrix.platform == 'macos'
        run: bash scripts/bundle-macos.sh dist/holon-gpui-universal dist

      - name: Codesign + notarize Holon.app
        if: matrix.platform == 'macos' && vars.APPLE_RELEASE_ENABLED == 'true'
        env:
          MACOS_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$MACOS_DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" dist/Holon.app/Contents/MacOS/holon-gpui
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" dist/Holon.app
          codesign --verify --deep --strict dist/Holon.app

          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc-key.p8"
          ditto -c -k --keepParent dist/Holon.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/Holon.app

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        env:
          APPLE_RELEASE_ENABLED: ${{ vars.APPLE_RELEASE_ENABLED }}
        run: |
          if [ "$APPLE_RELEASE_ENABLED" = "true" ]; then
            name="Holon-$VERSION-macOS-universal"
          else
            echo "::warning::macOS build is UNSIGNED: repo variable APPLE_RELEASE_ENABLED is not 'true'." \
              "Enroll in the Apple Developer Program, add the MACOS_*/APPLE_* secrets, and set the" \
              "variable to enable signing + notarization (docs/Operations/ReleasePipeline.md)."
            name="Holon-$VERSION-macOS-universal-unsigned"
          fi
          ditto -c -k --keepParent dist/Holon.app "dist/$name.zip"
          rm -rf dist/Holon.app dist/holon-gpui-universal
          (cd dist && shasum -a 256 "$name.zip" > SHA256SUMS-macos.txt)

      - name: Build + package (Linux)
        if: matrix.platform == 'linux'
        env:
          # GPUI dlopens libfontconfig instead of static-linking (see
          # frontends/gpui/justfile) — keeps the binary portable across distros.
          RUST_FONTCONFIG_DLOPEN: on
        run: |
          cargo build --release --locked -p holon-gpui
          name="Holon-$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/holon-gpui "dist/$name/"
          # Copy assets dereferencing symlinks and dropping dangling ones
          # (assets/queries/*.prql are dead out-of-tree links); a plain cp -R
          # would ship dangling links / fail on Windows. See the script.
          bash scripts/stage-assets.sh assets "dist/$name/assets"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/${name:?}"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS-linux.txt)

      # Portable AppImage: bundles the GUI shared libs (Wayland/X11/xkbcommon/
      # xcb/…) so users don't need -dev/runtime packages installed. Vulkan/GL
      # drivers and glibc still come from the host (the 22.04 build floor sets
      # the glibc requirement). The raw .tar.gz above is kept as a fallback.
      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        env:
          RUST_FONTCONFIG_DLOPEN: on
        run: |
          name="Holon-$VERSION-linux-x86_64"
          sudo apt-get install -y imagemagick libfuse2
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp target/release/holon-gpui "$APPDIR/usr/bin/"
          bash scripts/stage-assets.sh assets "$APPDIR/usr/bin/assets"
          # linuxdeploy requires a desktop file + icon. Reuse the app icon
          # (iOS asset is a clean single-frame PNG; the canonical .icns is
          # multi-frame and fiddlier to convert).
          convert frontends/gpui/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            -resize 256x256 "$APPDIR/holon.png"
          cat > "$APPDIR/holon.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Holon
          Exec=holon-gpui
          Icon=holon
          Categories=Office;Utility;
          Terminal=false
          EOF
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          # Runners lack FUSE; run the linuxdeploy AppImage by self-extracting.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="$name.AppImage"
          ./linuxdeploy --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/holon-gpui" \
            --desktop-file "$APPDIR/holon.desktop" \
            --icon-file "$APPDIR/holon.png" \
            --output appimage
          mv "$name.AppImage" dist/
          (cd dist && sha256sum "$name.AppImage" >> SHA256SUMS-linux.txt)

      - name: Build + package (Windows)
        if: matrix.platform == 'windows'
        env:
          # Static CRT so the .exe doesn't depend on the VC++ redistributable
          # (vcruntime140.dll), which isn't present on a clean Windows install.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p holon-gpui
          name="Holon-$VERSION-windows-x86_64"
          mkdir -p "dist/staging"
          cp target/release/holon-gpui.exe dist/staging/
          # cp -R fails on Windows trying to recreate the assets/queries/*.prql
          # symlinks (the v0.0.1 Windows-build failure); stage-assets copies
          # real files and drops the dead links.
          bash scripts/stage-assets.sh assets dist/staging/assets
          (cd dist/staging && 7z a "../$name.zip" .)
          rm -rf dist/staging
          (cd dist && sha256sum "$name.zip" > SHA256SUMS-windows.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          # dist/* also covers the SHA256SUMS files, so checksum manifests
          # carry provenance too, not just the payload artifacts.
          subject-path: |
            dist/*

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/Holon-* dist/SHA256SUMS-*.txt

  # Sideloadable APK on every desktop release (store submissions stay on
  # mobile-v* tags → release-mobile.yml). Android refuses to install unsigned
  # APKs, so this needs the release keystore — same gate as the store path.
  android-apk-skipped:
    name: Android APK (skipped)
    if: vars.ANDROID_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why the APK is skipped
        run: |
          echo "::warning::Android APK SKIPPED: repo variable ANDROID_RELEASE_ENABLED is not 'true'."
          echo "Android cannot install unsigned APKs, so a sideloadable APK requires the release"
          echo "keystore secrets (ANDROID_RELEASE_*). Set them + ANDROID_RELEASE_ENABLED=true and"
          echo "every v* release will carry holon-release.apk. Step-by-step: docs/Operations/ReleasePipeline.md"

  android-apk:
    name: Android APK → GitHub Release
    if: vars.ANDROID_RELEASE_ENABLED == 'true'
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-linux-android

      # shared-key `android-release` is intentionally the SAME as the Play
      # job in release-mobile.yml: both cross-compile the identical
      # aarch64-linux-android target from the same root Cargo.lock, so a
      # mobile-v* build warms this v* sideload build and vice-versa.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release
          cache-on-failure: true

      - name: Install Android SDK components (pinned versions from build script)
        run: |
          # `yes` dies with SIGPIPE (141) when sdkmanager exits; under this shell's
          # pipefail that would fail the step even on success. The `|| true` guards
          # ONLY the `yes` writer — sdkmanager's own exit code still fails the step.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Derive version + versionCode from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Build Android .so
        env:
          # yeslogic-fontconfig-sys build script runs pkg-config, which cannot
          # cross-compile for Android; dlopen mode skips it (GPUI dlopens
          # libfontconfig at runtime). Mirrors frontends/gpui/justfile.
          RUST_FONTCONFIG_DLOPEN: on
        run: |
          # rust-toolchain.toml pins nightly-2026-07-15; the dtolnay `targets:` input
          # added the Android std to plain `nightly`, not the pin, so cargo ndk (on the
          # pinned toolchain) could not find std for aarch64-linux-android (E0463). Add
          # it to the active toolchain here, like the macOS job installs its targets.
          rustup target add aarch64-linux-android
          cargo ndk -t arm64-v8a -P 33 build --locked \
            -p holon-gpui --no-default-features --features mobile \
            --lib --release

      - name: Package release-signed APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          export KEYSTORE_FILE
          bash frontends/gpui/android/build-release-apk.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontends/gpui/android/build-release/holon-release.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            frontends/gpui/android/build-release/holon-release.apk
