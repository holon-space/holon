name: Release (Mobile)

# Mobile release: mobile-v*.*.* tags → iOS to TestFlight, Android to the
# Google Play INTERNAL testing track (promotion to production is always a
# manual step in Play Console). Desktop releases use v*.*.* tags →
# release-desktop.yml. Both store jobs are gated on repo variables so tagging
# without the store credentials configured skips loudly instead of failing:
#   vars.APPLE_RELEASE_ENABLED == 'true'   → iOS job runs
#   vars.ANDROID_RELEASE_ENABLED == 'true' → Android job runs
# Full operator guide: docs/Operations/ReleasePipeline.md

on:
  push:
    tags: ['mobile-v*.*.*']

# Permissions are scoped per-job: only the build jobs need attestation perms.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create release for tag (if absent)
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RELEASE_ENABLED: ${{ vars.APPLE_RELEASE_ENABLED }}
          ANDROID_RELEASE_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$APPLE_RELEASE_ENABLED" = "true" ]; then
            ios_line="- **iOS**: submitted to TestFlight; the attached \`Holon.ipa\` mirrors the exact submitted build."
          else
            ios_line="- **iOS**: ⚠️ SKIPPED — Apple Developer Program enrollment pending (repo variable \`APPLE_RELEASE_ENABLED\` is not \`true\`)."
          fi
          if [ "$ANDROID_RELEASE_ENABLED" = "true" ]; then
            android_line="- **Android**: uploaded to the Google Play **internal testing** track as a draft release; the attached \`holon-release.apk\` mirrors the exact uploaded build. Promotion beyond internal testing is manual, in Play Console."
          else
            android_line="- **Android**: ⚠️ SKIPPED — repo variable \`ANDROID_RELEASE_ENABLED\` is not \`true\`."
          fi
          cat > notes.md <<EOF
          Mobile store release for \`$tag\`.

          $ios_line
          $android_line

          ## Verify build provenance

          The attached artifacts carry GitHub Artifact Attestations (SLSA build
          provenance) proving they were built by this repository's release
          workflow from this exact tag:

          \`\`\`
          gh attestation verify <downloaded-file> --repo $GITHUB_REPOSITORY
          \`\`\`

          Setup guide for the gated jobs: docs/Operations/ReleasePipeline.md
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists — build jobs will attach artifacts to it."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Holon $tag (mobile)" --notes-file notes.md
          fi

  ios-skipped:
    name: iOS → TestFlight (skipped)
    if: vars.APPLE_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why iOS is skipped
        run: |
          echo "::warning::iOS release SKIPPED: repo variable APPLE_RELEASE_ENABLED is not 'true'."
          echo "To enable: enroll in the Apple Developer Program, register the app in App Store"
          echo "Connect, add the APPLE_*/IOS_* secrets, then set APPLE_RELEASE_ENABLED=true."
          echo "Step-by-step: docs/Operations/ReleasePipeline.md"

  ios:
    name: iOS → TestFlight
    if: vars.APPLE_RELEASE_ENABLED == 'true'
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-release
          cache-on-failure: true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Derive version + build number from tag
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          IFS=. read -r major minor patch <<< "$version"
          echo "HOLON_VERSION=$version" >> "$GITHUB_ENV"
          # Deterministic monotone build number from the semver — re-submitting
          # the same version requires bumping the patch level and re-tagging.
          echo "HOLON_BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: frontends/gpui/ios
        run: xcodegen generate --spec project.yml

      - name: Import signing certificate + provisioning profile
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PROFILE="$RUNNER_TEMP/holon.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE"
          UUID="$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)"
          NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw -o - -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile '$NAME' ($UUID)"

      - name: Build + upload to TestFlight (fastlane)
        working-directory: frontends/gpui/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: fastlane ios release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontends/gpui/ios/build/Holon.ipa

      - name: Mirror submitted IPA on the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            frontends/gpui/ios/build/Holon.ipa

  android-skipped:
    name: Android → Play internal (skipped)
    if: vars.ANDROID_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why Android is skipped
        run: |
          echo "::warning::Android release SKIPPED: repo variable ANDROID_RELEASE_ENABLED is not 'true'."
          echo "To enable: create a Play service account + release keystore, add the ANDROID_*/GOOGLE_*"
          echo "secrets, then set ANDROID_RELEASE_ENABLED=true."
          echo "Step-by-step: docs/Operations/ReleasePipeline.md"

  android:
    name: Android → Play internal track
    if: vars.ANDROID_RELEASE_ENABLED == 'true'
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-linux-android

      # shared-key `android-release` — SAME as the sideload-APK job in
      # release-desktop.yml (identical aarch64-linux-android build), so the
      # two release workflows warm each other's cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release
          cache-on-failure: true

      - name: Install Android SDK components (pinned versions from build script)
        run: |
          # `yes` dies with SIGPIPE (141) when sdkmanager exits; under this shell's
          # pipefail that would fail the step even on success. The `|| true` guards
          # ONLY the `yes` writer — sdkmanager's own exit code still fails the step.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Derive version + versionCode from tag
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          IFS=. read -r major minor patch <<< "$version"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          # Deterministic monotone versionCode from the semver — Play rejects
          # re-uploads of the same versionCode, so re-submitting requires a
          # patch bump and a new tag.
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Build Android .so
        env:
          # yeslogic-fontconfig-sys build script runs pkg-config, which cannot
          # cross-compile for Android; dlopen mode skips it (GPUI dlopens
          # libfontconfig at runtime). Mirrors frontends/gpui/justfile.
          RUST_FONTCONFIG_DLOPEN: on
        run: |
          # rust-toolchain.toml pins nightly-2026-07-15; the dtolnay `targets:` input
          # added the Android std to plain `nightly`, not the pin, so cargo ndk (on the
          # pinned toolchain) could not find std for aarch64-linux-android (E0463). Add
          # it to the active toolchain here, like the macOS job installs its targets.
          rustup target add aarch64-linux-android
          cargo ndk -t arm64-v8a -P 33 build --locked \
            -p holon-gpui --no-default-features --features mobile \
            --lib --release

      - name: Package release-signed APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          export KEYSTORE_FILE
          bash frontends/gpui/android/build-release-apk.sh

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Upload to Play internal testing track (fastlane supply)
        working-directory: frontends/gpui/android
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          HOLON_APK_PATH: build-release/holon-release.apk
        run: fastlane android internal

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontends/gpui/android/build-release/holon-release.apk

      - name: Mirror uploaded APK on the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            frontends/gpui/android/build-release/holon-release.apk
