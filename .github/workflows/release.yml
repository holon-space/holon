name: Release

# v*.*.* tags → every platform in one run: macOS/Linux/Windows artifacts on a
# GitHub Release, iOS to TestFlight, Android to the Google Play INTERNAL testing
# track (promotion to production is always a manual step in Play Console). Every
# artifact carries SLSA build provenance via GitHub Artifact Attestations.
# The store jobs are gated on repo variables so tagging without the store
# credentials configured skips loudly instead of failing:
#   vars.APPLE_RELEASE_ENABLED == 'true'   → iOS + macOS signing/notarization
#   vars.ANDROID_RELEASE_ENABLED == 'true' → Android signing + Play upload
# Full operator guide: docs/Operations/ReleasePipeline.md

on:
  push:
    tags: ['v*.*.*']
  # Dry run, always: build every platform without creating a Release,
  # submitting to TestFlight, or uploading to Play. Artifacts land as run
  # artifacts instead, so the pipeline can be exercised without consuming a
  # store build number. Publishing needs a tag — the artifact names, the
  # Release, and both store build numbers all derive from it.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 0.0.18)'
        type: string
        required: true

# Permissions are scoped per-job: only the build jobs need attestation perms.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  # Release-CI-only compile-speed lever (Martin 2026-07-27): more parallel
  # codegen units, marginally less cross-unit inlining. Local/dev builds and
  # the workspace profile (codegen-units = 4) are unaffected.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      # Every gated step downstream reads this one value, so publishing is
      # decided once. Consumers compare it to the STRING 'true' — job outputs
      # are strings, and a bare `if: needs...publish` would fire on "false".
      publish: ${{ steps.mode.outputs.publish }}
      version: ${{ steps.mode.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Only a tag push publishes. Every other trigger — a manual dispatch, or
      # one added later — is a dry run, so the unconsidered case never reaches
      # a store.
      - name: Resolve release mode + version
        id: mode
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${DISPATCH_VERSION:?the version input is required}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Both store build numbers are computed from this by arithmetic, so a
          # malformed value must stop the run rather than reach a packaging script.
          case "$version" in
            *[!0-9.]*|*..*|.*|*.) echo "::error::version '$version' is not MAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          IFS=. read -r major minor patch extra <<< "$version"
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ] || [ -n "$extra" ]; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          # A leading zero makes the shell read the field as octal: 010 becomes
          # build number 80000, and 08 is not a number at all.
          for field in "$major" "$minor" "$patch"; do
            case "$field" in
              0) ;;
              0*) echo "::error::version '$version' has a leading zero in '$field'"; exit 1 ;;
            esac
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = "true" ]; then
            echo "Publishing run for $version: a Release is created and the stores receive uploads."
          else
            echo "::warning::DRY RUN for $version: no Release, no TestFlight, no Play upload." \
              "Every platform still builds; artifacts are attached to this run instead."
          fi

      - name: Create release for tag (if absent)
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_RELEASE_ENABLED: ${{ vars.APPLE_RELEASE_ENABLED }}
          ANDROID_RELEASE_ENABLED: ${{ vars.ANDROID_RELEASE_ENABLED }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$APPLE_RELEASE_ENABLED" = "true" ]; then
            macos_line="- **macOS**: signed with a Developer ID certificate and notarized by Apple."
            ios_line="- **iOS**: submitted to TestFlight; the attached \`Holon.ipa\` mirrors the exact submitted build."
          else
            macos_line="- **macOS**: ⚠️ **UNSIGNED** (Apple Developer Program enrollment pending). Gatekeeper will block the first launch — right-click the app → Open, or run \`xattr -dr com.apple.quarantine Holon.app\`. This build will be signed + notarized once the repo variable \`APPLE_RELEASE_ENABLED\` is set to \`true\` (see docs/Operations/ReleasePipeline.md)."
            ios_line="- **iOS**: ⚠️ SKIPPED — Apple Developer Program enrollment pending (repo variable \`APPLE_RELEASE_ENABLED\` is not \`true\`)."
          fi
          if [ "$ANDROID_RELEASE_ENABLED" = "true" ]; then
            android_line="- **Android**: the signed \`holon-release.aab\` is uploaded to the Google Play **internal testing** track as a draft release; both it and a sideloadable \`holon-release.apk\` (same .so, direct APK pipeline) are attached to this Release. Promotion beyond internal testing is manual, in Play Console."
          else
            android_line="- **Android**: ⚠️ SKIPPED — no AAB or APK attached. Android cannot install unsigned APKs and Play cannot accept an unsigned bundle, so both need the release keystore secrets (\`ANDROID_RELEASE_*\`) and repo variable \`ANDROID_RELEASE_ENABLED=true\` (see docs/Operations/ReleasePipeline.md)."
          fi
          cat > notes.md <<EOF
          ## Signing status

          $macos_line
          - **Windows**: unsigned (no code-signing certificate for v1) — Windows SmartScreen will show a "protected your PC" prompt once; choose "More info" → "Run anyway". The \`.exe\` is statically linked (no VC++ redistributable needed).
          - **Linux**: two artifacts — a portable \`.AppImage\` (chmod +x and run; bundles the GUI libraries) and a plain \`.tar.gz\` (extract and run \`./holon-gpui\`). Both need glibc ≥ 2.35 and a Vulkan-capable GPU driver. No OS-level signing applies.
          $ios_line
          $android_line

          ## Verify build provenance (recommended)

          Every artifact carries a GitHub Artifact Attestation (SLSA build
          provenance) cryptographically proving it was built by this
          repository's release workflow from this exact tag — this, not OS
          code-signing, is the "no injected code" guarantee:

          \`\`\`
          gh attestation verify <downloaded-file> --repo $GITHUB_REPOSITORY
          \`\`\`

          Per-OS \`SHA256SUMS-<os>.txt\` files are attached for plain checksum verification.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists — build jobs will attach artifacts to it."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "Holon $tag" --notes-file notes.md
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is NOT in this matrix: universal2 needs two per-arch cargo
          # builds, which run serially in one job (~70 min, the release critical
          # path). It is split into the parallel build-macos + finalize-macos
          # jobs below. Linux/Windows are single-target, so they stay here.
          # 22.04 (glibc 2.35), not ubuntu-latest (24.04 = glibc 2.39): a
          # dynamically-linked binary only runs on glibc >= the one it was
          # built against, so building on the older image lowers the floor
          # (covers Ubuntu 22.04 / Debian 12 / etc.). The AppImage below
          # bundles the GUI libs on top; glibc itself can't be bundled.
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
    env:
      # Parallel rustc front end. Apple targets get this from
      # .cargo/config.toml; Linux and Windows are not covered there.
      RUSTFLAGS: -Zthreads=8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # rust-toolchain.toml pins channel = "nightly"; install it the same way
      # ci.yml installs toolchains (dtolnay action).
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      # A turso snapshot file checks out to a 264-char path, past Windows'
      # 260-char MAX_PATH. Only core.longpaths makes libgit2 (cargo's git-dep
      # backend) use \\?\ paths — the machine-wide LongPathsEnabled registry
      # flag does not, since cargo.exe ships no longPathAware manifest
      # (rust-lang/cargo#13020). Must precede rust-cache, which runs
      # `cargo metadata` from Node and so needs the HOME-independent --system.
      - name: Enable git long paths (Windows MAX_PATH)
        if: matrix.platform == 'windows'
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true

      # rust-cache restores the newest target/ for this platform via a
      # lock-independent prefix (cargo's fingerprinting then recompiles only
      # changed deps), prunes stale artifacts before saving so entries stay
      # small under the repo's ~10 GB cache budget, and keys on the rustc
      # version so a toolchain bump doesn't reuse a stale-compiler cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true

      - name: Install GPUI Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libx11-dev libasound2-dev libudev-dev libssl-dev

      - name: Take version from create-release
        run: echo "VERSION=${{ needs.create-release.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build + package (Linux)
        if: matrix.platform == 'linux'
        env:
          # GPUI dlopens libfontconfig instead of static-linking (see
          # frontends/gpui/justfile) — keeps the binary portable across distros.
          RUST_FONTCONFIG_DLOPEN: on
        run: |
          cargo build --release --locked -p holon-gpui
          name="Holon-$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/holon-gpui "dist/$name/"
          # Copy assets dereferencing symlinks and dropping dangling ones
          # (assets/queries/*.prql are dead out-of-tree links); a plain cp -R
          # would ship dangling links / fail on Windows. See the script.
          bash scripts/stage-assets.sh assets "dist/$name/assets"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/${name:?}"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS-linux.txt)

      # Portable AppImage: bundles the GUI shared libs (Wayland/X11/xkbcommon/
      # xcb/…) so users don't need -dev/runtime packages installed. Vulkan/GL
      # drivers and glibc still come from the host (the 22.04 build floor sets
      # the glibc requirement). The raw .tar.gz above is kept as a fallback.
      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        env:
          RUST_FONTCONFIG_DLOPEN: on
        run: |
          name="Holon-$VERSION-linux-x86_64"
          sudo apt-get install -y imagemagick libfuse2
          APPDIR="$PWD/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp target/release/holon-gpui "$APPDIR/usr/bin/"
          bash scripts/stage-assets.sh assets "$APPDIR/usr/bin/assets"
          # linuxdeploy requires a desktop file + icon. Reuse the app icon
          # (iOS asset is a clean single-frame PNG; the canonical .icns is
          # multi-frame and fiddlier to convert).
          convert frontends/gpui/ios/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png \
            -resize 256x256 "$APPDIR/holon.png"
          cat > "$APPDIR/holon.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Holon
          Exec=holon-gpui
          Icon=holon
          Categories=Office;Utility;
          Terminal=false
          EOF
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          # Runners lack FUSE; run the linuxdeploy AppImage by self-extracting.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export OUTPUT="$name.AppImage"
          ./linuxdeploy --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/holon-gpui" \
            --desktop-file "$APPDIR/holon.desktop" \
            --icon-file "$APPDIR/holon.png" \
            --output appimage
          mv "$name.AppImage" dist/
          (cd dist && sha256sum "$name.AppImage" >> SHA256SUMS-linux.txt)

      - name: Build + package (Windows)
        if: matrix.platform == 'windows'
        env:
          # Static CRT so the .exe doesn't depend on the VC++ redistributable
          # (vcruntime140.dll), which isn't present on a clean Windows install.
          # Step env replaces job env rather than extending it, so the job's
          # -Zthreads is repeated here.
          RUSTFLAGS: -C target-feature=+crt-static -Zthreads=8
        run: |
          cargo build --release --locked -p holon-gpui
          name="Holon-$VERSION-windows-x86_64"
          mkdir -p "dist/staging"
          cp target/release/holon-gpui.exe dist/staging/
          # cp -R fails on Windows trying to recreate the assets/queries/*.prql
          # symlinks (the v0.0.1 Windows-build failure); stage-assets copies
          # real files and drops the dead links.
          bash scripts/stage-assets.sh assets dist/staging/assets
          (cd dist/staging && 7z a "../$name.zip" .)
          rm -rf dist/staging
          (cd dist && sha256sum "$name.zip" > SHA256SUMS-windows.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          # dist/* also covers the SHA256SUMS files, so checksum manifests
          # carry provenance too, not just the payload artifacts.
          subject-path: |
            dist/*

      - name: Upload artifacts to release
        if: needs.create-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/Holon-* dist/SHA256SUMS-*.txt

      - name: Keep artifacts on the run (dry run)
        if: needs.create-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # macOS universal2 = two per-arch cargo builds. Building them in one job runs
  # them serially (~70 min wall, the release critical path). Split each arch onto
  # its own runner so they compile in parallel, then finalize (lipo + bundle +
  # sign + notarize + package + attest + upload) once in the dependent job below.
  # The published universal binary is byte-identical to the old single-job one:
  # same toolchain, same flags, same lipo of the same two per-arch builds — only
  # the wall time changes.
  build-macos:
    name: Build macos (${{ matrix.arch }})
    needs: create-release
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64-apple-darwin, x86_64-apple-darwin]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      # Per-arch cache key: each runner now builds ONE target dir, so its cache
      # is ~half the size of the old both-arches-in-one entry — smaller, faster
      # to save/restore, and less likely to be evicted under the repo's cache
      # budget. Keyed on rustc version (via rust-cache) so a toolchain bump can't
      # reuse a stale-compiler cache.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
          cache-on-failure: true

      - name: Build (macOS, ${{ matrix.arch }})
        run: |
          rustup target add ${{ matrix.arch }}
          cargo build --release --locked -p holon-gpui --target ${{ matrix.arch }}

      # retention-days: 1 — this is a within-run handoff to finalize-macos, not a
      # user-facing artifact (the signed .zip is uploaded to the Release below).
      - name: Upload per-arch binary for finalize
        uses: actions/upload-artifact@v4
        with:
          name: holon-gpui-${{ matrix.arch }}
          path: target/${{ matrix.arch }}/release/holon-gpui
          if-no-files-found: error
          retention-days: 1

  # Finalize the macOS universal2 artifact once both arches are built. Everything
  # from lipo onward is identical to the old single macOS job — only the two
  # cargo builds moved out (to build-macos) so they run in parallel.
  finalize-macos:
    name: Build macos
    needs: [create-release, build-macos]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Take version from create-release
        run: echo "VERSION=${{ needs.create-release.outputs.version }}" >> "$GITHUB_ENV"

      # Only the two per-arch binaries: the run also carries ios-build-logs (on
      # an iOS failure) and the dry-run dist bundles, and an unfiltered download
      # would unpack all of them into arch-bins/.
      - name: Download per-arch binaries
        uses: actions/download-artifact@v4
        with:
          pattern: holon-gpui-*
          path: arch-bins

      # lipo the two per-arch builds into the same universal2 binary the old job
      # produced. arch-bins/<artifact-name>/holon-gpui is where download-artifact
      # unpacks each upload.
      - name: Lipo → universal2
        run: |
          mkdir -p dist
          lipo -create \
            arch-bins/holon-gpui-aarch64-apple-darwin/holon-gpui \
            arch-bins/holon-gpui-x86_64-apple-darwin/holon-gpui \
            -output dist/holon-gpui-universal
          lipo -info dist/holon-gpui-universal

      - name: Bundle Holon.app
        run: bash scripts/bundle-macos.sh dist/holon-gpui-universal dist

      - name: Codesign + notarize Holon.app
        if: vars.APPLE_RELEASE_ENABLED == 'true'
        env:
          MACOS_DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$MACOS_DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" dist/Holon.app/Contents/MacOS/holon-gpui
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application" dist/Holon.app
          codesign --verify --deep --strict dist/Holon.app

          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -d > "$RUNNER_TEMP/asc-key.p8"
          ditto -c -k --keepParent dist/Holon.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/asc-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/Holon.app

      - name: Package (macOS)
        env:
          APPLE_RELEASE_ENABLED: ${{ vars.APPLE_RELEASE_ENABLED }}
        run: |
          if [ "$APPLE_RELEASE_ENABLED" = "true" ]; then
            name="Holon-$VERSION-macOS-universal"
          else
            echo "::warning::macOS build is UNSIGNED: repo variable APPLE_RELEASE_ENABLED is not 'true'." \
              "Enroll in the Apple Developer Program, add the MACOS_*/APPLE_* secrets, and set the" \
              "variable to enable signing + notarization (docs/Operations/ReleasePipeline.md)."
            name="Holon-$VERSION-macOS-universal-unsigned"
          fi
          ditto -c -k --keepParent dist/Holon.app "dist/$name.zip"
          rm -rf dist/Holon.app dist/holon-gpui-universal
          (cd dist && shasum -a 256 "$name.zip" > SHA256SUMS-macos.txt)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*

      - name: Upload artifacts to release
        if: needs.create-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/Holon-* dist/SHA256SUMS-*.txt

      - name: Keep artifacts on the run (dry run)
        if: needs.create-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-dist-macos
          path: dist/
          if-no-files-found: error

  ios-skipped:
    name: iOS → TestFlight (skipped)
    if: vars.APPLE_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why iOS is skipped
        run: |
          echo "::warning::iOS release SKIPPED: repo variable APPLE_RELEASE_ENABLED is not 'true'."
          echo "To enable: enroll in the Apple Developer Program, register the app in App Store"
          echo "Connect, add the APPLE_*/IOS_* secrets, then set APPLE_RELEASE_ENABLED=true."
          echo "Step-by-step: docs/Operations/ReleasePipeline.md"

  ios:
    name: iOS → TestFlight
    if: vars.APPLE_RELEASE_ENABLED == 'true'
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: macos-latest
    env:
      # The signed IPA carries no debuginfo, so the release profile's
      # line-tables data is compile cost that nothing consumes. Symbolicating
      # TestFlight crashes would mean keeping it and uploading the symbols.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ios
          cache-on-failure: true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Derive build number from the version
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          echo "HOLON_VERSION=$VERSION" >> "$GITHUB_ENV"
          # Deterministic monotone build number from the semver — re-submitting
          # the same version requires bumping the patch level and re-tagging.
          echo "HOLON_BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: frontends/gpui/ios
        run: xcodegen generate --spec project.yml

      - name: Import signing certificate + provisioning profile
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          printf '%s' "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PROFILE="$RUNNER_TEMP/holon.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$PROFILE"
          UUID="$(security cms -D -i "$PROFILE" | plutil -extract UUID raw -o - -)"
          NAME="$(security cms -D -i "$PROFILE" | plutil -extract Name raw -o - -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile '$NAME' ($UUID)"

      # One fastlane lane builds AND submits, so the dry run cannot be a step
      # `if:` without also skipping the build. HOLON_PUBLISH gates the submission
      # inside the lane instead; the build runs identically either way.
      - name: Build + upload to TestFlight (fastlane)
        working-directory: frontends/gpui/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          HOLON_PUBLISH: ${{ needs.create-release.outputs.publish }}
        run: fastlane ios release

      - name: Upload raw build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            frontends/gpui/ios/build/logs/
            ~/Library/Logs/gym/
          if-no-files-found: warn
          retention-days: 7

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: frontends/gpui/ios/build/Holon.ipa

      - name: Mirror submitted IPA on the GitHub Release
        if: needs.create-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            frontends/gpui/ios/build/Holon.ipa

      - name: Keep the IPA on the run (dry run)
        if: needs.create-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-ios-ipa
          path: frontends/gpui/ios/build/Holon.ipa
          if-no-files-found: error

  android-skipped:
    name: Android → Play internal + sideload APK (skipped)
    if: vars.ANDROID_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why Android is skipped
        run: |
          echo "::warning::Android release SKIPPED: repo variable ANDROID_RELEASE_ENABLED is not 'true'."
          echo "This skips BOTH the Play internal-track upload and the sideloadable holon-release.apk"
          echo "attached to the Release — Android cannot install unsigned APKs, so both need the keystore."
          echo "To enable: create a Play service account + release keystore, add the ANDROID_*/GOOGLE_*"
          echo "secrets, then set ANDROID_RELEASE_ENABLED=true."
          echo "Step-by-step: docs/Operations/ReleasePipeline.md"

  android:
    name: Android → Play internal + sideload APK
    if: vars.ANDROID_RELEASE_ENABLED == 'true'
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      # lib-release-so.sh strips the release profile's line-tables debuginfo
      # out of the packaged .so, so generating it is compile cost that nothing
      # consumes. Symbolicating Play crashes would mean keeping it and
      # uploading the symbols.
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      # Parallel rustc front end. Apple targets get this from
      # .cargo/config.toml; the Android target is not covered there.
      RUSTFLAGS: -Zthreads=8
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true

      - name: Install Android SDK components (pinned versions from build script)
        run: |
          # `yes` dies with SIGPIPE (141) when sdkmanager exits; under this shell's
          # pipefail that would fail the step even on success. The `|| true` guards
          # ONLY the `yes` writer — sdkmanager's own exit code still fails the step.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;29.0.14206865" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Derive versionCode from the version
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          # Deterministic monotone versionCode from the semver — Play rejects
          # re-uploads of the same versionCode, so re-submitting requires a
          # patch bump and a new tag.
          echo "VERSION_CODE=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"

      - name: Build Android .so
        env:
          # yeslogic-fontconfig-sys build script runs pkg-config, which cannot
          # cross-compile for Android; dlopen mode skips it (GPUI dlopens
          # libfontconfig at runtime). Mirrors frontends/gpui/justfile.
          RUST_FONTCONFIG_DLOPEN: on
        run: |
          # rust-toolchain.toml pins nightly-2026-07-17; the dtolnay `targets:` input
          # added the Android std to plain `nightly`, not the pin, so cargo ndk (on the
          # pinned toolchain) could not find std for aarch64-linux-android (E0463). Add
          # it to the active toolchain here, like the macOS job installs its targets.
          rustup target add aarch64-linux-android
          cargo ndk -t arm64-v8a -P 33 build --locked \
            -p holon-gpui --no-default-features --features mobile \
            --lib --release

      # Download + pin bundletool (produces the AAB Play requires). Fail loud on
      # a checksum mismatch — never build a release from an unverified binary.
      - name: Download + verify bundletool
        env:
          BUNDLETOOL_VERSION: "1.17.2"
          BUNDLETOOL_SHA256: "2d4ad908faea64047c1cc9cb747e6aa667c6ab192e09607bd16b67246a8cd6ae"
        run: |
          JAR="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl -fsSL -o "$JAR" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  $JAR" | sha256sum -c -
          echo "BUNDLETOOL_JAR=$JAR" >> "$GITHUB_ENV"

      # Play upload uses ONLY the AAB. The universal-ish sideload APK below is a
      # secondary artifact (GitHub Release attachment for dogfooding), not
      # uploaded to Play. Both scripts strip and size-check the .so they package
      # (frontends/gpui/android/lib-release-so.sh).
      - name: Package release-signed AAB (Play) + APK (sideload)
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          export KEYSTORE_FILE
          bash frontends/gpui/android/build-release-aab.sh
          bash frontends/gpui/android/build-release-apk.sh

      - name: Install fastlane
        if: needs.create-release.outputs.publish == 'true'
        run: sudo gem install fastlane -N

      - name: Upload to Play internal testing track (fastlane supply)
        if: needs.create-release.outputs.publish == 'true'
        working-directory: frontends/gpui/android
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          HOLON_AAB_PATH: build-release-aab/holon-release.aab
        run: fastlane android internal

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            frontends/gpui/android/build-release-aab/holon-release.aab
            frontends/gpui/android/build-release/holon-release.apk

      - name: Mirror uploaded AAB + sideload APK on the GitHub Release
        if: needs.create-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            frontends/gpui/android/build-release-aab/holon-release.aab \
            frontends/gpui/android/build-release/holon-release.apk

      - name: Keep the AAB + APK on the run (dry run)
        if: needs.create-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-android
          path: |
            frontends/gpui/android/build-release-aab/holon-release.aab
            frontends/gpui/android/build-release/holon-release.apk
          if-no-files-found: error
