name: CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'frontends/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.jscpd.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontends/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - '.jscpd.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  # MUST equal rust-toolchain.toml's `channel`. Every cargo invocation
  # auto-overrides to that pin, so a looser value here (e.g. bare `nightly`)
  # installs components onto a toolchain cargo never runs — `cargo fmt` then
  # dies with "cargo-fmt is not installed for nightly-<date>".
  RUST_VERSION: nightly-2026-07-17

jobs:
  # Detect which parts of the codebase changed
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'frontends/gpui/**'
              - 'frontends/tui/**'
              - 'frontends/mcp/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.jscpd.json'
            workflow:
              - '.github/workflows/ci.yml'

  # Rust quality checks
  rust-checks:
    name: Rust Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The ubuntu image ships ~20 GB of toolchains this workspace never uses
      # (Android SDK, .NET, GHC, CodeQL, Swift). `cargo test --workspace` plus
      # `cargo clippy --all-targets` over 43 crates outgrew what was left and
      # died mid-compile with ENOSPC — the runner could not even write its own
      # _diag log, so the failure surfaced as an unrelated rust-cache error.
      # The df lines are load-bearing: they are the only record of the real
      # margin when this recurs.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift
          df -h /

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      # rust-cache keys on the rustc version (a nightly-toolchain bump can no
      # longer reuse a stale-compiler target/) and prunes stale artifacts before
      # saving, so the cached target/ can't grow unbounded and evict the
      # infrequent release (tag) caches under the 10 GB repo budget. save-if
      # restricts cache WRITES to main: PR branches restore from main's warm
      # cache but never save, so the many parallel PR/agent branches stop
      # churning the budget. rust-cache's built-in per-prefix lock-hash fallback
      # replaces the old manual restore-keys. cache-on-failure keeps the old
      # actions/cache behavior of warming even when the job fails.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `--workspace --all-targets` pulls in every system-library crate reachable
      # on Linux — GPUI's window stack AND xcap's screen-capture stack (via
      # holon-mcp / holon-integration-tests dev-deps), which the narrower
      # gated-suites target set never reaches.
      #
      # Enumerate by REVERSE-DEPENDING ON THE BUILD TOOL, not by crate name:
      #   cargo tree -i pkg-config  --workspace --target x86_64-unknown-linux-gnu -e build,normal,dev
      #   cargo tree -i system-deps --workspace --target x86_64-unknown-linux-gnu -e build,normal,dev
      # A `-sys` name filter MISSES khronos-egl and smithay-client-toolkit.
      #
      # Crates that vendor their C (aws-lc-sys, onig_sys, zstd-sys,
      # libmimalloc-sys, libsqlite3-sys `bundled`) need nothing beyond
      # build-essential/cmake.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libx11-dev libasound2-dev libudev-dev libssl-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libpipewire-0.3-dev \
            libclang-dev
          # libdrm-dev          — drm-sys: build.rs does `pkg_config.probe("libdrm").unwrap()`
          # libgbm-dev          — gbm-sys: `#[link(name = "gbm")]`, needed to LINK test binaries
          # libegl1-mesa-dev    — khronos-egl: pkg-config probe of `egl` (provides egl.pc)
          # libpipewire-0.3-dev — libspa-sys + pipewire-sys: `system_deps` probe of `libpipewire-0.3`
          # libclang-dev        — bindgen `runtime` feature dlopens libclang for the three above
          # (libwayland-dev also covers smithay-client-toolkit's and wayland-sys' probes)

      - name: Check formatting
        run: cargo fmt --check

      # Tests and the worker rot-guard run BEFORE clippy on purpose: lint debt
      # must never mask test or build signal. Formatting stays first only
      # because it is seconds, not minutes.
      - name: Run Rust tests
        run: cargo test --workspace --exclude rust_lib_holon

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # Rot guard for the out-of-workspace wasi worker (own lockfile, no other
      # CI coverage). Invoked through `just` so CI and the local `precommit`
      # gate run the SAME steps — an inline copy here is how the two drift.
      # Do not "fix" this away.
      - name: Check holon-worker (wasm32-wasip1-threads)
        run: just check-worker-wasm

      # Same rot guard, other out-of-workspace crate: dioxus-web is wasm32-only
      # and excluded from the root workspace, so its call sites into
      # holon-frontend rot invisibly until someone builds it. web.yml also runs
      # this, but that workflow is release/pages-scoped — the drift has to fail
      # on push/PR to be worth anything.
      - name: Check dioxus-web (wasm32-unknown-unknown)
        run: just check-dioxus-web-wasm

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Feature-gated test suites that the default `cargo test --workspace` does NOT
  # reach. BugFunnel row 78: `holon-orgmode/tests/sync_controller_mutation_pbt.rs`
  # is `#![cfg(feature = "di")]`-gated; `di` is non-default, so the workspace run
  # compiled it to `0 tests` and it rotted invisibly with a real bug inside. This
  # job (1) runs the anti-rot guard that fails loud on any gated binary that lists
  # 0 tests with its feature on, and (2) actually EXECUTES the `di`-gated suites.
  # (The `pbt`-gated integration suites are already run by `rust-checks` above,
  # because `pbt` IS a default feature of holon-integration-tests.)
  gated-suites:
    name: Feature-gated test suites
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # See rust-checks: this job compiles the same GPUI-linking graph, so it
      # sits under the same ENOSPC ceiling.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift
          df -h /

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # See rust-checks: rustc-version keying + prune + main-only save. Distinct
      # `key` keeps this job's gated-integration-test target/ separate, as the
      # old distinct `-cargo-gated-` prefix did.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: gated-suites
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # The guard compiles EVERY gated integration-test binary, so it reaches
      # the same system-library graph as rust-checks' `--all-targets` — not just
      # GPUI's window stack but xcap's screen-capture stack. The narrower list
      # this job used to install made the guard fail on libspa-sys' pkg-config
      # probe rather than on the rot it exists to catch. Keep it in step with
      # the rust-checks list above, which documents what each package is for.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfontconfig1-dev libwayland-dev libxkbcommon-dev \
            libxcb1-dev libx11-dev libasound2-dev libudev-dev libssl-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libpipewire-0.3-dev \
            libclang-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # (1) Anti-rot guard: every `#![cfg(feature=...)]` test binary must list >0
      #     tests when built with its feature. Self-discovering — a new gated
      #     suite that nobody wired up is caught here.
      - name: Guard — no gated test binary is silently empty
        run: bash scripts/check-gated-test-suites.sh

      # (2) Execute the `di`-gated suites (not reached by the default workspace run).
      - name: Run di-gated holon-orgmode suites
        run: cargo nextest run -p holon-orgmode --features di

  # Rust code quality (dependency audit, unused deps, duplication)
  rust-quality:
    name: Rust Quality
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Audit dependencies (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # See rust-checks: rustc-version keying + prune + main-only save. Distinct
      # `key` keeps this job's cache separate, as the old `-cargo-quality-`
      # prefix did.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: rust-quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # `--force` is load-bearing: rust-cache restores cargo's install metadata
      # (`.crates2.json`) but not necessarily the binary, so a plain binstall
      # reports "already installed" and skips, leaving `cargo machete` missing.
      - name: Install cargo-machete
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall --no-confirm --force cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect code duplication
        run: npx jscpd .

  # Windows-target rot guard. Windows is otherwise compiled only by release.yml's
  # `build (windows)` job, so Windows-only breakage surfaced at TAG time twice:
  # the turso 264-char checkout hitting MAX_PATH, and a wmi/windows-core version
  # skew failing at type-check. `check`, not `build`, is the cheapest thing that
  # catches both — the first happens during dependency checkout, the second
  # during type-check — and it skips the link + package half of the release job.
  windows-check:
    name: Windows Check
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # A turso snapshot file checks out to a 264-char path, past Windows'
      # 260-char MAX_PATH. Only core.longpaths makes libgit2 (cargo's git-dep
      # backend) use \\?\ paths — the machine-wide LongPathsEnabled registry
      # flag does not, since cargo.exe ships no longPathAware manifest
      # (rust-lang/cargo#13020). Must precede rust-cache, which runs
      # `cargo metadata` from Node and so needs the HOME-independent --system.
      - name: Enable git long paths (Windows MAX_PATH)
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true

      # See rust-checks: rustc-version keying + prune + main-only save. Distinct
      # `key` keeps the Windows target/ separate from the Linux jobs'.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      # Same package, profile, and RUSTFLAGS as release.yml's Windows build step
      # — a flag that changes feature resolution (crt-static) must not differ, or
      # this job goes green on a configuration the release never compiles.
      - name: Check holon-gpui (windows)
        env:
          RUSTFLAGS: -C target-feature=+crt-static -Zthreads=8
        run: cargo check --release --locked -p holon-gpui

  # Summary job
  ci-complete:
    name: CI Complete
    needs: [changes, rust-checks, gated-suites, rust-quality, windows-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          failed=false
          for job in rust-checks gated-suites rust-quality windows-check; do
            case "$job" in
              rust-checks)    result="${{ needs.rust-checks.result }}" ;;
              gated-suites)   result="${{ needs.gated-suites.result }}" ;;
              rust-quality)   result="${{ needs.rust-quality.result }}" ;;
              windows-check)  result="${{ needs.windows-check.result }}" ;;
            esac
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "❌ $job: $result"
              failed=true
            else
              echo "✅ $job: $result"
            fi
          done
          if [ "$failed" == "true" ]; then
            exit 1
          fi
