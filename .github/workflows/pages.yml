name: Deploy observability report to Pages

# Publishes the static health report at /obs/ on the custom domain, by calling
# the reusable _build-obs.yml (shared with web.yml, which deploys the full
# app + /obs/). This workflow is the FAST obs-only path: it rebuilds only the
# report + run data and skips the ~15 min wasm build.
#
# NOTE: GitHub Pages deploys atomically (one artifact = the whole site). Once
# web.yml has deployed the app at /, running THIS workflow would overwrite the
# app with an obs-only site. Retire this workflow after web.yml is live.
#
# Triggers: push to main touching the report or this workflow, and manual
# dispatch. Run it after `just obs-push` to refresh the live site.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "observability/report/**"
      - ".github/workflows/pages.yml"
      - ".github/workflows/_build-obs.yml"

permissions:
  contents: read
  actions: read # download-artifact
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build-obs.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download obs artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-site
          path: site/obs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
