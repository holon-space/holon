[workspace]
members = ["."]

[package]
name = "holon-guest-testkit"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
holon-abi-guest = { path = "../abi-guest" }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
