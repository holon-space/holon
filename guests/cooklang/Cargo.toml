[workspace]
members = ["."]

[package]
name = "holon-guest-cooklang"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
holon-abi-guest = { path = "../abi-guest" }
cooklang = "=0.18.7"
serde_json = "1"
serde_yaml = "0.9"
# Decoding only — the German units file is read, never written.
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
