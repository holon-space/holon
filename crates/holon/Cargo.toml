[package]
name = "holon"
version = "0.1.0"
edition = "2024"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
# Holon crates deliberately stay on the registry `loro_fractional_index = "= 1.6.0"`
# while the loro fork pulls its own 1.13.0 as a path package (see root Cargo.toml).
# Dropping the dep would change that resolution. TODO verify with Martin.
ignored = ["loro_fractional_index", "workspace-hack"]

[lib]
name = "holon"
path = "src/lib.rs"

[features]
default = ["iroh-sync"]
# Dev-facing ONLY. `holon`'s library needs no iroh — the P2P transport moved out
# with `loro_module.rs`. The sync-suite PBT in `tests/` drives
# `holon_loro::iroh_sync_adapter::IrohSync`, which `holon-loro` gates behind its
# own `iroh-sync`, so this feature reaches nothing but the dev-dependency.
iroh-sync = ["holon-loro/iroh-sync"]
# Enable test helpers for integration tests that need access to test utilities
test-helpers = ["dep:tempfile", "testing", "test-yield"]
# Enable proptest-backed test utilities (`holon::testing`, `api::pbt_infrastructure`).
# Keeps proptest / proptest-state-machine out of production builds.
testing = ["dep:proptest", "dep:proptest-state-machine"]
# Widen the compound write step at the two points a competing write could
# overtake it (see `EntityWriteLocks`), so the interleave a compound must
# survive is forceable instead of a stopwatch race. Test-only: it changes
# nothing but WHEN a task may be preempted. Implied by `test-helpers`.
test-yield = []

[dependencies]
loro.workspace = true
loro_fractional_index.workspace = true
tokio-stream.workspace = true
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
turso.workspace = true
turso_core.workspace = true
turso_sdk_kit.workspace = true
holon-macros.workspace = true
holon-api.workspace = true
holon-core.workspace = true
holon-org-format.workspace = true
holon-turso.workspace = true
holon-advice.workspace = true
prqlc.workspace = true
gql-parser.workspace = true
gql-transform.workspace = true
rand.workspace = true
holon-petri.workspace = true
holon-rules.workspace = true
# ADR 0032 — the derived net `BackendEngine::derived_net` returns.
holon-net.workspace = true
holon-kitchen.workspace = true
holon-profiles.workspace = true
fluxdi.workspace = true
futures.workspace = true
futures-signals.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["full"] }
uuid.workspace = true
proptest = { workspace = true, optional = true }
proptest-state-machine = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

# wasm32-wasip1-threads (holon-worker) — wasi has std::time and std::thread
# but tokio refuses `rt-multi-thread` on any wasm target, and wasi doesn't
# carry a TLS stack so reqwest/iroh stay native-only. The deps below are
# the minimum holon source needs at compile time on wasi.
[target.'cfg(target_os = "wasi")'.dependencies]
tokio = { workspace = true, default-features = false, features = ["sync", "macros", "rt", "time"] }
uuid.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
tokio = { workspace = true, default-features = false, features = ["sync", "macros", "rt", "time"] }
getrandom.workspace = true
uuid = { workspace = true, features = ["js"] }
wasm-bindgen-futures = "0.4"
# Browser-backed Instant/SystemTime. wasm32-unknown has no std::time clock.
# wasm32-wasip1-threads (the holon-worker target) has std::time and uses the
# native paths instead.
web-time = "1"

[dev-dependencies]
holon-block-roundtrip-testing.workspace = true
# TEST-ONLY, and it must stay that way: a production dep would make the
# substrate read its own profile, and the profile would stop being an
# independent statement ABOUT it (pinned by holon-architecture-tests).
holon-capability.workspace = true
holon-engine = { path = "../holon-engine" }
holon-filesystem.workspace = true
holon-loro = { workspace = true, features = ["test-helpers"] }
# dev-only cycle: holon-loro-wiring depends on holon. Cargo allows this for
# dev-dependencies, and holon's Loro-backed tests need the wiring it moved to.
holon-loro-wiring = { workspace = true, features = ["testing"] }
holon-sharing.workspace = true
holon-orgmode = { workspace = true, features = ["di"] }
# TEST-ONLY: the shopping e2e reads the shipped sidecar's own mapping so the
# fake peer answers through the connection production uses.
holon-rows.workspace = true
serde_yaml.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
rhai.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber.workspace = true
serial_test.workspace = true
tempfile.workspace = true
similar-asserts = "1.7.0"

