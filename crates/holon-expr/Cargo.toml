[package]
name = "holon-expr"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
# `internals` exposes `AST::walk` / `Expr` / `ASTNode` so `CompiledExpr` can
# derive the free-variable (required-column) set from the compiled AST at
# compile time. Additive: it only widens the public surface, no behaviour
# change. Contained to this crate — downstream crates consume the derived
# `required_columns: BTreeSet<String>`, never the rhai internals types.
rhai = { version = "1", features = ["sync", "internals"] }
serde = { version = "1", features = ["derive"] }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
