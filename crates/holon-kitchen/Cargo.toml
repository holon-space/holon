[package]
name = "holon-kitchen"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
holon-api.workspace = true
holon-core.workspace = true
holon-profiles.workspace = true
anyhow.workspace = true
holon-rows.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
# The shopping sidecar's own tests drive it through the GENERIC list path, so
# the connection it declares is what they exercise.
holon-connections.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
