[package]
name = "holon-kitchen"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
holon-api.workspace = true
holon-core.workspace = true
holon-profiles.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
holon-rows.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
cooklang = "0.18"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
# The sync round is async over the `ShoppingPeer` trait; the tests drive it with
# a mock peer, so no HTTP stack is needed here.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
