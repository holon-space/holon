name: recipe
default_lifetime: persistent
primary_key: id
graph_label: Recipe
source: pre_configured
fields:
  - name: id
    sql_type: TEXT
    primary_key: true
    indexed: true
  # Vault-relative path of the authoritative `.cook` file. The file is the
  # source of truth; this column is the link back to it, never a copy of it.
  - name: source_path
    sql_type: TEXT
    indexed: true
  - name: title
    sql_type: TEXT
  - name: servings
    sql_type: INTEGER
    nullable: true
  - name: course
    sql_type: TEXT
    nullable: true
  # The overflow bag every authoring write needs: the engine stamps
  # `_provenance` onto each `create`, and a type with nowhere to put it is
  # refused at the write boundary rather than written without its origin.
  - name: properties
    sql_type: TEXT
    nullable: true
    jsonb: true
    value_kind: overflow_properties
  # `properties`' companion: it records each key's value KIND so a stored NULL
  # stays distinguishable from an absent key on read-back.
  - name: property_kinds
    sql_type: TEXT
    nullable: true
    value_kind: overflow_property_kinds
