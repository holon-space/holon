name: ingredient_use
default_lifetime: persistent
primary_key: id
graph_label: IngredientUse
source: pre_configured
fields:
  - name: id
    sql_type: TEXT
    primary_key: true
    indexed: true
  - name: recipe_id
    sql_type: TEXT
    indexed: true
  # Verbatim cooklang ingredient text. Never normalised away — it is what the
  # unmatched-ingredient affordance shows the user.
  - name: raw_name
    sql_type: TEXT
  - name: quantity
    sql_type: REAL
    nullable: true
  - name: unit
    sql_type: TEXT
    nullable: true
  # Filled by Inc D's product binding. NULL here means UNMATCHED, and stays
  # visible as such — it is never treated as zero in a rollup.
  - name: product_id
    sql_type: TEXT
    nullable: true
    indexed: true
  - name: step_index
    sql_type: INTEGER
  # The overflow bag every authoring write needs: the engine stamps
  # `_provenance` onto each `create`, and a type with nowhere to put it is
  # refused at the write boundary rather than written without its origin.
  - name: properties
    sql_type: TEXT
    nullable: true
    jsonb: true
    value_kind: overflow_properties
  # `properties`' companion: it records each key's value KIND so a stored NULL
  # stays distinguishable from an absent key on read-back.
  - name: property_kinds
    sql_type: TEXT
    nullable: true
    value_kind: overflow_property_kinds
