name: pantry_item
default_lifetime: persistent
primary_key: id
graph_label: PantryItem
source: pre_configured
fields:
  - name: id
    sql_type: TEXT
    primary_key: true
    indexed: true
  # What the user stocked, in their own words. This is the cookable-now join
  # key against `ingredient_use.raw_name`: people stock "flour", not a product
  # id. `product_id` takes over as the key once Inc D's alias table can bind
  # both sides.
  - name: name
    sql_type: TEXT
    indexed: true
  - name: quantity
    sql_type: REAL
  # Nullable so a countable staple stocked without one ("salt") can still
  # satisfy a bare `@salt`. A NULL unit matches only another NULL unit.
  - name: unit
    sql_type: TEXT
    nullable: true
  # Inc D's product binding slot, present from the start so that increment adds
  # no migration. NULL until then, and NULL never means zero.
  - name: product_id
    sql_type: TEXT
    nullable: true
    indexed: true
  - name: opened_at
    sql_type: TEXT
    nullable: true
  - name: best_before
    sql_type: TEXT
    nullable: true
  # The overflow bag every authoring write needs: the engine stamps
  # `_provenance` onto each `create`, and a type with nowhere to put it is
  # refused at the write boundary rather than written without its origin.
  - name: properties
    sql_type: TEXT
    nullable: true
    jsonb: true
  # `properties`' companion: it records each key's value KIND so a stored NULL
  # stays distinguishable from an absent key on read-back.
  - name: property_kinds
    sql_type: TEXT
    nullable: true
