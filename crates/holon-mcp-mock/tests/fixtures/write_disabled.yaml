# Writes-disabled sidecar (no `writes:` key = disabled = today's behaviour).
# `write-item` is fully classified, but the master switch is off, so the
# dispatch chokepoint denies it loud. The test overrides `command` and inserts
# MOCK_MCP_SCENARIO: write_happy (never reached — denial precedes the call).
transport:
  child_process:
    command: /bin/false
entity_prefix: "mock_"
entities:
  items:
    short_name: item
    id_column: id
    schema:
      - { name: id,    sql_type: TEXT, primary_key: true }
      - { name: title, sql_type: TEXT }
      - { name: body,  sql_type: TEXT }
tools:
  write-item:
    entity: items
    effect: keyed
    key_param: idempotency_key
