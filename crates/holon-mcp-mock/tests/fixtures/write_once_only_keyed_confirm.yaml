# Once-only sidecar, DEFAULT `confirm_manually`, that ALSO opts into remote
# dedup via `key_param`. On approval the connector re-dispatches with the minted
# idempotency key injected into the call, so the remote (WriteDuplicateDetected)
# can dedup as belt-and-braces on top of the local single-winner store
# (leases/read-write ruling, increment 4). The test overrides `command` and
# inserts MOCK_MCP_SCENARIO.
transport:
  child_process:
    command: /bin/false
entity_prefix: "mock_"
writes: enabled
entities:
  items:
    short_name: item
    id_column: id
    schema:
      - { name: id,    sql_type: TEXT, primary_key: true }
      - { name: title, sql_type: TEXT }
      - { name: body,  sql_type: TEXT }
tools:
  write-item:
    entity: items
    effect: once_only
    key_param: idempotency_key
