# The negative control for `vtable_no_identity.yaml`: byte-identical except
# that `title` is marked primary_key, so the table HAS a row identity and the
# same `live_query` over its `_fdw` table is maintainable. Connect must succeed.
transport:
  child_process:
    command: /bin/false
entity_prefix: "mock_"
entities:
  note:
    short_name: note
    profile_variants:
      - name: default
        render: >-
          live_query(#{
            sql: "SELECT title, body FROM mock_note_fdw ORDER BY title",
            item_template: row(text(col("title")))
          })
    schema:
      - { name: title, sql_type: TEXT, primary_key: true }
      - { name: body, sql_type: TEXT }
    vtable:
      list_resource: mock://items
      fetch_contract: snapshot
tools: {}
