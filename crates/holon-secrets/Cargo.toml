[package]
name = "holon-secrets"
version = "0.1.0"
edition = "2024"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
anyhow.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

# `keyring`'s default (`v1`) feature set covers exactly Windows Credential
# Manager and the *nix Secret Service; it refuses to build a store for iOS and
# Android, which is why those route to `UnavailableKeychainStore`.
[target.'cfg(all(any(unix, windows), not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
keyring = "4.1"
