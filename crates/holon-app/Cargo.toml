[package]
name = "holon-app"
version = "0.1.0"
edition = "2021"
publish = false

# The wiring crate (storage de-leak Stage 6, ADR plan quirky-dazzling-map):
# owns all DI assembly that names concrete backends (BackendEngine, Loro/OrgMode
# modules, TursoBlockQuerySource, LoroUiWatcher) so that holon-frontend and
# holon-orgmode stay storage-agnostic. Only frontends that assemble backends
# depend on this crate — never the storage-agnostic layers.

[dependencies]
holon.workspace = true
holon-api.workspace = true
# Pricing a re-home is this crate's job: `holon` may not link this (its own
# profile must stay an independent statement about it), so the decorator does.
holon-capability.workspace = true
holon-core.workspace = true
holon-profiles.workspace = true
holon-frontend.workspace = true
holon-kitchen.workspace = true
holon-orgmode.workspace = true
holon-filesystem.workspace = true
holon-loro.workspace = true
holon-loro-wiring.workspace = true
holon-turso.workspace = true
holon-mcp-client.workspace = true
# The shopping peer binds the `rest` transport's call surface, whose signatures
# are rmcp types. It lives here, not in holon-kitchen: that crate is in the
# worker's wasm graph, and rmcp's child-process transport pulls tokio features
# wasm refuses.
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", tag = "rmcp-v0.12.0", features = ["client"] }
serde_json.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
fluxdi.workspace = true
futures-signals.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
holon = { workspace = true, features = ["test-helpers"] }
holon-block-roundtrip-testing.workspace = true
holon-org-format.workspace = true
proptest.workspace = true
serde_yaml.workspace = true
tempfile.workspace = true
# `io-util`/`net`: the shopping tests drive the real `rest` transport against a
# hand-rolled local mock HTTP server, so no HTTP-server dependency is pulled in.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
toml.workspace = true
uuid.workspace = true
