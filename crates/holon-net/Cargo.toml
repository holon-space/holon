[package]
name = "holon-net"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
blake3.workspace = true
holon-api.workspace = true
holon-net-layout.workspace = true
holon-pattern.workspace = true
holon-rules.workspace = true
indexmap = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
anyhow.workspace = true
async-trait.workspace = true
holon-core.workspace = true
proptest.workspace = true
proptest-state-machine.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[features]
# Each twin breaks one executor rule, so a property test shows red for that rule.
naive-twins = []
