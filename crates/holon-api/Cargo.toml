[package]
name = "holon-api"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[features]
# Compiles the latency-SLO fault injector (`latency_slo::fault_injection`) and
# the delay it drives in the CDC apply path. OFF by default, so a release build
# has no injector to call and no branch in `LiveData::subscribe`'s hot loop.
# Enabled only by `holon-integration-tests`, whose SLO gate rungs are the one
# caller.
slo-fault-injection = []

[dependencies]
anyhow.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
holon-expr.workspace = true
holon-macros.workspace = true
holon-pattern.workspace = true
rhai = { version = "1", features = ["sync"] }
opentelemetry.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-stream.workspace = true
futures.workspace = true
futures-signals.workspace = true
uuid.workspace = true
fluent-uri.workspace = true
async-trait.workspace = true
once_cell.workspace = true
regex.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
proptest.workspace = true
serde_yaml.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = "0.4"
