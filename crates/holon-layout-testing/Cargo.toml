[package]
name = "holon-layout-testing"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[lib]
name = "holon_layout_testing"
path = "src/lib.rs"

[dependencies]
holon-api = { workspace = true }
holon-frontend = { workspace = true }
holon-pbt-core = { path = "../holon-pbt-core" }
validated = "1.0"
tokio = { workspace = true }
proptest = { workspace = true }
futures = { workspace = true }
futures-signals = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
