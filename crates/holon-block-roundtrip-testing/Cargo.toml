[package]
name = "holon-block-roundtrip-testing"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[lib]
name = "holon_block_roundtrip_testing"
path = "src/lib.rs"

[dependencies]
holon-api = { workspace = true }
# For the BlockSnapshot bridge: build/compare the substrate-agnostic
# `BlockQuerySource` capture shape against generated blocks.
holon-core = { workspace = true }
# Used internally for OrgBlockExt — the canonical block-field accessors today
# (level/tags/priority/task_state/scheduled/deadline/sequence/drawer_properties).
# These are domain-level concepts even though the trait lives in the org crate;
# moving them to holon-api is a separate refactor.
holon-org-format = { workspace = true }
proptest = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
