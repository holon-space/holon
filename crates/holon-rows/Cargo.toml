[package]
name = "holon-rows"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
holon-api.workspace = true
holon-core.workspace = true
jaq-core = "3.1.1"
jaq-json = "2.0.3"
jaq-std = "3.0.3"
serde.workspace = true
serde_json.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
proptest.workspace = true
