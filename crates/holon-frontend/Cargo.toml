[package]
name = "holon-frontend"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
# `opentelemetry-stdout` is switched on by the `otel` feature, not named in source.
ignored = ["opentelemetry-stdout", "workspace-hack"]

[features]
default = []
# PBT SUT capability traits hosted here per the cap home-rule (a cap lives in the
# crate that owns the types it names, e.g. `NavDirection`). Gated so production
# builds never pull the test vocabulary. See docs/Testing/PbtCompositionBacklog.md.
pbt = ["dep:holon-pbt-core"]
heap-profile = ["dep:dhat", "dep:ctrlc", "dep:libc"]
chrome-trace = ["dep:tracing-chrome", "dep:chrono"]
# tokio-console async-stall profiler. Adds a console_subscriber gRPC layer
# to logging::init(). Requires building with RUSTFLAGS="--cfg tokio_unstable".
tokio-console = ["dep:console-subscriber", "tokio/tracing"]
otel = ["dep:tracing-opentelemetry", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-stdout"]
blinc = ["dep:blinc_core", "dep:blinc_theme"]

[dependencies]
anyhow.workspace = true
premortem.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
tracing.workspace = true

holon-core.workspace = true
holon-macros.workspace = true
holon-api.workspace = true
# default-features = false drops holon-advice's `engine` feature (→ holon-turso →
# turso, native-only) so this shared renderer stays wasm-clean for the
# dioxus-web page. holon-frontend only uses the pure rule surface
# (GET_ADVICE_RULES_SQL, parse_discovered_rule). Native/wasi builds that also
# pull the `holon` engine re-enable `engine` via feature unification.
holon-advice = { path = "../holon-advice", default-features = false }
holon-oracles.workspace = true
# The live task-keyword promotion rule (`detect_keyword_promotion`) lives beside
# the org parser and the keyword vocabulary it must agree with; the editor VM is
# its typing-side call site.
holon-org-format.workspace = true
holon-pbt-core = { path = "../holon-pbt-core", optional = true }
async-trait.workspace = true
futures.workspace = true
futures-signals.workspace = true
fluxdi.workspace = true
dhat = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
ctrlc = { workspace = true, optional = true }
console-subscriber = { workspace = true, optional = true }
tracing-chrome = { workspace = true, optional = true }
tracing-appender.workspace = true
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-stdout = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
blinc_core = { git = "https://github.com/project-blinc/Blinc", package = "blinc_core", optional = true }
blinc_theme = { git = "https://github.com/project-blinc/Blinc", package = "blinc_theme", optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Native-only deps: not available on wasm32 (includes both wasm32-unknown-unknown
# and wasm32-wasip1-threads). Source sites guarded with #[cfg(not(target_arch = "wasm32"))].
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid.workspace = true
clap.workspace = true
holon-filesystem = { path = "../holon-filesystem" }
memory-stats.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# clap: the derive feature works on wasi (env-var reading via WASI environ_get).
# Do NOT add `env` feature here to avoid pulling os-env detection code.
clap = { version = "4", features = ["derive"] }
# `reactive.rs` mints EntityUris with `uuid::Uuid::new_v4()` on every target, so
# the native-only listing above left the wasm build with no `uuid` at all.
uuid.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# getrandom reaches this target only transitively, so nothing turns on its
# `wasm_js` feature and it refuses to build. The crate demands BOTH the feature
# and the `--cfg getrandom_backend` rustflag (.cargo/config.toml) — naming it
# here is what puts the feature in the graph. Browser target only: wasi has a
# real random source and must not take the js backend.
getrandom.workspace = true
# getrandom 0.2 is a SECOND major in this target's graph (via ahash/const-random)
# and needs its own `js` opt-in — uuid's `js` does not reach it.
getrandom_02.workspace = true
# Same shape holon-loro already uses for this target.
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tokio-stream.workspace = true
