[package]
name = "holon-connections-testing"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
holon-api.workspace = true
holon-connections.workspace = true
holon-core.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
