[package]
name = "holon-netd"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[[bin]]
name = "netd"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap.workspace = true
holon-net.workspace = true
holon-net-shell.workspace = true
holon-pattern.workspace = true
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", tag = "rmcp-v0.12.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
libc = "0.2"
proptest.workspace = true
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", tag = "rmcp-v0.12.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
