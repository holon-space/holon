[package]
name = "holon-macros-test"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[lib]
name = "holon_macros_test"
path = "src/lib.rs"

[dependencies]
holon-macros.workspace = true
holon-api.workspace = true
holon-core.workspace = true
async-trait.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
serde_json.workspace = true
