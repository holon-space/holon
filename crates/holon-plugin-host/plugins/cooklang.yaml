# The `.cook` format, declared rather than wired: nothing in Rust names
# cooklang any more, and the same file shape admits the next format.
format: cooklang
guest: cooklang.wasm
extensions: [cook]
# A plugin earns write-back only by declaring a reverse export, which this
# contract version has none of; `.cook` files in the vault are authoritative.
write_tier: read_only
scopes:
  - type: recipe
    owner_column: source_path
    id_from: source_path
    columns: [id, source_path, title, course, servings, image]
  - type: ingredient_use
    owner_column: recipe_id
    columns: [id, recipe_id, section_id, raw_name, quantity, unit, step_index]
  - type: recipe_section
    owner_column: recipe_id
    columns: [id, recipe_id, name, section_index]
  - type: cookware
    owner_column: recipe_id
    columns: [id, recipe_id, section_id, step_index, name, quantity]
  - type: recipe_timer
    owner_column: recipe_id
    columns: [id, recipe_id, section_id, step_index, name, amount, unit, seconds]
