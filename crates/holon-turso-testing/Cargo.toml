[package]
name = "holon-turso-testing"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "holon_turso_testing"
path = "src/lib.rs"

[dependencies]
holon = { workspace = true, features = ["test-helpers", "testing"] }
holon-api = { workspace = true }
holon-turso = { workspace = true }
holon-pbt-core = { path = "../holon-pbt-core" }
async-trait = { workspace = true }
proptest = { workspace = true }
validated = "1.0"
tokio = { workspace = true, features = ["sync", "time"] }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
