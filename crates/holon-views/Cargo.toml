[package]
name = "holon-views"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
differential-dataflow = { version = "=0.25.1", default-features = false }
timely = { version = "=0.31.0", default-features = false }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
