[package]
name = "holon-integration-tests"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "holon_integration_tests"
path = "src/lib.rs"

[features]
default = ["test-infra", "pbt"]
test-infra = [
    "dep:holon",
    "dep:holon-frontend",
    "dep:holon-app",
    "dep:holon-orgmode",
    "dep:holon-core",
    "dep:holon-filesystem",
    "dep:holon-api",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tempfile",
    "dep:anyhow",
    "dep:fluxdi",
    "dep:indexmap",
    "dep:futures",
]
otel-testing = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:serde",
    "dep:chrono",
    "dep:memory-stats",
]
chrome-trace = ["dep:tracing-chrome", "otel-testing"]
# tokio-console async-wait profiler. Build with
# `RUSTFLAGS="--cfg tokio_unstable" cargo test … --features tokio-console`.
# `tokio/tracing` enables task instrumentation; otel-testing brings the
# tracing-subscriber registry the ConsoleLayer attaches to.
tokio-console = ["dep:console-subscriber", "otel-testing", "tokio/tracing"]
pbt = [
    "test-infra",
    "otel-testing",
    "holon-frontend/pbt",
    "dep:holon-layout-testing",
    "dep:holon-pbt-core",
    "dep:holon-macros",
    "dep:holon-mcp",
    "dep:proptest",
    "dep:proptest-state-machine",
    "dep:loro",
    "dep:similar-asserts",
    "dep:serde_json",
    "dep:regex",
    "dep:gherkin",
    "dep:futures-signals",
    "dep:rhai",
    "dep:declarative_enum_dispatch",
    "dep:serde_yaml",
    "dep:validated",
    "dep:nonempty-collections",
    "dep:holon-block-roundtrip-testing",
]

[dependencies]
holon = { workspace = true, features = ["test-helpers"], optional = true }
holon-frontend = { workspace = true, optional = true }
holon-app = { workspace = true, optional = true }
holon-orgmode = { workspace = true, optional = true }
holon-core = { workspace = true, optional = true }
holon-filesystem = { workspace = true, optional = true }
holon-api = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs", "sync"], optional = true }
tokio-stream = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
fluxdi = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
async-trait = { workspace = true }
serde_yaml = { workspace = true, optional = true }
holon-mcp-client = { path = "../holon-mcp-client" }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", tag = "rmcp-v0.12.0", features = ["client", "server", "transport-child-process"] }
tracing = { workspace = true }
enigo = { version = "0.6", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
xcap = { git = "https://github.com/nightscape/xcap", branch = "feat/macos-offscreen-windows" }
signal-hook = "0.3"
holon-layout-testing = { path = "../holon-layout-testing", optional = true }
holon-pbt-core = { path = "../holon-pbt-core", optional = true }
holon-macros = { workspace = true, optional = true }
holon-block-roundtrip-testing = { workspace = true, optional = true }
holon-mcp = { path = "../../frontends/mcp", optional = true }
proptest = { workspace = true, optional = true }
proptest-state-machine = { workspace = true, optional = true }
loro = { workspace = true, optional = true }
similar-asserts = { version = "1.7.0", optional = true }
serde_json = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
gherkin = { version = "0.15", optional = true }
futures-signals = { workspace = true, optional = true }
rhai = { workspace = true, optional = true }
declarative_enum_dispatch = { version = "0.1", optional = true }
paste = "1.0"
validated = { version = "1.0", optional = true }
nonempty-collections = { version = "1", optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, features = ["testing"], optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-chrome = { workspace = true, optional = true }
console-subscriber = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
memory-stats = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
# Testing infrastructure (enable pbt feature for test targets)
proptest.workspace = true
proptest-state-machine.workspace = true
futures.workspace = true
similar-asserts = "1.7.0"
regex.workspace = true
loro.workspace = true
serde_json.workspace = true

