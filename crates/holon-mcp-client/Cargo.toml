[package]
name = "holon-mcp-client"
version = "0.1.0"
edition = "2024"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
futures-signals.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
rhai.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time", "net", "io-util", "process"] }
tracing.workspace = true
base64.workspace = true
url.workspace = true
sha2.workspace = true
rand.workspace = true

rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", tag = "rmcp-v0.12.0", features = ["client", "transport-streamable-http-client-reqwest", "transport-child-process", "auth"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
roxmltree = "0.20"
chrono.workspace = true
holon-api.workspace = true
holon-core.workspace = true
holon-profiles.workspace = true
holon-secrets.workspace = true
holon-turso.workspace = true
holon-macros.workspace = true
turso_core.workspace = true
turso_ext.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tempfile.workspace = true
proptest.workspace = true
# The PKCE test recomputes the S256 challenge independently of the engine.
base64.workspace = true
url.workspace = true
sha2.workspace = true
