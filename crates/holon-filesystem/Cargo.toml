[package]
name = "holon-filesystem"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
async-trait.workspace = true
sha2.workspace = true
hex.workspace = true
percent-encoding = "2.3"
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
holon-core.workspace = true
holon-macros.workspace = true
holon-api.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

# Native-only adapters: RealFileSystem (tokio::fs + gitignore-aware scan),
# NotifyWatcher (notify), FileSyncController's post-write hook (tokio::process).
# tokio refuses fs/process on wasm targets; the wasm surface of this crate is
# the port traits + sync base store only (see lib.rs cfg gates).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["fs", "process", "rt", "sync", "time"] }
ignore.workspace = true
notify = "8.0"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing-subscriber.workspace = true
