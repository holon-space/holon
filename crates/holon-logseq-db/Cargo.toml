[package]
name = "holon-logseq-db"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[dependencies]
holon-api.workspace = true
# The import base is persisted as JSON; `Block` itself is serde-free by design,
# so the base carries its own serializable shape.
serde = { workspace = true, features = ["derive"] }
# Store entry goes through `BlockOrdering`, the same boundary org re-ingest
# uses. Confined to the `ingest` module so decode/projection stays store-free.
holon-core.workspace = true
# LogSeq DB graphs are standard on-disk SQLite; libsql opens them read-only to
# read the `kvs` Transit-JSON node table.
libsql.workspace = true
# `preserve_order`: the base is persisted through `serde_json::Value`, and its
# canonical form sorts keys by building that `Value` in the order it wants —
# which a `BTreeMap`-backed `Value` would re-sort by its own rules instead.
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
# TEST-ONLY, and the arch rule pins it there: a production edge would let the
# importer read its own profile and certify only that it agrees with itself.
holon-capability.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
# The store-boundary test implements `BlockOrdering`, which is `#[async_trait]`.
async-trait.workspace = true
# The fail-loud contract tests drive MUTATED COPIES of the fixture; the copies
# live in a temp dir so the committed fixture is never written.
tempfile.workspace = true
