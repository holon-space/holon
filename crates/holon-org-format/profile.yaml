# Capability profile for the `org` durable format.
#
# What org can carry WITHOUT LOSS.
#
# READ THIS BEFORE TRUSTING A CLAUSE. Clauses come in two kinds and they carry
# very different weight:
#
#   * CERTIFIED — driven by `tests/profile_certification.rs` against the real
#     ingest → write-back → ingest loop. A certified clause that is not true is
#     a RED. The certified set GROWS as probes land — read the run's
#     `clauses driven` count rather than trusting a number written here, which
#     is exactly the kind of prose that goes stale.
#   * NOT YET CERTIFIED — declared from a `file:line` citation, and NAMED IN
#     THE `not_yet_certified:` LIST BELOW. **A citation is EVIDENCE, not a
#     gate.** Nothing tests these; changing one to a false value keeps the
#     suite green. They are documentation until a probe drives them.
#
# The list is LOAD-BEARING DATA, not a comment: the certifier fails on any
# clause that is neither driven by a probe nor named there, and reports a
# marker that has gone stale because a probe now covers it. The `#` markers
# beside each clause are prose for the reader; the list is what gates.
#
# Increment 2b.1 declares axes 3 (`property_keys`) and 4 (`property_values`)
# only. The other eight arrive in 2b.2; `deny_unknown_fields` means naming one
# here is a load error, not a silent no-op — but that guards the AXIS names,
# not the truth of a clause inside a modelled axis.
profile: org

# The escape hatch, and the ONLY one: a format-layer clause named here is
# declared from a citation and driven by nothing. The certifier prints a
# MARKER line per entry, so the report never reads like full coverage.
not_yet_certified:
  - clause: property_values_reference_values
    reason: >-
      MEASURED, not assumed: only `none` is decidable from a round trip. org's
      wire form is a bare slug for BOTH an id and a name, and every name shape
      that differs from an id shape contains a separator, which multi_value
      consumes first — probing "Some Page Title" reads back
      Refs(["Page", "Some", "Title"]), i.e. the split, not the naming. by_id
      vs by_name needs resolution, which belongs to the store.

enforced_by:
  # The parse/render code of this crate — the only layer a format-crate
  # certification harness can reach, and therefore the only layer whose
  # clauses may be marked `not_yet_certified` here.
  format:
    - hosted_kinds
    - content_representation
    - content_inline_constructs
    - content_block_constructs
    - property_keys_charset
    - property_keys_case
    - property_keys_reserved_prefixes
    - property_keys_collision
    - property_keys_schema_required
    - property_values_types
    - property_values_empty_string
    - property_values_null
    - property_values_multi_value
    - property_values_reference_values
    - ordering_sibling_order
    - ordering_order_key_durable
    - ordering_property_order
    - hierarchy_shape
    - hierarchy_max_depth
    - hierarchy_cycles
    - identity_id_space
    - identity_id_origin
    - identity_id_constraints
    - identity_carriers
    - identity_carrier_disagreement
    - mutation_write_leg
    - mutation_unit_of_write
    - assets_attachments
    - assets_binary_inline
    - assets_extensions
  # The sync controller / consolidator. These are REAL rules that a
  # format-crate probe structurally cannot see; they are not TODOs here.
  # Each deferral NAMES the code that enforces it. A deferral without a site is
  # indistinguishable from a clause nobody looked at, so the loader refuses one.
  sync:
    # MEASURED, and it CORRECTS my earlier citation: the refusal is real but it
    # is not where I said. `name_chain` bails when an ANCESTOR of a page is
    # absent from the page store — i.e. a page whose ancestor is not a page —
    # which IS "a :Page: under a non-page is refused", at resolution time
    # rather than at the moment of the edit.
    - clause: hierarchy_constraints
      site: "crates/holon-filesystem/src/sync_ports.rs:277-285 (name_chain ancestor-miss bail)"
    # A rename is a filesystem event; the controller derives the new path from
    # the new title and retires the old one.
    - clause: identity_rename_stability
      site: "crates/holon-filesystem/src/file_sync_controller.rs:573-580 (page-rename path derivation)"
    # Concurrency and merge belong to the consolidator (Model.md layer 2).
    - clause: ordering_concurrent_insert
      site: "crates/holon-loro/src/text_merge_provider.rs:126 (merge_text, 3-way merge path)"
    - clause: mutation_merge_granularity
      site: "crates/holon-loro/src/text_merge_provider.rs:126 (merge_text, 3-way merge path)"
    # Surfacing a conflict is a controller concern, above the format entirely.
    - clause: mutation_conflict_surface
      site: "crates/holon-filesystem/src/file_sync_controller.rs:1042 (3-way merger wiring, no-store conflict path)"
  # The OPERATION layer: `BlockOperations` refuses the edit BEFORE it reaches a
  # file. Not `sync` — a pre-flight refusal leaves the tree untouched and never
  # observes a resolution, and labelling it `sync` meant the coverage law read
  # an approximation.
  operation:
    - clause: hierarchy_reparent
      site: "crates/holon-core/src/traits.rs:2429-2440 (move_block page-under-non-page refusal; shared predicate block_op_catalog::page_under_non_page_prohibited; pinned by block_operations_tests.rs:1290, which asserts the tree is UNTOUCHED after the refusal)"
  # Refused when the TYPE is declared, not when a value is written.
  declaration:
    - clause: computed_live
      site: "crates/holon/src/core/type_declaration.rs:45-81 (declare_type)"
    - clause: computed_persisted
      site: "crates/holon/src/core/type_declaration.rs:45-81 (declare_type; CV-E lands in 2b.6)"
    - clause: computed_expression_closure
      site: "crates/holon/src/core/type_declaration.rs:45-81 (declare_type)"

fidelity_axes:
  # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
  # crates/holon-core/src/file_format.rs:26-35 — FileFormatParseResult carries
  # Block only, so a free-standing typed row has no org representation.
  hosted_kinds: [hierarchical]

  content:
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    # crates/holon-org-format/src/inline_marks.rs — orgize-extracted MarkSpans
    # with Unicode scalar offsets, so marks are parsed and re-emitted rather
    # than carried as an opaque string.
    representation: marked_text
    # NOT YET CERTIFIED (2b.2) — the certifier drives these in the content-axis
    # pass; UNKNOWN entries are resolved there, never left as guesses.
    inline_constructs:
      - bold
      - italic
      - verbatim
      - subscript
      - superscript
      - link_by_id
      - link_by_name
      - link_external
      - tag
      # PROMOTED 2b.2 by measurement — each was undeclared and round-tripped
      # intact, so the profile was narrower than the format.
      - underline
      - strikethrough
      - code
      # escape_sequence stays ABSENT and stays MARKED. The claim is that
      # backslash escapes are not HONOURED (a semantic question); the content
      # probe only sees whether the bytes return, so it cannot settle it. See
      # the note in tests/profile_certification.rs.
    block_constructs:
      - heading
      - paragraph
      - source_block        # parser.rs:1203-1206, ContentType::Source
      - image               # parser.rs:1314-1334, extension-detected [[file:…]]
      - planning_timestamp  # models.rs:795-822, SCHEDULED/DEADLINE
      - todo_keyword
      - priority
      # UNKNOWN RESOLVED 2b.2, and the draft was WRONG: recon found no parser
      # support for `table` or `logbook` and declared them absent. Both
      # round-trip intact through the real write-back, so both are PROMOTED —
      # along with `quote` and `list`, which the draft never mentioned. This
      # discharges the obligation that blocks 2b.5, by measurement rather than
      # by inheriting a guess.
      #
      # NUANCE: survival here is byte-level CARRIAGE — org keeps the lines. It
      # is NOT a claim that Holon models a table or a logbook; nothing parses
      # them into structure. Carriage is what this axis is about, and a
      # consumer must not read more into it.
      - table
      - logbook
      - quote
      - list

  property_keys:
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    # crates/holon-org-format/src/parser.rs:195-197 — a key that is empty or
    # contains whitespace is not a property line at all.
    charset: no_whitespace
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    # parser.rs:201 — the key is stored as authored.
    case: sensitive
    # CERTIFIED (2b.1) — driven by tests/profile_certification.rs.
    # crates/holon-org-format/src/models.rs:886, :894, :909 — `_`-prefixed keys
    # are filtered out of the drawer. THE canonical pre-existing violation, and
    # the reason the certifier exists.
    #
    # CERTIFIED NUANCE (2b.1): the erasure lives in `drawer_properties()`,
    # which the renderer runs only when `org_properties` is absent
    # (org_renderer.rs:393). A block whose `org_properties` JSON is already set
    # renders its drawer verbatim (models.rs:169-206) and CARRIES the
    # `_`-prefixed key. So the reservation is true of the flat leg and not of
    # the JSON leg. Declared conservatively here — the certifier reports the
    # JSON leg as a tightening prompt rather than pretending either leg
    # speaks for the format.
    reserved_prefixes: ["_"]
    # NOT A CLAIM, AND NOT CERTIFIABLE AS ONE — this list is an INPUT that tells
    # the certifier which keys to EXCLUDE from the ordinary-property law. A
    # wrong entry here does not make a false statement; it silently shrinks
    # coverage, which is the more dangerous failure because nothing goes red.
    # Keep it minimal and justified per key. Axis 7 (`identity`) is what will
    # certify `ID` positively; it arrives in 2b.2.
    #
    # models.rs:854-878 INTERNAL_KEYS, plus the edge fields the renderer
    # reconstructs. These are keys the format OWNS — they survive and MEAN
    # something, so the ordinary-property law says nothing about them.
    reserved_keys: [ID, TAGS, SCHEDULED, DEADLINE, COLLAPSED, WIDGET_ONLY,
                    REQUIRES, ADVICE_SUPPRESSED, CONTRIBUTES_TO]
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    # docs/Reference/ORG_SYNTAX.md:118 — serde_json::Map insert; the first
    # authored position is kept.
    collision: last_wins
    # NOT YET CERTIFIED (2b.2) — no citation, and none was found: org has no
    # schema to declare a key against, so `open` is the only shape that makes
    # sense. Certifying it needs a case that writes an undeclared key and shows
    # it is NOT refused.
    schema_required: open

  property_values:
    # CERTIFIED (2b.1) — every ValueKind is driven, declared or not.
    #
    # Org's property value space is `string` and NOTHING else.
    #
    # Both legs lose a non-string, and they lose it DIFFERENTLY — which is why
    # a finding names its leg:
    #   * flat leg — models.rs:910 gates on `Value::as_string()`, which is
    #     `None` for every non-`String` variant
    #     (crates/holon-pattern/src/value.rs:85-90), so the value is DROPPED;
    #   * JSON leg — models.rs:186-189 and :199-202 stringify via
    #     `_ => value.to_string()`, so an integer reaches disk as the text `42`
    #     and returns as `Value::String("42")`.
    #
    # The JSON leg is why `integer` is NOT listed. It "survives" only by being
    # re-typed, and an accepted-then-quietly-changed value is the one outcome
    # the certification law always calls red. Declaring `integer` on the
    # strength of that leg would be the subtlest lie in this file.
    # (parser.rs:975,1018 close the loop: every drawer value is read back as
    # Value::String.)
    types: [string]
    # CERTIFIED (2b.1), symmetrically: a false `dropped` is caught too — the
    # certifier probes the empty value on BOTH arms and raises a tightening
    # prompt if a leg carries it.
    #
    # MEASURED 2b.1, and it CORRECTS the draft's §0 correction: an empty value
    # survives the RENDER leg exactly as documented (`:KEY: ` with the required
    # trailing space — models.rs:202, docs/Reference/ORG_SYNTAX.md:103-106) but
    # does NOT survive INGEST. orgize's `headline.properties()` does not yield
    # the pair at all, with or without the trailing space, so
    # `extract_properties` (parser.rs:1124-1141, which filters nothing) never
    # sees it. Net over the full round trip: dropped.
    #
    # SCOPE: certified for the HEADLINE drawer, which is what 2b.1 probes. The
    # file-level drawer has its own hand-rolled reader (`parse_drawer_line`,
    # parser.rs:192-203) that does NOT drop an empty value, so it may well
    # differ — 2b.2 adds that carrier and the certifier will say so.
    empty_string: dropped
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    # The `Null` KIND is driven by `types` above; this clause, which is about
    # the null INHABITANT, is read by nothing today.
    null: dropped
    # NOT YET CERTIFIED (2b.2) — citations are evidence, not a gate.
    multi_value:
      kind: delimited
      # parser.rs:1493 — `c == ',' || c.is_whitespace()`, and `is_whitespace`
      # is the Unicode property, not ASCII space. Every MEASURED delimiter is
      # declared: comma, space, TAB and NBSP (U+00A0), each found by the
      # certifier's negative arm rather than by reading the predicate.
      # `\n`/`\r` are NOT delimiters here — they TERMINATE the drawer line, so
      # the field is destroyed rather than split (measured: empty readback).
      # Naming one of several true delimiters was a claim nothing could
      # falsify.
      separators: [",", " ", "\t", "\u00a0"]
      # models.rs:934-940 — REQUIRES is sorted on render, so order is not
      # semantic.
      semantics: set
      # parser.rs:930-931 — only the edge fields split; an ordinary property
      # containing spaces stays one string.
      scope: edge_fields_only
    # NOT DRIVEN, and the reason is that it is not DISCRIMINABLE here. A bare
    # id coming back proves the STRING survived; whether the format means it
    # `by_id`, `by_name` or as a `vector_of_refs` is a question about
    # RESOLUTION, which belongs to the store. The earlier probe gated on
    # `!= none` and so certified all three non-none values identically. The
    # marker is DATA in `not_yet_certified:` above, not this comment.
    # docs/Reference/ORG_SYNTAX.md:139-141 — bare ids on disk, scheme added at
    # the parse boundary and stripped at render.
    reference_values: by_id

  ordering:
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    # parser.rs:791-792 — a sequence counter in iteration order; order IS
    # position in the file and there is no key on disk.
    sibling_order: file_position
    order_key_durable: derived
    concurrent_insert: positional_conflict
    # models.rs:40-43 — the `_drawer_order` carrier records the author's key
    # order and the renderer replays it. Note the carrier is itself
    # `_`-prefixed, so it lives in the STORED properties bag and never in the
    # drawer; that is deliberate and not a violation of reserved_prefixes.
    property_order: preserved

  hierarchy:
    # NOT YET CERTIFIED (2b.2) — citations are evidence, not a gate.
    shape: forest
    max_depth: unbounded          # parser.rs:1067-1069, recursion with no check
    reparent: constrained
    constraints:
      # docs/Reference/ORG_SYNTAX.md:186-191 — a `:Page:` tag under a non-page
      # heading is refused at ingest.
      - page_tag_requires_page_ancestor
    cycles: rejected              # parser.rs:514-549 reject_id_cycles

  identity:
    # NOT YET CERTIFIED (2b.2) — citations are evidence, not a gate.
    id_space: opaque_string
    id_origin: authored
    # MEASURED 2b.2: the draft named this and my first yaml dropped it. An id
    # carrying control characters is REFUSED — by a PANIC inside
    # `EntityUri::new` (crates/holon-api/src/entity_uri.rs:57-59), not by a
    # recoverable Err. The constraint is real; the refusal mechanism is a
    # defect, filed in the bug funnel.
    id_constraints: [valid_uri_path]
    # docs/Reference/ORG_SYNTAX.md:78 — the bare :ID: in the drawer is what
    # makes the file rename-safe.
    rename_stability: [file_rename, title_rename, move]
    # docs/Reference/ORG_SYNTAX.md:79-84 — precedence order.
    # MEASURED, and my earlier removal was WRONG. I deleted a carrier to clear a
    # gap; the verifier then drove it in five lines. With no `:ID:` and no
    # `#+ID:`, the document id IS derived from the file path plus the vault root
    # — both of which the parser already receives — and `#+ID:` overrides it.
    # That is a third carrier, fully format-visible, and the carriers law now
    # ranges over the CLOSED vocabulary so a deletion can never satisfy it
    # again.
    #
    # Named `path_derived` rather than `name_chain`: the latter is reserved for
    # LogSeq's page-NAME sense, and conflating the two would hide a real
    # difference when the two profiles are diffed.
    #
    # Order is PRECEDENCE order (docs/Reference/ORG_SYNTAX.md:79-84).
    carriers: [drawer_id, file_keyword_id, path_derived]
    # Two carriers that DISAGREE are a parse error, not a silent pick.
    # MEASURED, and POSITION-DEPENDENT — the qualifier is load-bearing:
    #   drawer FIRST + #+ID:      -> REFUSED (the declared behaviour)
    #   #+ID: first + drawer      -> ACCEPTED, keyword id wins
    #   #+TITLE: first + drawer   -> ACCEPTED, keyword id wins
    # The last two are not a silent pick between two carriers: a drawer that is
    # not the file's FIRST element is ordinary text by org's own grammar
    # (docs/Reference/ORG_SYNTAX.md:72-75), so only one carrier exists and the
    # keyword rightly wins. The authored `:ID:` line is nonetheless silently
    # INERT, which is worth a reader knowing — it is the same shape as the other
    # hand-authored-org losses found this increment, but it is correct
    # behaviour rather than a defect, so it is declared here and not filed.
    carrier_disagreement: error

  computed:
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    computed_live: full           # served by the substrate, never by org
    # A direct consequence of property_values.types: [string]. Certifying this
    # needs the declaration-time rejection, which is 2b.6.
    computed_persisted:
      kind: string_only
    # crates/holon-api/src/computation.rs:162 — one AST, eval + compile_sql;
    # Script is the disclosed SqlUnsupported escape hatch.
    expression_closure: computation_plus_script

  mutation:
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    write_leg: file
    # crates/holon-core/src/file_format.rs render_document emits whole-file
    # bytes, so the unit is the FILE even when one field changed.
    unit_of_write: file
    merge_granularity: file
    conflict_surface: log

  assets:
    # NOT YET CERTIFIED (2b.2) — citation is evidence, not a gate.
    # parser.rs:1314-1334 — extension-detected [[file:…]] becomes an Image
    # child block. No attachment directory and no ATTACH drawer support was
    # found; the assets pass resolves whether that is truly absent.
    attachments: inline_reference
    binary_inline: none
    # `tif` PROMOTED 2b.2 by measurement: the draft's list omitted it while
    # `IMAGE_EXTENSIONS` (parser.rs:1310-1312) carries it, so an authored
    # `[[file:x.tif]]` became an image block that the profile denied. Found by
    # probing plausible NEIGHBOUR extensions — the declared set alone can never
    # reveal an under-declaration.
    extensions: [png, jpg, jpeg, gif, webp, svg, bmp, ico, tiff, tif]
