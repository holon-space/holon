# Empty stand-in for the turso fork's `workspace-hack` crate, patched into the
# holon-worker workspace ONLY (see ../../Cargo.toml, the
# [patch."https://github.com/nightscape/turso.git"] section).
#
# `workspace-hack` is a cargo-hakari build-speed crate: it carries no code, only
# a dependency list that forces feature unification across turso's own workspace
# (CLI, server, stress harness). Turso's copy declares those deps unconditionally
# — including `tokio = { features = ["full"] }` — so pulling it into a
# wasm32-wasip1-threads build trips tokio's
# `compile_error!("Only features sync,macros,io-util,rt,time … on wasm")`.
# Holon's own workspace-hack avoids this by gating on
# `cfg(not(target_arch = "wasm32"))`; until the fork does the same, the worker
# swaps in this empty crate. Dropping it costs only build-time dedup.
[package]
name = "workspace-hack"
# 0.1.1, not 0.1.0: holon's own workspace-hack is also `workspace-hack 0.1.0`
# from a path source, and two same-name/same-version path packages cannot both
# be written to one lockfile. Turso depends on `version = "0.1"`, so 0.1.1 fits.
version = "0.1.1"
edition = "2021"
publish = false
description = "empty stand-in for turso's cargo-hakari workspace-hack (holon-worker patch)"
