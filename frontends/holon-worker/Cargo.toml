# Out-of-workspace crate: targets wasm32-wasip1-threads via `napi build`.
# Intentionally declares its own empty [workspace] to opt out of the holon
# root workspace. See ~/.claude/plans/nifty-bouncing-ladybug.md H3.
#
# resolver = "2" is REQUIRED: with the default resolver (v1) an empty workspace
# unifies features across all targets, so `holon`'s native-only
# `[target.'cfg(not(target_arch = "wasm32"))']` deps (iroh, reqwest → tokio
# "net"/"rt-multi-thread") leak into the wasm build and trip tokio's
# `compile_error!("Only features sync,macros,io-util,rt,time … on wasm")`.
[workspace]
resolver = "2"

[package]
name = "holon-worker"
version = "0.1.0"
edition = "2021"
publish = false
description = "Holon backend running as a Web Worker on wasm32-wasip1-threads"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
napi = { version = "3.8.3", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "3.5.2"
# NOTE: tokio refuses to compile `rt-multi-thread` on any wasm target with a
# compile_error!(): "Only features sync,macros,io-util,rt,time are supported on
# wasm." This was discovered during the Phase 1 spike (2026-04-14) and means
# H4 step 2 is FALSIFIED at compile time. The worker must run a single
# current-thread runtime; see lib.rs spawn_check() for the validated shape
# and ~/.claude/plans/nifty-bouncing-ladybug.md H4 for the implications.
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync"] }

# Turso database — same fork AND same rev as the root workspace's `[patch]`
# pin (this package is its own workspace, so it cannot inherit it). The rev is
# asserted equal to the root's by the `web-worker-smoke` CI job; bump both
# together. Only needed when the `browser` feature is on, but we pull it in
# unconditionally so `cargo check` (native) covers the shim as well.
# NOTE: `encryption` is intentionally omitted — it pulls rustls→ring, whose C
# crypto can't compile for wasm32-wasi without a wasi-sdk clang sysroot. The
# worker runs an in-memory DB (`:memory:`), so at-rest encryption is moot.
turso_core = { git = "https://github.com/nightscape/turso.git", rev = "6988b541de7d720959f4dc127991cabf01d4635e", default-features = false, features = ["fs", "json", "uuid", "time", "series"] }
anyhow = "1"
# fluxdi::Module trait, needed to register EventInfraModule (the block
# OperationProvider) during engine_init. Same git source as the root
# workspace (can't inherit — this package opts out of the workspace).
fluxdi = { git = "https://github.com/holon-space/fluxdi", branch = "dev", features = ["thread-safe", "async-factory", "lifecycle", "dynamic", "eager-resolution"] }
parking_lot = "0.12"
tracing = "0.1"
# Worker-side log sink: without a subscriber every tracing event —
# including dispatch_intent_chain ERRORs — was silently dropped, making
# failed ops look like successes from the page. fmt→stderr surfaces them
# in the worker console (visible via /web/index.html or DevTools).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
serde_json = "1"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

# Holon backend, path-deps relative to this manifest. holon-api carries the
# wire types (Value, EntityUri, UiEvent, etc.) that the worker shuttles over
# postMessage; holon owns BackendEngine and the DI lifecycle.
#
# `default-features = false` disables `iroh-sync` which depends on QUIC and
# is native-only.
holon-api = { path = "../../crates/holon-api" }
holon-core = { path = "../../crates/holon-core" }
holon = { path = "../../crates/holon", default-features = false }
# EventInfraModule, registered during engine_init (see lib.rs). Same
# `default-features = false` rationale as `holon`: its default `iroh-sync`
# feature turns on holon-loro/iroh-sync, which is QUIC- and native-only.
holon-loro-wiring = { path = "../../crates/holon-loro-wiring", default-features = false }
# holon-frontend: wasi-safe subset. default-features = false ensures no
# heap-profile / chrome-trace / otel features that pull native-only transitive
# deps. The wasi cfg gates in holon-frontend/Cargo.toml strip the rest.
holon-frontend = { path = "../../crates/holon-frontend", default-features = false }

# The unmaintained `symlink` crate (pulled by tracing-appender ← turso_sdk_kit)
# gates its functions to unix/windows/redox only, so it fails to compile on
# wasm32-wasip1-threads. Replace it with a wasi-aware drop-in (identical
# behavior on native; errors at runtime on wasm where symlinks are unsupported).
[patch.crates-io]
symlink = { path = "patches/symlink" }

# Mirror of the root workspace's loro fork patch. `[patch]` is only read from the
# workspace root of the build in progress, and this worker is its own workspace,
# so without this line it resolves registry `loro` — whose loro-internal wants
# loro_fractional_index ^1.13.0 and collides with the deliberate `= 1.6.0` pin
# that crates/holon carries. Keep the source equal to the root's.
#
loro = { git = "https://github.com/nightscape/loro.git", rev = "6f5b2d7e" }

[build-dependencies]
napi-build = "2.3.1"

[features]
# `browser` toggles the vendored Turso OPFS shim. Phase 2 enables it by
# default so the harness exercises OPFS-backed Turso.
default = ["browser"]
browser = []

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true

[profile.release-official]
inherits = "release"
codegen-units = 1
