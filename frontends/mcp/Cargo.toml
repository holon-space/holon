[package]
name = "holon-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "holon-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", tag = "rmcp-v0.12.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.1"
anyhow = { workspace = true }
chrono = { workspace = true }
holon = { workspace = true }
holon-api = { workspace = true }
holon-core = { workspace = true }
holon-profiles = { workspace = true }
holon-frontend = { workspace = true }
holon-app.workspace = true
holon-orgmode = { workspace = true, features = ["di"] }
holon-org-format = { workspace = true }
holon-filesystem = { workspace = true }
holon-loro = { workspace = true }
holon-toon = { path = "../../crates/holon-toon", features = ["serde-json"] }
fluxdi.workspace = true
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi"] }
# OpenTelemetry support (optional - only enabled if OTEL_TRACES_EXPORTER env var is set)
tracing-opentelemetry = { workspace = true, features = ["tracing-log"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { version = "0.31", features = ["http", "http-proto"] }
opentelemetry-stdout = "0.31"
axum = "0.8"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = { git = "https://github.com/nightscape/xcap", branch = "feat/macos-offscreen-windows" }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
proptest.workspace = true
holon-org-format = { workspace = true }
holon-mcp-client = { path = "../../crates/holon-mcp-client" }
