[package]
name = "holon-gpui"
version = "0.1.0"
edition = "2021"
publish = false

# `workspace-hack` is the cargo-hakari feature-unification crate: every
# member depends on it and no member references it in source, by design.
[package.metadata.cargo-machete]
ignored = ["workspace-hack"]

[lib]
name = "holon_gpui"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "holon-gpui"
path = "src/main.rs"

[[example]]
name = "design_gallery"
required-features = ["desktop"]

[[example]]
name = "refresh_cascade"
required-features = ["desktop"]

[[example]]
name = "reactive_vm_demo"
required-features = ["desktop"]

[[example]]
name = "rich_input_spike"
required-features = ["desktop"]

[[test]]
name = "reactive_vm_test"
harness = false

[[test]]
name = "gpui_gherkin_replay"
harness = false
required-features = ["pbt"]

[[test]]
name = "gpui_capture_replay"
harness = false
required-features = ["pbt"]

[[test]]
name = "gpui_windowed_minimize"
harness = false
required-features = ["pbt"]

[[test]]
name = "reactive_vm_realwindow_test"
harness = false

[[test]]
name = "executor_bridge_test"
harness = false

[[test]]
name = "test_platform_smoke"
harness = true

[[test]]
name = "gpui_sim_replay_capture"
harness = false
required-features = ["pbt"]

[[test]]
name = "nested_page_real_engine"
required-features = ["pbt"]

[features]
default = ["desktop"]
desktop = ["dep:gpui_platform"]
mobile = ["dep:gpui-mobile"]
chrome-trace = [
  "holon-frontend/chrome-trace",
  "holon-integration-tests?/chrome-trace",
]
heap-profile = ["holon-frontend/heap-profile"]
# tokio-console async-stall profiler for the live app. Build with
# RUSTFLAGS="--cfg tokio_unstable" cargo run -p holon-gpui --features tokio-console
tokio-console = ["holon-frontend/tokio-console", "tokio/tracing"]
hot-reload = ["dep:subsecond", "dep:dioxus-devtools"]
pbt = ["dep:holon-integration-tests"]

[dependencies]
# GPUI framework — pinned to same rev as gpui-mobile to ensure single gpui version
gpui = { git = "https://github.com/zed-industries/zed", rev = "56104fb17e6c5849900a4c282f42d1bfea294121" }

# Desktop-only: native platform (macOS/Linux/Windows)
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "56104fb17e6c5849900a4c282f42d1bfea294121", optional = true, features = [
  "font-kit",
] }

# Mobile-only: platform implementations for iOS/Android
gpui-mobile = { git = "https://github.com/itsbalamurali/gpui-mobile", optional = true }

# GPUI component library (buttons, inputs, modals, etc.)
# Fork's holon branch is pinned to the same zed rev as gpui-mobile.
gpui-component = { git = "https://github.com/holon-space/gpui-component", branch = "holon" }

# Holon workspace crates
holon.workspace = true
holon-frontend = { workspace = true, features = ["otel"] }
holon-app.workspace = true
holon-api.workspace = true
holon-core.workspace = true
chrono.workspace = true
holon-filesystem.workspace = true
holon-orgmode.workspace = true
holon-macros.workspace = true
holon-mcp = { path = "../mcp" }
holon-oracles.workspace = true
holon-integration-tests = { path = "../../crates/holon-integration-tests", optional = true }

# DI
fluxdi.workspace = true

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
futures.workspace = true
futures-signals.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Per-case reset (Phase 1 Option A): fresh temp org/db/config paths per rebind.
tempfile = "3"

# Observability
tracing.workspace = true
tracing-subscriber.workspace = true
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
subsecond = { version = "0.7", optional = true }
dioxus-devtools = { version = "0.7", optional = true }

# Force io-surface's default `link` feature on — core-video disables it,
# and dx/subsecond doesn't honour gpui_macos's build.rs framework directives.
[target.'cfg(target_os = "macos")'.dependencies]
io-surface = "0.16"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
android-activity = { version = "0.6", features = ["native-activity"] }
log = "0.4"

# iOS-only: route `tracing` to Apple's unified logging (os_log) so that
# `xcrun simctl log show --predicate 'process == "Holon"'` and Console.app
# capture Rust `tracing` output. A sim app's stderr is NOT captured by the
# unified logging system, so the stderr fmt layer alone left every `holon_*`
# log invisible during on-device debugging. Lightweight: cc build script over a
# tiny C shim + tracing-core/subscriber, no crypto/network deps.
[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = "0.3"

[dev-dependencies]
tempfile = "3"
# Installs the capturing tracing subscriber before `main`/the libtest harness in
# every windowed test binary (tests/test_init/mod.rs). A per-test call site
# cannot give that guarantee — the SUT emits during construction and on
# background threads.
ctor = "0.4"
# Construct an empty `EnrichedChangeStream` (a `ReceiverStream`) in
# `tests/support/mod.rs`'s canned `watch_query`, so the seeded main panel's
# `live_query(...)` builds a real node during interpret instead of an error.
tokio-stream.workspace = true
# Parses the embedded DejaVu Sans font in `icon_font_tests` to assert glyph
# coverage host-side (already in the tree via cosmic-text/fontdb).
ttf-parser = "0.25"
holon-integration-tests = { path = "../../crates/holon-integration-tests" }
holon-layout-testing = { path = "../../crates/holon-layout-testing" }
# `integrations_settings_windowed` seeds a CONFIGURED provider's state file
# before the view model loads, which needs the store and the credential-location
# types the settings surface itself deliberately never names.
holon-mcp-client.workspace = true
holon-pbt-core = { path = "../../crates/holon-pbt-core" }
validated = "1.0"
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "56104fb17e6c5849900a4c282f42d1bfea294121", features = [
  "font-kit",
  "test-support",
] }
# Offscreen pixel capture in windowed PBT tests: `capture_screenshot` returns an
# `image::RgbaImage`; the png feature enables `save` (image is already a
# workspace dep via holon-integration-tests).
image = { version = "0.25", default-features = false, features = ["png"] }
# Fast-UI test layer (tests/support, tests/layout_*): pulls in TestAppContext,
# VisualTestContext, add_window_view, run_until_parked, the TestPlatform, etc.
# Test-support is the upstream feature flag that gates these; nothing in
# release builds sees any of it. DO NOT remove — `tests/support/mod.rs` relies
# on it via gpui::{TestAppContext, WindowOptions, WindowBounds, AppContext, …}.
gpui = { git = "https://github.com/zed-industries/zed", rev = "56104fb17e6c5849900a4c282f42d1bfea294121", features = [
  "test-support",
] }
# Property-based tests (tests/gpui_composed_windowed_loop and friends).
proptest = "1"
# Windowed proptest-state-machine generation/shrinking for the composed windowed
# loop (gpui_composed_windowed_loop — same alphabet as the headless keystone).
proptest-state-machine = { workspace = true }
# Structural layout snapshot tests (tests/layout_insta).
insta = { version = "1", features = ["yaml"] }
