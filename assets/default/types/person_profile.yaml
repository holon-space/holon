entity_name: person

computed:
  display_name:
    tier: computed_persisted
    expr: >-
      if is_def_var("role") && role != () && is_def_var("email") && email != () { role + " — " + email }
      else if is_def_var("role") && role != () { role }
      else if is_def_var("email") && email != () { email }
      else { () }

variants:
  - name: default
    render: 'row(col("display_name"), col("email"))'
