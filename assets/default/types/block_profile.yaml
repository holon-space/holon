# Block entity profile: computed fields + render variants.
# Loaded by TypeRegistry to augment the macro-generated Block TypeDefinition.
# Uses the same format as org-embedded entity profiles (RawEntityProfile).
#
# This is the canonical per-block render path: every block goes through
# `live_block` → `render_entity` → TypeRegistry → block_profile (here).
# The `editing`/`default` variants wrap each block in
# `column(row(draggable(...), ...), drop_zone())` so users can drag the
# block by its bullet and drop another block onto its drop zone.
#
# (The `crates/holon-{orgmode,todoist}/queries/*_hierarchy.prql` files
# are not loaded at runtime; they are test-only fixtures.)

entity_name: block

computed:
  is_task: 'task_state != ()'
  is_source: 'content_type == "source"'
  is_image: 'content_type == "image"'
  # Query/render machinery that must be hidden (spacer) rather than shown as raw
  # text. TYPED enumeration of the exact languages — replaces the banned stringly
  # `source_language.starts_with("holon_")` smell (ADR 0024 WP3 / Q2). Crucially
  # this NO LONGER matches `holon_rule`, so a rule block is routed by `is_program`
  # to the rule card instead of being silently swallowed by the spacer variant.
  is_holon_source: 'is_source && (source_language == "holon_prql" || source_language == "holon_gql" || source_language == "holon_sql" || source_language == "render")'
  # A block renders as a live query page (the `query_block` variant → `live_block`
  # → `render_entity` → `query_and_watch`) iff it owns a query-source child AND is
  # NOT a rule-machinery heading. `rule_sibling(id) != ()` ("does block `id` own a
  # rule-head child?") is true for the `Journal Auto-Create` heading, whose only
  # query-source child is the rule's TRIGGER — program machinery that the action
  # watcher alone evaluates. Excluding it here keeps the trigger off the display-
  # query path (C-revised ruling); the same `rule_sibling` live entity already
  # backs `is_program`, so no new lookup is introduced.
  has_query_source: 'query_source(id) != () && rule_sibling(id) == ()'
  # A rule head: the `holon_rule` language or the retired `action` language
  # (ADR 0024). Pure-row check — no DB lookup.
  is_rule_head: 'is_source && (source_language == "holon_rule" || source_language == "action")'
  # Program marking (ADR 0024 WP3 / Q2 option a): a block is program iff it is a
  # rule head OR the trigger sibling of one. Clause (b) reuses the discovery
  # parent-sibling join via the `rule_sibling` live-entity lookup keyed by
  # parent_id (`rule_sibling(parent_id)` = "does my parent have a rule-head
  # child?"). `||` short-circuits so a rule head never runs the DB lookup, and
  # the sibling clause only runs for source blocks.
  is_program: 'is_rule_head || (is_source && rule_sibling(parent_id) != ())'
  # A rule using the retired `action` language — surfaced loud on the card.
  is_legacy_rule: 'source_language == "action"'
  todo_states: 'if is_def_var("document_id") && document_id != () { let d = document(document_id); if d != () { d.todo_keywords } else { () } } else { () }'

variants:
  - name: page_title
    priority: 2
    condition: 'role == "page_title"'
    render: 'text(col("content"), #{style: "h1"})'
  # NOTE: the former `root_layout` variant (hardcoded 3-column layout keyed on
  # `id == "block:root-layout"`) is GONE: the ROOT display slot's layout is now
  # synthesized from perspective/panel DATA by both render-derivation arms
  # (`BlockDomain::render_root_slot` / `loro_ui_watcher::derive_root_slot_expr`
  # via `PerspectiveSpec::layout_expr`). See holon_api::perspective.
  # Program blocks (rule heads + their trigger siblings, ADR 0024 WP3) render as
  # the rule card, NEVER as a query result or raw source text. Priority 0 wins
  # over the whole -1 variant cluster (holon_source spacer, source query_result),
  # so a `holon_sql` trigger that also matches `is_holon_source` is still routed
  # here — documented precedence, not implied variant ordering. The `if_col`
  # surfaces a loud red deprecation banner for the retired `action` language.
  - name: rule_card
    priority: 0
    condition: 'is_program'
    render: >-
      card(#{accent: "primary"},
        row(icon("orgmode"), text("Automation rule", #{bold: true}), checkbox(#{checked: true}), text("Enabled", #{color: "success"})),
        if_col("source_language", "action", error("legacy 'action' language - rename source block to holon_rule"), spacer(0)),
        text("last fired: -", #{color: "muted"}),
        text(col("content")))
  - name: source_editing
    priority: -1
    condition: 'is_source && is_focused'
    render: 'source_editor(#{language: col("source_language"), content: col("content")})'
  - name: holon_source
    priority: -1
    condition: 'is_holon_source'
    render: 'spacer(0)'
  - name: query_block
    priority: -1
    condition: 'has_query_source'
    render: 'live_block()'
  - name: image_block
    priority: -1
    condition: 'is_image'
    render: 'image(col("content"))'
  - name: editing
    priority: -1
    condition: 'is_focused'
    render: 'column(row(selectable(draggable(icon("orgmode")), #{shift_action: focus_pin(#{region: "right", block_id: col("id")})}), state_toggle(col("task_state"), #{states: col("todo_states")}), spacer(8), editable_text(col("content"))), drop_zone())'
  - name: source
    priority: -1
    condition: 'is_source && !is_program'
    render: 'query_result(#{language: col("source_language")})'
  - name: default
    priority: -1
    render: 'column(row(selectable(draggable(icon("orgmode")), #{shift_action: focus_pin(#{region: "right", block_id: col("id")})}), state_toggle(col("task_state"), #{states: col("todo_states")}), spacer(8), rendered_text(col("content"))), drop_zone())'

virtual_child:
  defaults:
    content: ""
    content_type: "text"
