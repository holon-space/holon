name: person
# The home this type declares against (ruling D54.a). `display_name` is a
# computed_persisted field, and CV-E admission refuses one whose home nobody
# stated — so this key is load-bearing, not decoration.
home: holon-native
default_lifetime: persistent
primary_key: id
graph_label: Person
source: pre_configured
fields:
  - name: id
    sql_type: TEXT
    primary_key: true
    indexed: true
  - name: email
    sql_type: TEXT
    indexed: true
    nullable: true
  - name: role
    sql_type: TEXT
    nullable: true
  - name: organization
    sql_type: TEXT
    nullable: true
  - name: phone
    sql_type: TEXT
    nullable: true
