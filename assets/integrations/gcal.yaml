# Sidecar-format generation. The app runs its own bundled copy of this file
# unless an INSTALLED copy declares the generation the running build understands
# (crates/holon-mcp-client/src/bundled_sidecars.rs).
schema_version: 2

# The Integrations sidebar row: what it says, what glyph it wears, and the page
# `integration.open_default_view` focuses in the main panel. `default_view` is
# the BARE id of a block (org convention), authored in assets/default/index.org.
display_name: "Google Calendar"
icon: calendar
default_view: gcal-view

# Google Calendar — direct HTTP API (`utcp:` + `holon:`) + generic OAuth2.
#
# WHY DIRECT HTTP (not an MCP server): this path is pure in-app HTTP with no
# subprocess, so this exact sidecar runs unchanged on desktop AND on Android/iOS
# (Martin's ruling). Google Calendar has no MCP server; it is a plain JSON API,
# reached directly via the UTCP manual below and authenticated with the generic
# `oauth2` arm (refresh-token grant — nothing Google-named in the engine).
#
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP
# ─────────────────────────────────────────────────────────────────────────────
#
# These commands write into the config directory of the PROFILE you are setting
# up: $HOLON_CONFIG_DIR when it is set, ~/.config/holon otherwise. The sidecar
# below reads its credentials as ${CONFIG_DIR}/... , which resolves to that same
# directory — so an instance launched with its own HOLON_CONFIG_DIR gets its own
# credentials and can never reach another profile's. Point the shell at the
# profile you mean before you start:
#       CFG="${HOLON_CONFIG_DIR:-$HOME/.config/holon}"; mkdir -p "$CFG"
#
# Steps 1-3:
#  1. Create an OAuth client in Google Cloud (one-time):
#       a. https://console.cloud.google.com → create/pick a project.
#       b. APIs & Services → Enable APIs → enable "Google Calendar API".
#       c. APIs & Services → OAuth consent screen → External (or Internal for a
#          Workspace) → add yourself as a Test user; scope
#          ".../auth/calendar.readonly" is enough.
#       d. APIs & Services → Credentials → Create credentials → OAuth client ID →
#          Application type: **Desktop app**. "Download JSON" → save it as
#          "$CFG"/gcal-client.json (chmod 600).
#
#  2. Extract the client id/secret into the 0600 files this sidecar reads (they
#     stay OUT of this file — it references paths only). Needs `jq`:
#       umask 077
#       jq -r '.installed.client_id'     "$CFG"/gcal-client.json > "$CFG"/gcal-client-id
#       jq -r '.installed.client_secret' "$CFG"/gcal-client.json > "$CFG"/gcal-client-secret
#       chmod 600 "$CFG"/gcal-client-id "$CFG"/gcal-client-secret
#     (Google nests these under `.installed` for Desktop-app clients; some
#     exports use `.web` — adjust the jq path if so.)
#
#  3. Run the one-time consent flow to mint a long-lived refresh token. The
#     helper opens the Google consent page, captures the redirect on
#     127.0.0.1, exchanges the code, and writes ONLY the refresh token to
#     "$CFG"/gcal-refresh-token with mode 0600. It NEVER prints the
#     token to the terminal, and Holon NEVER writes this file itself:
#       HOLON_OAUTH_CLIENT_ID=$(cat "$CFG"/gcal-client-id) \
#       HOLON_OAUTH_CLIENT_SECRET=$(cat "$CFG"/gcal-client-secret) \
#         scripts/google-oauth-bootstrap.sh gcal \
#           https://www.googleapis.com/auth/calendar.readonly
#     Verify the file is private (must print `-rw-------`):
#       ls -l "$CFG"/gcal-refresh-token
#     (If a credential file is group/world-readable, Holon REFUSES to start this
#     integration and tells you to `chmod 600` it — a readable secret is a
#     compromised one.)
#
#  4. Switch the integration on. Step 3 already did this — it calls
#     scripts/holon-integration-enable.sh, which writes
#     "$CFG"/integrations/gcal.state.toml with `enabled = true`.
#     Copying this YAML anywhere enables NOTHING: the sidecar this build runs
#     is compiled in, and the state file is the switch. To toggle by hand:
#       scripts/holon-integration-enable.sh gcal
#
#  5. Restart Holon. On boot the poll runner warms `gcal_calendar` and
#     `gcal_event` (primary calendar, rolling now-1d .. now+14d window), feeding
#     the `gcal_upcoming` matview. Access tokens live only in memory; only the
#     refresh token is on disk.
#
#  6. Verify via the `holon` MCP after restart:
#       execute_query: SELECT summary, primary FROM gcal_calendar ORDER BY summary
#       execute_query: SELECT start, summary FROM gcal_event ORDER BY start LIMIT 10
#       execute_query: SELECT start, summary FROM gcal_upcoming ORDER BY start
#
# TROUBLESHOOTING
#  - Nothing synced, no error: the refresh-token file is absent → the
#    integration is disclosed-skipped (see the boot log warning). Re-run step 3.
#  - "invalid_grant" on refresh: the refresh token was revoked/expired (e.g. the
#    Google project is still in "Testing" and the 7-day test-token window
#    lapsed). Re-run step 3. Publish the consent screen to stop expiry.
#
# ─────────────────────────────────────────────────────────────────────────────
# SCOPE OF THIS v1 (documented TODOs)
# ─────────────────────────────────────────────────────────────────────────────
# * Events are pinned to the **primary** calendar. Multi-calendar fan-out (one
#   list-events call per row of gcal_calendar) needs per-parent enumeration on
#   the SYNC path; today `enumerate_from` lives only on the write-through
#   `vtable` path, which the read-only direct-HTTP path rejects. TODO: add
#   sync-side `enumerate_from` (bounded, fail-loud max_fan_out) to sync events
#   across all calendars and populate `event.calendar_id` from the parent id.
#   Until then `gcal_event.calendar_id` is NULL (every row is the primary
#   calendar).

utcp:
  utcp_version: "1.1.3"
  manual_version: "1.0.0"
  tools:
    - name: list-calendars
      description: >-
        Calendar list. Response: { "items": [ {id, summary, primary, selected}
        ], "nextPageToken"? }. Paginated (usually one page).
      tool_call_template:
        call_template_type: http
        url: https://www.googleapis.com/calendar/v3/users/me/calendarList
        http_method: GET
    - name: list-events
      description: >-
        Events for the pinned primary calendar over a rolling window.
        singleEvents=true expands recurrences; orderBy=startTime requires it.
      tool_call_template:
        call_template_type: http
        url: https://www.googleapis.com/calendar/v3/calendars/{calendar_id}/events
        http_method: GET

holon:
  # REST has no push freshness; poll every 5 minutes (per-entity sync.interval
  # would override this). Bounds staleness without hammering the API.
  poll_interval: 5m
  auth:
    # Generic OAuth2 refresh-token grant. Secrets are referenced by name only.
    oauth2:
      token_url: https://oauth2.googleapis.com/token
      # Where Settings → Integrations → Configure… sends the system browser.
      # Without it the in-app consent flow refuses (it has nowhere to go) and
      # only the scripted bootstrap remains.
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      # Google issues a refresh token only for an offline-access request, and
      # only re-issues one when consent is forced. Both live here rather than
      # in the flow engine, which knows nothing about any one provider.
      auth_params:
        access_type: offline
        prompt: consent
      # Credentials are sourced from files here, because Holon is a GUI app and
      # environment variables do not reach it cleanly. `client_secret_file` is
      # 0600-enforced (refused loudly if group/world-readable), exactly like
      # `refresh_token_file`; `client_id_file` is not perm-checked (the OAuth
      # client id is not secret). See the extraction one-liner in the setup doc.
      #
      # Alternative (env / app-settings): drop the *_file keys and use
      #   client_id_env: GCAL_CLIENT_ID
      #   client_secret_env: GCAL_CLIENT_SECRET
      # Alternative (OS keychain — macOS, Windows, Linux Secret Service):
      #   client_secret_keychain: { service: space.holon.gcal, account: client-secret }
      client_id_file: ${CONFIG_DIR}/gcal-client-id
      client_secret_file: ${CONFIG_DIR}/gcal-client-secret
      # Written by scripts/google-oauth-bootstrap.sh (mode 0600, never by Holon).
      # ${CONFIG_DIR} is the config directory of the profile that is RUNNING
      # (HOLON_CONFIG_DIR when set, the default otherwise). A path outside it
      # — a `~/` reference included — is refused at load: it would let a
      # sandbox instance authenticate with the real profile's account.
      refresh_token_file: ${CONFIG_DIR}/gcal-refresh-token
      # Informational only (documents what the refresh token was consented
      # for; not sent on the refresh grant).
      scopes:
        - https://www.googleapis.com/auth/calendar.readonly
  tools:
    list-calendars:
      pagination:
        items_path: items
        next_token_path: nextPageToken
        token_param: pageToken
        max_pages: 20
    list-events:
      # `{now-1d}` / `{now+14d}` render to RFC3339 UTC at request time (generic
      # now-token, distinct from `${VAR}` secrets and `{arg}` path/query data).
      query:
        timeMin: "{now-1d}"
        timeMax: "{now+14d}"
        singleEvents: "true"
        orderBy: "startTime"
        maxResults: "250"
      pagination:
        items_path: items
        next_token_path: nextPageToken
        token_param: pageToken
        max_pages: 50

entity_prefix: "gcal_"

entities:
  # SYNC-only parent (calendar list). `summary`/`selected` are top-level scalars
  # mapped by name (`selected` is absent → NULL on some calendars). `is_primary`
  # is derived from the presence of Google's `primary` field (1 on the primary
  # calendar, else 0).
  calendar:
    profile_variants:
      - name: default
        render: 'row(text(col("summary")))'
    schema:
      - name: id
        sql_type: TEXT
        primary_key: true
      - name: summary
        sql_type: TEXT
        nullable: true
      # `is_primary` (not `primary`): the cache-table DDL builder does not quote
      # column identifiers, and `primary`/`end` are SQL keywords. Renamed to keep
      # CREATE TABLE valid. Google's field is `primary`; the projection/mapping
      # below reads it by its Google name.
      - name: is_primary
        sql_type: INTEGER
        nullable: true
      - name: selected
        sql_type: INTEGER
        nullable: true
    sync:
      list_tool: list-calendars
      extract_path: items
      # Map Google's `primary` field onto the keyword-safe `is_primary` column.
      project:
        is_primary:
          exists: "primary"

  # Events on the primary calendar. Google nests times under start/end objects
  # ({dateTime} for timed, {date} for all-day), so a generic field `project`
  # lifts them into flat, comparable columns and derives `all_day` from the
  # presence of `start.date`. `calendar_id` is NULL in v1 (pinned primary — see
  # the scope note in the header).
  event:
    profile_variants:
      - name: default
        render: 'row(text(col("start")), spacer(8), text(col("summary")))'
    schema:
      - name: id
        sql_type: TEXT
        primary_key: true
      - name: calendar_id
        sql_type: TEXT
        nullable: true
      - name: summary
        sql_type: TEXT
        nullable: true
      - name: start
        sql_type: TEXT
        nullable: true
      # `end_time` (not `end`): END is a SQL keyword and the cache-table DDL
      # builder does not quote column identifiers, so a bare `end` column breaks
      # CREATE TABLE. See the note on `is_primary` above.
      - name: end_time
        sql_type: TEXT
        nullable: true
      - name: all_day
        sql_type: INTEGER
        nullable: true
      - name: location
        sql_type: TEXT
        nullable: true
      - name: status
        sql_type: TEXT
        nullable: true
      - name: updated
        sql_type: TEXT
        nullable: true
    sync:
      list_tool: list-events
      extract_path: items
      # Pin the primary calendar: fills the {calendar_id} path placeholder.
      list_params:
        calendar_id: primary
      # Flatten Google's nested times into flat columns (see Projection docs).
      project:
        start:
          path: ["start.dateTime", "start.date"]
        end_time:
          path: ["end.dateTime", "end.date"]
        all_day:
          exists: "start.date"
# Derived views (generic `views:` mechanism). Each becomes
# `CREATE MATERIALIZED VIEW {entity_prefix}{name} AS {sql}` at startup.
#
# TWO CHAINED VIEWS (not one filtered view) — a measured Turso-IVM dialect limit:
# strftime('now') in a matview WHERE drops ALL rows (the DBSP filter operator
# does not evaluate it per-row), but strftime('now') in the SELECT projection
# works (same as claude-history's session_status). So:
#   1. gcal_upcoming_flagged — projects every event plus an `is_upcoming` flag
#      computed with iif(... strftime ...) in the SELECT list (IVM-supported).
#   2. gcal_upcoming — a chained view with a PLAIN-column WHERE (`is_upcoming=1`),
#      which IVM's filter operator does support. matview-on-matview is supported.
# Both verified by crates/holon-turso/tests/sidecar_views.rs — keep SQL in sync.
#
# CAVEAT (mirrors claude-history.yaml's session_status): strftime('now') is
# evaluated when IVM recomputes a row (i.e. when that event's row changes), NOT
# continuously — an event already in cache keeps its is_upcoming flag until its
# next write; the "+7 days" horizon advances on re-sync, not by wall-clock alone.
# Times are compared lexically: all-day dates ("2026-07-22") and offset
# timestamps are approximate at the window edges — good enough for an upcoming
# glance, not for exact alarms.
views:
  - name: upcoming_flagged
    sql: >-
      SELECT id, calendar_id, summary, start, end_time, all_day, location, status, updated,
             iif(start >= strftime('%Y-%m-%dT%H:%M:%S', 'now')
                 AND start < strftime('%Y-%m-%dT%H:%M:%S', 'now', '+7 days'),
                 1, 0) AS is_upcoming
      FROM gcal_event
  - name: upcoming
    sql: >-
      SELECT id, calendar_id, summary, start, end_time, all_day, location, status, updated
      FROM gcal_upcoming_flagged
      WHERE is_upcoming = 1
