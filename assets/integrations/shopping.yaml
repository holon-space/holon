# Sidecar-format generation. The app runs its own bundled copy of this file
# unless an INSTALLED copy declares the generation the running build understands
# (crates/holon-mcp-client/src/bundled_sidecars.rs).
schema_version: 1

display_name: "Shopping list"
icon: list
default_view: shopping-view

# Shopping-list peer — both legs of a bidirectional sync (Holon is a peer, never
# the master; docs/Plans/Kitchen.md §4). The wire contract is
# docs/Plans/ThatShoppingList-API-2026-09-01.md.
#
# `SHOPPING_LIST_URL` IS THE WHOLE SHARE LINK of one list, ending in the list id:
# `<scheme>://<host>/!<token>/api/list/<listId>`. That is the string the user pastes,
# exactly as the app hands it out — Holon derives nothing from it and parses none
# of it. Both calls are plain relative paths off that base, which is why this
# connector needs no list-id setting of its own.
#
# The list call answers `{items, pickedItems, version, options}`. There is no
# item id, no per-item timestamp and no etag, so the ingest is keyed
# on `(name, cat)` and runs through `holon_kitchen::shopping::ShoppingReconciler`
# rather than the generic entity mirror, which requires a server-issued id. That
# is why this file declares no `entities`: the sidecar supplies the transport
# manual, and the kitchen crate owns identity and reconciliation.
#
# `POST <base>/commit` is a batched-command write. The envelope is
# declared here so a second connector gains a write leg by authoring YAML; the
# `commands` array is the reconciler's output, passed through as a whole value.
#
# THE BASE URL IS THE CREDENTIAL for this endpoint: no auth header, an opaque
# `!`-prefixed token in a PATH segment, stable per list. Referencing it as
# `${VAR}` is what marks it secret, which is what strips it from every error, log
# line and toast the connector emits (assets/integrations/README.md §2). Never
# write a resolved URL here.

transport:
  rest:
    base_url: ${SHOPPING_LIST_URL}
    # The peer serves one unpaginated full snapshot per poll; 60s is the
    # cadence worth having while a shopping list is open.
    poll_interval: 60s
    calls:
      list-items:
        method: GET
        # Empty: the base URL already names this list. The captured request
        # carries the version it last saw plus a cache-buster, and the
        # cache-buster is load-bearing — the write leg re-reads to check its own
        # commit landed, and a cached body there reports a write as missing and
        # gets it sent twice.
        path: ""
        query:
          oldVersion: "{oldVersion}"
          version: "{version}"
          _nocache: "{nocache}"
      commit-items:
        method: POST
        path: /commit
        query:
          version: "{version}"
        body:
          oldVersion: "{version}"
          oldPickedItemsVersion: "{pickedItemsVersion}"
          device:
            id: "{deviceId}"
          lang: en
          commands: "{commands}"
        # The peer's own name for the new list version. Re-emitted under the
        # transport's neutral key so the caller carries no field name of its own.
        response_version_path: version

entities: {}

tools: {}
