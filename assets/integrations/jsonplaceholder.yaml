# Sidecar-format generation. The app runs its own bundled copy of this file
# unless an INSTALLED copy declares the generation the running build understands
# (crates/holon-mcp-client/src/bundled_sidecars.rs).
schema_version: 2

# The Integrations sidebar row: what it says, what glyph it wears, and the page
# `integration.open_default_view` focuses in the main panel. `default_view` is
# the BARE id of a block (org convention), authored in assets/default/index.org.
display_name: "JSONPlaceholder"
icon: document_text
default_view: jsonplaceholder-view

# JSONPlaceholder integration — a read-only direct-HTTP-API example.
#
# JSONPlaceholder (https://jsonplaceholder.typicode.com) is a free public fake
# REST API that needs no auth. This sidecar demonstrates the direct HTTP-API
# pair (`utcp:` + `holon:`): no MCP server, no child process — the connector
# engine calls the JSON API directly via the UTCP manual below.
#
# `GET /posts` returns a bare JSON array of
#   { "userId": <int>, "id": <int>, "title": <str>, "body": <str> }
# A bare array has no field for `sync.extract_path` to select, so the tool
# declares `result_key: posts`, which wraps the body as `{ "posts": [ ... ] }`.
#
# This file is exercised by the integration test
# crates/holon-mcp-client/tests/rest_transport_mock.rs, which points the tool
# `url` at a LOCAL mock server serving the same shape (no network in tests).

utcp:
  utcp_version: "1.1.3"
  manual_version: "1.0.0"
  tools:
    - name: list-posts
      tool_call_template:
        call_template_type: http
        url: https://jsonplaceholder.typicode.com/posts
        http_method: GET

holon:
  # A plain HTTP API has no push notifications, so entities are refreshed by
  # polling. This sidecar sets no cadence, so its sync entities fall to the
  # built-in 300s default. To override, uncomment `poll_interval`
  # (manual-wide) and/or set a per-entity `sync.interval` (which wins).
  # Accepts seconds or "30s"/"5m"/"1h".
  # poll_interval: 5m
  tools:
    list-posts:
      result_key: posts

entities:
  jp_posts:
    short_name: post
    id_column: id
    # `render_entity()` resolves a row to its entity's profile and paints
    # NOTHING when there is none, so the default view needs this variant to be
    # a list rather than a blank page.
    profile_variants:
      - name: default
        render: 'row(text(col("title")))'
    schema:
      - { name: id,     sql_type: INTEGER, primary_key: true }
      - { name: userId, sql_type: INTEGER, indexed: true }
      - { name: title,  sql_type: TEXT }
      - { name: body,   sql_type: TEXT }
    sync:
      list_tool: list-posts
      extract_path: posts
