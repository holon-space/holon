[workspace]
members = [
    "crates/holon",
    "crates/holon-advice",
    "crates/holon-api",
    "crates/holon-core",
    "crates/holon-turso",
    "crates/holon-engine",
    "crates/holon-expr",
    "crates/holon-org-format",
    "crates/holon-toon",
    "crates/holon-orgmode",
    "crates/holon-markdown",
    "crates/holon-filesystem",
    "crates/holon-frontend",
    "crates/holon-app",
    "crates/holon-block-roundtrip-testing",
    "crates/holon-layout-testing",
    "crates/holon-loro-testing",
    "crates/holon-turso-testing",
    "crates/holon-oracles",
    "crates/holon-pbt-core",
    "crates/holon-integration-tests",
    "crates/holon-mcp-client",
    "crates/holon-mcp-mock",
    "crates/holon-macros",
    "crates/holon-macros-test",
    "crates/holon-petri",
    "crates/holon-profiles",
    "crates/holon-loro",
    "crates/holon-sharing",
    "crates/holon-architecture-tests",
    "frontends/tui",
    "frontends/mcp",
    "frontends/gpui",
    "tools",
    "workspace-hack",
    "experiments/lorotree-spike",
]
exclude = [
    # naga 27 (via wgpu) + codespan-reporting 0.12 = WriteColor trait error
    # when features are unified across the workspace. Known upstream bug:
    # https://github.com/gfx-rs/wgpu/issues/7915
    # Fix landed in codespan-reporting 0.13; waiting for wgpu/naga backport:
    # https://github.com/gfx-rs/wgpu/issues/8366
    "frontends/waterui",
    # holon-worker is an out-of-workspace crate targeting wasm32-wasip1-threads
    # via `napi build`. It has its own Cargo.lock and its own [workspace] table.
    # See plan: ~/.claude/plans/nifty-bouncing-ladybug.md (Phase 1, H3).
    "frontends/holon-worker",
    # dioxus-web targets wasm32 only; web-sys/js-sys are not available on native
    # so cargo check --workspace would fail. Build via `trunk build` instead.
    "frontends/dioxus-web",
    # TEMP (W3 local only): dioxus 0.7 pulls cocoa 0.25 which conflicts with
    # gpui's pinned cocoa =0.26.0 during workspace resolution. Excluded so the
    # TUI can build/run in isolation. Revert before landing.
    "frontends/dioxus",
    # waterkit-screen (transitive via waterui) uses CGWindowListCreateImage,
    # which is obsoleted in macOS 15+ (Xcode 26 SDK). Build via the ply-specific
    # toolchain when needed; excluded from --workspace check.
    "frontends/ply",
]
resolver = "2"

[workspace.dependencies]
# === Serialization ===
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# === Async ===
tokio = { version = "1", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"
futures-signals = "0.3"

# === Error handling ===
anyhow = "1.0"
thiserror = "2.0"
miette = "7.4"

# === Observability ===
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-opentelemetry = { version = "0.32", features = ["tracing-log"] }
tracing-appender = "0.2"
tracing-chrome = "0.7"
# tokio-console async-wait profiler. Requires building with
# RUSTFLAGS="--cfg tokio_unstable" and tokio's `tracing` feature.
console-subscriber = "0.4"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["http", "http-proto"] }
opentelemetry-stdout = "0.31"
opentelemetry-appender-tracing = "0.31"

# === Time/IDs ===
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
ulid = "1.1"
fluent-uri = { version = "0.3", features = ["serde"] }

# === Data structures ===
# Bumped 1.11.1 -> 1.13.7 to ride the Holon loro fork (branch `fork-at-shallow`),
# which implements `fork_at` / `SnapshotAt` on shallow-snapshot docs — required
# for live share-sync projection (ADR 0028 §H4). The fix is redirected via the
# `[patch.crates-io]` entry below. 1.13.7 also carries perf + a checkout-hang fix.
loro = "= 1.13.7"
# Holon's own crates stay on loro_fractional_index 1.6.0 (registry). The fork's
# loro-internal pulls its workspace loro_fractional_index 1.13.0 as a separate
# path package — both are loro-family and coexist without touching other deps.
loro_fractional_index = "= 1.6.0"
indexmap = "2.12"
regex = "1.10"
rand = "0.9"
once_cell = "1.19"
similar = "2.7"
rhai = { version = "1", features = ["sync"] }

# === SQL parsing ===
sqlparser = "0.61"

# === Network ===
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
iroh = { version = "0.96.0", default-features = false }

# === Testing ===
proptest = "1.6"
proptest-state-machine = "0.7.0"
serial_test = "3.2"
tempfile = "3.23"

# === Proc macro ===
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

# === File system ===
walkdir = "2"
ignore = "0.4"

# === Crypto ===
blake3 = "1"
sha2 = "0.10"
hex = "0.4"

# === TUI ===
unicode-segmentation = "1.11"
portable-pty = "0.8"
is_ci = "1.2"
strip-ansi-escapes = "0.2"

# === Memory profiling ===
memory-stats = "1"
dhat = "0.3"
ctrlc = "3"

# === Config ===
clap = { version = "4", features = ["derive", "env"] }
premortem = "0.6"

# === Other ===
# Forked at holon-space/orgize to ship a configurable `is_tag_char` predicate
# that defaults to allowing `-` in tags (Orgzly / Logseq / Org-Roam style).
orgize = { git = "https://github.com/holon-space/orgize.git", branch = "holon" }
libsql = { version = "0.9", features = ["core", "remote"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

# === External git deps ===
# Local path overrides in .cargo/config.toml (not checked in)
# `fts` (Tantivy full-text index method + fts_match/fts_score/fts_highlight) is
# native-only by construction: the wasm frontends (holon-worker, dioxus-web) are
# excluded from this workspace with their own dep graphs, and turso_core
# additionally cfg-gates all fts code behind `not(target_family = "wasm")`.
turso = { git = "https://github.com/nightscape/turso.git", rev = "447f0faeb87c96a92dc62bfeb1f6bbb2bfddce3d", default-features = false, features = ["fts"] }
turso_core = { git = "https://github.com/nightscape/turso.git", rev = "447f0faeb87c96a92dc62bfeb1f6bbb2bfddce3d", default-features = false, features = ["json", "fts"] }
turso_sdk_kit = { git = "https://github.com/nightscape/turso.git", rev = "447f0faeb87c96a92dc62bfeb1f6bbb2bfddce3d", default-features = false }
turso_ext = { git = "https://github.com/nightscape/turso.git", rev = "447f0faeb87c96a92dc62bfeb1f6bbb2bfddce3d", default-features = false }
prqlc = { git = "https://github.com/nightscape/prql.git", branch = "main" }
prqlc-parser = { git = "https://github.com/nightscape/prql.git", branch = "main" }
gql-parser = { git = "https://github.com/holon-space/gql-to-sql.git", branch = "main" }
gql-transform = { git = "https://github.com/holon-space/gql-to-sql.git", branch = "main" }
fluxdi = { git = "https://github.com/holon-space/fluxdi", branch = "dev", features = ["thread-safe", "async-factory", "lifecycle", "dynamic", "eager-resolution"] }
r3bl_tui = { git = "https://github.com/nightscape/r3bl-open-core.git", branch = "main" }

# === Internal crates ===
holon = { path = "crates/holon" }
holon-advice = { path = "crates/holon-advice" }
holon-api = { path = "crates/holon-api" }
holon-oracles = { path = "crates/holon-oracles" }
holon-core = { path = "crates/holon-core" }
holon-engine = { path = "crates/holon-engine" }
holon-expr = { path = "crates/holon-expr" }
holon-petri = { path = "crates/holon-petri" }
holon-profiles = { path = "crates/holon-profiles" }
# default-features = false drops holon-loro's `iroh-sync` (iroh → QUIC/TLS/ring,
# native-only, fatal on wasm). holon's own `iroh-sync` feature re-enables it, so
# native builds are unchanged; the wasm worker (holon default-features = false)
# gets a loro stack with no iroh. holon is the only holon-loro consumer.
holon-loro = { path = "crates/holon-loro", default-features = false }
holon-sharing = { path = "crates/holon-sharing" }
holon-turso = { path = "crates/holon-turso" }
holon-frontend = { path = "crates/holon-frontend" }
holon-app = { path = "crates/holon-app" }
holon-macros = { path = "crates/holon-macros" }
holon-mcp-client = { path = "crates/holon-mcp-client" }
holon-org-format = { path = "crates/holon-org-format" }
holon-orgmode = { path = "crates/holon-orgmode", features = ["di"] }
holon-markdown = { path = "crates/holon-markdown" }
holon-filesystem = { path = "crates/holon-filesystem" }
holon-block-roundtrip-testing = { path = "crates/holon-block-roundtrip-testing" }

[profile.dev]
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3

[profile.release]
debug = "line-tables-only"
codegen-units = 4
panic = "abort"
lto = "thin"

# Debugger profile: full debug info for variable inspection in LLDB/DAP
# Usage: cargo build --profile debugger
# `split-debuginfo = "packed"` consolidates DWARF into a self-contained `.dSYM`
# bundle (via dsymutil) so LLDB doesn't depend on the per-crate `.o`/`.rlib`
# files cargo prunes after linking — without this, breakpoints in dependency
# crates (e.g. holon-gpui lib code) fail to bind in LLDB/DAP.
[profile.debugger]
inherits = "dev"
debug = 2
split-debuginfo = "packed"

# Coverage profile for runtime code coverage collection
# This profile enables LLVM source-based coverage instrumentation
# Usage: cargo build --profile coverage
[profile.coverage]
inherits = "dev"
debug = true
# Enable LLVM source-based code coverage instrumentation
# This adds -Cinstrument-coverage flag automatically
[profile.coverage.package."*"]
# Coverage instrumentation is enabled via RUSTFLAGS environment variable
# See scripts/run-with-coverage.sh for usage

#[patch.crates-io]
#sqlparser = { version = "0.33", default-features = false, features = [] }
psm = { git = "https://github.com/rust-lang/stacker", branch = "master" }
pathfinder_simd = { git = "https://github.com/pbdeuchler/pathfinder.git", branch = "pbd/fix_simd_renames", package = "pathfinder_simd" }

# Holon fork of zed — tracks the `holon` branch so we can add more ports
# (currently: a one-line `std::mem::forget` of an extra strong Rc<AppCell>
# inside `Application::run` on iOS so the context survives beyond the single
# pass through UIApplicationMain's finish-launching callback). Without the
# iOS patch, every Weak<AppCell> held by windows / async tasks dangles as
# soon as the first run loop tick fires applicationDidBecomeActive.
# Rebase the branch periodically onto the upstream rev used by gpui-mobile.
[patch."https://github.com/zed-industries/zed"]
gpui = { git = "https://github.com/holon-space/zed.git", branch = "holon" }
gpui_wgpu = { git = "https://github.com/holon-space/zed.git", branch = "holon" }
gpui_macos = { git = "https://github.com/holon-space/zed.git", branch = "holon" }
gpui_linux = { git = "https://github.com/holon-space/zed.git", branch = "holon" }
gpui_windows = { git = "https://github.com/holon-space/zed.git", branch = "holon" }
gpui_web = { git = "https://github.com/holon-space/zed.git", branch = "holon" }
gpui_platform = { git = "https://github.com/holon-space/zed.git", branch = "holon" }

# Holon fork of gpui-mobile — tracks the `holon` branch. Currently carries
# a single patch: wire a real display handle into wgpu's `InstanceDescriptor`
# on iOS so `Instance::create_surface_unsafe` actually produces a Metal
# surface under wgpu v29. Without this the iOS `IosWindow.renderer` stays
# `None`, every `draw()` hits the fallback, and the Metal layer shows only
# its clear color (black screen).
[patch."https://github.com/itsbalamurali/gpui-mobile"]
gpui-mobile = { git = "https://github.com/holon-space/gpui-mobile.git", branch = "holon" }

# Pre-existing ed25519-dalek 3.0.0-pre.1 incompatible with pkcs8 0.11: locally
# patched to pass KeyError::Invalid to KeyMalformed (matching 3.0.0-rc.0 fix).
[patch.crates-io]
ed25519-dalek = { path = ".cargo/patches/ed25519-dalek" }
# core-graphics 0.24.0 unchanged EXCEPT the never-called `set_font_smoothing_style`
# wrapper + its `CGContextSetFontSmoothingStyle` extern are `#[cfg(not(target_os =
# "ios"))]`. That method is dead code (no caller in the tree) but font-kit /
# gpui-mobile use sibling `CGContext` methods from the same crate, so the whole
# core-graphics staticlib CGU — including the SPI reference — is force-loaded into
# the iOS app with dead-stripping off, tripping App Store review (ITMS-90338,
# _CGContextSetFontSmoothingStyle). Gating it off keeps the symbol out of every
# iOS binary; macOS/desktop are unaffected.
core-graphics = { path = ".cargo/patches/core-graphics" }

# Holon loro fork — implements `fork_at` / `SnapshotAt` on shallow-snapshot docs
# (branch `fork-at-shallow`, based on loro-internal-v1.13.7). Needed because a
# recipient's shared subtree is a shallow-imported doc, and the per-share SQL
# projection worker forks it at a watermark to compute incremental diffs
# (crates/holon-loro/src/loro_share_backend.rs:362). Upstream 1.13.7 still bails
# with NotImplemented("fork_at on shallow docs"); this fork fills the at/after-
# shallow-root case. Patching `loro` catches ALL crates.io references (incl.
# lorotree-spike's literal `loro = "1.0"`), so the whole workspace uses the
# fork's loro-internal — no duplicate registry/path loro-internal.
# PR upstream is planned (fork-and-contribute); drop this patch when a released
# loro version ships fork_at-on-shallow.
loro = { git = "https://github.com/nightscape/loro.git", rev = "855da28b" }
