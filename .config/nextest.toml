# Test timeouts: kill anything that hangs.
# A test is "slow" after `period`; nextest sends SIGKILL after
# `period * terminate-after` total elapsed.

[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }   # 2 min hard cap

# E2E / property-based tests legitimately run long. Match by binary
# name (the cargo --test target) so non-PBT tests stay capped at 2 min.
[[profile.default.overrides]]
filter = "binary(general_e2e_pbt) + binary(extended_gen_pbt) + binary(layout_override_pbt) + binary(petri_e2e_pbt) + binary(round_trip_pbt) + binary(sync_controller_mutation_pbt) + binary(sync_suite)"
slow-timeout = { period = "60s", terminate-after = 20 }  # 20 min hard cap

# test_turso_backend_state_machine takes ~30 min when green (measured
# 1771s on 2026-06-12); 20 min always killed it mid-run.
[[profile.default.overrides]]
filter = "binary(turso_storage_pbt)"
slow-timeout = { period = "60s", terminate-after = 40 }  # 40 min hard cap
