[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# The turso fork's hakari `workspace-hack` has no license field or file. A
# clarify matches by name, so it also covers Holon's own (empty) hakari crate.
[[licenses.clarify]]
crate = "workspace-hack"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
