[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # All transitive deps — no direct fix available
    "RUSTSEC-2024-0320",  # yaml-rust unmaintained (r3bl_tui → syntect)
    "RUSTSEC-2024-0384",  # instant unmaintained (transitive)
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive)
    "RUSTSEC-2025-0057",  # fxhash unmaintained (transitive)
    "RUSTSEC-2023-0089",  # atomic-polyfill unmaintained (transitive)
    "RUSTSEC-2025-0052",  # bincode unmaintained (transitive)
    "RUSTSEC-2025-0141",  # async-std discontinued (transitive)
    # rand custom-logger unsoundness — affects rand 0.8/0.9, no fixed release yet.
    # We don't install a custom rand logger anywhere, so the unsound path is unreachable.
    "RUSTSEC-2026-0097",
    # core2 unmaintained + yanked — pulled in via image → ravif → rav1e → bitstream-io.
    # No upstream replacement yet; we don't call into core2 directly.
    "RUSTSEC-2026-0105",
    # hickory-proto 0.25 DNSSEC vulns — pulled in via iroh@0.96 → hickory-resolver@0.25.
    # Upstream moved DnssecDnsHandle to hickory-net 0.26.x; iroh has not bumped yet.
    # We don't enable DNSSEC validation through iroh, so the vulnerable paths are unreachable.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # proc-macro-error2 unmaintained, pulled in via gpui -> stacksafe-macro ->
    # stacksafe. No fix available upstream (author confirmed unmaintained,
    # recommends manyhow/proc-macro2-diagnostics as replacements — that's an
    # upstream gpui/stacksafe migration, not ours to make).
    "RUSTSEC-2026-0173",
    # quick-xml quadratic-attribute-scan / unbounded-namespace-alloc DoS —
    # both require parsing attacker-controlled XML. Our only quick-xml paths
    # are xcb/wayland-scanner parsing build-time Wayland protocol XML and X11
    # introspection (screenshot/window-capture tooling via xcap, dev-only) —
    # never untrusted network input. Unreachable in our usage.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustybuzz / ttf-parser unmaintained, transitive via gpui's font stack
    # (usvg/cosmic-text/fontdb). No safe upgrade available upstream yet.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
]

[licenses]
private = { ignore = true, registries = [] }
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "NCSA",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",  # libbz2-rs-sys — permissive, MIT/Apache-compatible
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
