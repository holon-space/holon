[graph]
targets = []
all-features = true
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # All transitive deps — no direct fix available
    "RUSTSEC-2024-0320",  # yaml-rust unmaintained (r3bl_tui → syntect)
    "RUSTSEC-2024-0384",  # instant unmaintained (transitive)
    "RUSTSEC-2024-0436",  # paste unmaintained (transitive)
    "RUSTSEC-2025-0057",  # fxhash unmaintained (transitive)
    "RUSTSEC-2023-0089",  # atomic-polyfill unmaintained (transitive)
    "RUSTSEC-2025-0052",  # bincode unmaintained (transitive)
    "RUSTSEC-2025-0141",  # async-std discontinued (transitive)
    # hickory-proto 0.25 DNSSEC vulns — pulled in via iroh@0.96 → hickory-resolver@0.25.
    # Upstream moved DnssecDnsHandle to hickory-net 0.26.x; iroh has not bumped yet.
    # We don't enable DNSSEC validation through iroh, so the vulnerable paths are unreachable.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # proc-macro-error2 unmaintained, pulled in via gpui -> stacksafe-macro ->
    # stacksafe. No fix available upstream (author confirmed unmaintained,
    # recommends manyhow/proc-macro2-diagnostics as replacements — that's an
    # upstream gpui/stacksafe migration, not ours to make).
    "RUSTSEC-2026-0173",
    # quick-xml quadratic-attribute-scan / unbounded-namespace-alloc DoS —
    # both require parsing attacker-controlled XML. Our only quick-xml paths
    # are xcb/wayland-scanner parsing build-time Wayland protocol XML and X11
    # introspection (screenshot/window-capture tooling via xcap, dev-only) —
    # never untrusted network input. Unreachable in our usage.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rustybuzz / ttf-parser unmaintained, transitive via gpui's font stack
    # (usvg/cosmic-text/fontdb). No safe upgrade available upstream yet.
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0192",
    # 2026-07-29: smallstr unmaintained, transitive via r3bl_tui → holon-tui.
    # Upstream recommends compact_str/smol_str — an r3bl_tui migration, not ours;
    # no safe upgrade exists.
    "RUSTSEC-2026-0215",
    # im / bitmaps / sized-chunks unmaintained (the bodil crates were archived
    # together). Transitive via loro-internal → loro, which we pin to a fork.
    # Upstream recommends the imbl fork; loro-internal still requires
    # `im ^15.1.0` through 1.13.9. Drop these once loro-internal migrates.
    "RUSTSEC-2026-0248",
    "RUSTSEC-2026-0247",
    "RUSTSEC-2026-0251",
    # smartstring unmaintained, transitive via rhai. rhai depends on it
    # unconditionally through 1.26.0, so no feature or upgrade avoids it.
    # Drop once rhai moves to compact_str/smol_str.
    "RUSTSEC-2026-0249",
]

[licenses]
# Checks publish = false crates too: the GPUI fork crates are git deps with
# publish = false, and skipping them hid GPL crates from this gate.
private = { ignore = false }
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",  # Unicode-3.0's predecessor; finl_unicode, via cooklang in guests/cooklang
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unlicense",
    "NCSA",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",  # libbz2-rs-sys — permissive, MIT/Apache-compatible
]
confidence-threshold = 0.8

# FSL-1.1-ALv2 is allowed for Holon's own crates only (never in `allow`), so a
# third-party FSL crate still fails and a new Holon crate needs one line here.
exceptions = [
    { crate = "holon", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-advice", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-api", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-app", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-architecture-tests", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-block-roundtrip-testing", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-capability", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-connections", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-connections-testing", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-core", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-dioxus-web", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-engine", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-expr", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-filesystem", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-frontend", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-gpui", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-guest-cooklang", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-guest-testkit", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-integration-tests", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-kitchen", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-layout-testing", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-logseq-db", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-loro", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-loro-testing", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-loro-wiring", allow = ["FSL-1.1-ALv2"] },
    { crate = "holon-macros", allow = ["FSL-1.1-ALv2"] },
