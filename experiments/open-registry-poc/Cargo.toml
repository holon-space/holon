[package]
name = "open-registry-poc"
version = "0.1.0"
edition = "2021"
description = "PoC: open, decentralized transition/generator/invariant registry for the PBT, replacing the central E2ETransition enum + declare_e2e_transitions! macro."

# Standalone workspace so it is decoupled from the parent holon workspace
# (mirrors experiments/enum-dispatch-examples/*).
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"      # open-world tagged (de)serialization for Box<dyn Transition>
inventory = "0.3"    # link-time collection: each module pushes its own registrations
dyn-clone = "1"      # recovers Clone for Box<dyn Transition> (proptest shrinker needs it)
proptest = "1"       # same generator machinery the real PBT uses
