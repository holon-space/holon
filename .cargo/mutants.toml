# cargo-mutants reads only this file. It holds no crate-specific flags:
# pass `-p`, `--features` and `--file` per run, as the per-crate table in
# docs/Testing/Testing.md ("Running mutation testing") lists them.
# `jobs` and `timeout` are CLI-only flags in cargo-mutants 27.x.

timeout_multiplier = 10.0
minimum_test_timeout = 120
test_tool = "nextest"
exclude_globs = [
  "**/tests/**", "**/test_*.rs", "**/*_test.rs",
  "**/test_macro.rs", "**/examples/**",
  "crates/holon-pbt-core/**", "crates/holon-integration-tests/**",
  "crates/holon-macros/**", "crates/holon-macros-test/**",
  "crates/*-testing/**", "crates/holon-architecture-tests/**",
  "**/frb_generated.rs", "**/*.pb.rs",
]
